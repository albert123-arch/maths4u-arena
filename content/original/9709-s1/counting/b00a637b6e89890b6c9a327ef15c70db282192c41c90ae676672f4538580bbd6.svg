<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img"><title>A pair and a separate single are different gap choices</title><rect width="1000" height="380" fill="white"/><text x="32" y="35" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#21343f" text-anchor="start">A pair and a separate single are different gap choices</text><text x="500" y="76" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">First arrange the 4 numbered counters. There are 5 gaps.</text><rect x="241.0" y="116" width="64" height="46" rx="4" fill="#d8eae5" stroke="#27676a" stroke-width="1.5"/><text x="273.0" y="145" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">R</text><rect x="315.0" y="116" width="64" height="46" rx="4" fill="#d8eae5" stroke="#27676a" stroke-width="1.5"/><text x="347.0" y="145" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">R</text><rect x="389.0" y="116" width="64" height="46" rx="4" fill="#f3f4f2" stroke="#27676a" stroke-width="1.5"/><text x="421.0" y="145" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">1</text><rect x="463.0" y="116" width="64" height="46" rx="4" fill="#f3f4f2" stroke="#27676a" stroke-width="1.5"/><text x="495.0" y="145" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">2</text><rect x="537.0" y="116" width="64" height="46" rx="4" fill="#d8eae5" stroke="#27676a" stroke-width="1.5"/><text x="569.0" y="145" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">R</text><rect x="611.0" y="116" width="64" height="46" rx="4" fill="#f3f4f2" stroke="#27676a" stroke-width="1.5"/><text x="643.0" y="145" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">3</text><rect x="685.0" y="116" width="64" height="46" rx="4" fill="#f3f4f2" stroke="#27676a" stroke-width="1.5"/><text x="717.0" y="145" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">4</text><text x="500" y="220" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">One admissible arrangement: RR is in one gap and R is in another.</text><text x="500" y="265" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#21343f" text-anchor="middle">5 choices for the pair gap; then 4 different choices for the single gap.</text><text x="500" y="310" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#21343f" text-anchor="middle">RRR is not allowed. The identical red copies are never individually labelled.</text></svg>