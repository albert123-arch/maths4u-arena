<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img"><title>Two ordinary exhibits between special exhibits</title><rect width="1000" height="430" fill="white"/><text x="32" y="35" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#21343f" text-anchor="start">Two ordinary exhibits between special exhibits</text><text x="500" y="74" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">One valid example (O = ordinary, S = special):</text><rect x="56.0" y="107" width="64" height="46" rx="4" fill="#f3f4f2" stroke="#27676a" stroke-width="1.5"/><text x="88.0" y="136" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">O1</text><rect x="130.0" y="107" width="64" height="46" rx="4" fill="#d8eae5" stroke="#27676a" stroke-width="1.5"/><text x="162.0" y="136" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">S1</text><rect x="204.0" y="107" width="64" height="46" rx="4" fill="#f3f4f2" stroke="#27676a" stroke-width="1.5"/><text x="236.0" y="136" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">O2</text><rect x="278.0" y="107" width="64" height="46" rx="4" fill="#f3f4f2" stroke="#27676a" stroke-width="1.5"/><text x="310.0" y="136" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">O3</text><rect x="352.0" y="107" width="64" height="46" rx="4" fill="#d8eae5" stroke="#27676a" stroke-width="1.5"/><text x="384.0" y="136" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">S2</text><rect x="426.0" y="107" width="64" height="46" rx="4" fill="#f3f4f2" stroke="#27676a" stroke-width="1.5"/><text x="458.0" y="136" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">O4</text><rect x="500.0" y="107" width="64" height="46" rx="4" fill="#f3f4f2" stroke="#27676a" stroke-width="1.5"/><text x="532.0" y="136" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">O5</text><rect x="574.0" y="107" width="64" height="46" rx="4" fill="#d8eae5" stroke="#27676a" stroke-width="1.5"/><text x="606.0" y="136" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">S3</text><rect x="648.0" y="107" width="64" height="46" rx="4" fill="#f3f4f2" stroke="#27676a" stroke-width="1.5"/><text x="680.0" y="136" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">O6</text><rect x="722.0" y="107" width="64" height="46" rx="4" fill="#f3f4f2" stroke="#27676a" stroke-width="1.5"/><text x="754.0" y="136" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">O7</text><rect x="796.0" y="107" width="64" height="46" rx="4" fill="#f3f4f2" stroke="#27676a" stroke-width="1.5"/><text x="828.0" y="136" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">O8</text><rect x="870.0" y="107" width="64" height="46" rx="4" fill="#f3f4f2" stroke="#27676a" stroke-width="1.5"/><text x="902.0" y="136" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">O9</text><text x="500" y="198" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">Internal gap numbers chosen in this example: 1, 3, 5.</text><text x="500" y="243" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#21343f" text-anchor="middle">Shift the three gap numbers by 0, 1, 2 respectively: 1, 2, 3.</text><text x="500" y="292" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">In general: (i, j, k) maps to (i, j−1, k−2), a triple from 1 to 6.</text><text x="500" y="341" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#21343f" text-anchor="middle">The reverse shift restores the required separation, so the correspondence is one-to-one.</text><text x="500" y="391" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#21343f" text-anchor="middle">The identities and orders of all ordinary and special exhibits are counted separately.</text></svg>