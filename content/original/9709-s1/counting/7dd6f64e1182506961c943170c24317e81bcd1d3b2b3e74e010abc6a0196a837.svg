<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img"><title>Two red pairs in two different gaps</title><rect width="1000" height="380" fill="white"/><text x="32" y="35" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#21343f" text-anchor="start">Two red pairs in two different gaps</text><text x="500" y="74" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">Each RR block is inserted into a different gap between grey positions.</text><rect x="278.0" y="109" width="64" height="46" rx="4" fill="#d8eae5" stroke="#27676a" stroke-width="1.5"/><text x="310.0" y="138" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">RR</text><rect x="352.0" y="109" width="64" height="46" rx="4" fill="#f3f4f2" stroke="#27676a" stroke-width="1.5"/><text x="384.0" y="138" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">G</text><rect x="426.0" y="109" width="64" height="46" rx="4" fill="#d8eae5" stroke="#27676a" stroke-width="1.5"/><text x="458.0" y="138" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">RR</text><rect x="500.0" y="109" width="64" height="46" rx="4" fill="#f3f4f2" stroke="#27676a" stroke-width="1.5"/><text x="532.0" y="138" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">G</text><rect x="574.0" y="109" width="64" height="46" rx="4" fill="#f3f4f2" stroke="#27676a" stroke-width="1.5"/><text x="606.0" y="138" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">G</text><rect x="648.0" y="109" width="64" height="46" rx="4" fill="#f3f4f2" stroke="#27676a" stroke-width="1.5"/><text x="680.0" y="138" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">G</text><text x="500" y="189" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">All gaps allowed: choose two from 5 gaps.</text><rect x="278.0" y="218" width="64" height="46" rx="4" fill="#f3f4f2" stroke="#27676a" stroke-width="1.5"/><text x="310.0" y="247" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">G</text><rect x="352.0" y="218" width="64" height="46" rx="4" fill="#d8eae5" stroke="#27676a" stroke-width="1.5"/><text x="384.0" y="247" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">RR</text><rect x="426.0" y="218" width="64" height="46" rx="4" fill="#f3f4f2" stroke="#27676a" stroke-width="1.5"/><text x="458.0" y="247" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">G</text><rect x="500.0" y="218" width="64" height="46" rx="4" fill="#d8eae5" stroke="#27676a" stroke-width="1.5"/><text x="532.0" y="247" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">RR</text><rect x="574.0" y="218" width="64" height="46" rx="4" fill="#f3f4f2" stroke="#27676a" stroke-width="1.5"/><text x="606.0" y="247" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">G</text><rect x="648.0" y="218" width="64" height="46" rx="4" fill="#f3f4f2" stroke="#27676a" stroke-width="1.5"/><text x="680.0" y="247" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">G</text><text x="500" y="306" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">Grey at both ends: choose two from 3 internal gaps.</text><text x="500" y="346" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#21343f" text-anchor="middle">Both rows are examples, not extra conditions. The two RR blocks are identical.</text></svg>