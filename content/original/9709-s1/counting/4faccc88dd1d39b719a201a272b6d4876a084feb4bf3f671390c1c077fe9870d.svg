<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img"><title>Two ordinary exhibits between special exhibits</title><rect width="1000" height="430" fill="white"/><text x="32" y="35" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#21343f" text-anchor="start">Two ordinary exhibits between special exhibits</text><text x="500" y="74" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">One valid example (O = ordinary, S = special):</text><rect x="50.0" y="107" width="59.230769230769226" height="46" rx="4" fill="#f3f4f2" stroke="#27676a" stroke-width="1.5"/><text x="79.61538461538461" y="136" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">O1</text><rect x="119.23076923076923" y="107" width="59.230769230769226" height="46" rx="4" fill="#d8eae5" stroke="#27676a" stroke-width="1.5"/><text x="148.84615384615384" y="136" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">S1</text><rect x="188.46153846153845" y="107" width="59.230769230769226" height="46" rx="4" fill="#f3f4f2" stroke="#27676a" stroke-width="1.5"/><text x="218.07692307692307" y="136" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">O2</text><rect x="257.6923076923077" y="107" width="59.230769230769226" height="46" rx="4" fill="#f3f4f2" stroke="#27676a" stroke-width="1.5"/><text x="287.30769230769226" y="136" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">O3</text><rect x="326.9230769230769" y="107" width="59.230769230769226" height="46" rx="4" fill="#d8eae5" stroke="#27676a" stroke-width="1.5"/><text x="356.53846153846155" y="136" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">S2</text><rect x="396.15384615384613" y="107" width="59.230769230769226" height="46" rx="4" fill="#f3f4f2" stroke="#27676a" stroke-width="1.5"/><text x="425.7692307692307" y="136" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">O4</text><rect x="465.38461538461536" y="107" width="59.230769230769226" height="46" rx="4" fill="#f3f4f2" stroke="#27676a" stroke-width="1.5"/><text x="495.0" y="136" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">O5</text><rect x="534.6153846153845" y="107" width="59.230769230769226" height="46" rx="4" fill="#d8eae5" stroke="#27676a" stroke-width="1.5"/><text x="564.2307692307692" y="136" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">S3</text><rect x="603.8461538461538" y="107" width="59.230769230769226" height="46" rx="4" fill="#f3f4f2" stroke="#27676a" stroke-width="1.5"/><text x="633.4615384615385" y="136" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">O6</text><rect x="673.0769230769231" y="107" width="59.230769230769226" height="46" rx="4" fill="#f3f4f2" stroke="#27676a" stroke-width="1.5"/><text x="702.6923076923077" y="136" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">O7</text><rect x="742.3076923076923" y="107" width="59.230769230769226" height="46" rx="4" fill="#f3f4f2" stroke="#27676a" stroke-width="1.5"/><text x="771.9230769230769" y="136" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">O8</text><rect x="811.5384615384614" y="107" width="59.230769230769226" height="46" rx="4" fill="#f3f4f2" stroke="#27676a" stroke-width="1.5"/><text x="841.1538461538461" y="136" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">O9</text><rect x="880.7692307692307" y="107" width="59.230769230769226" height="46" rx="4" fill="#f3f4f2" stroke="#27676a" stroke-width="1.5"/><text x="910.3846153846154" y="136" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">O10</text><text x="500" y="198" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">Internal gap numbers chosen in this example: 1, 3, 5.</text><text x="500" y="243" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#21343f" text-anchor="middle">Shift the three gap numbers by 0, 1, 2 respectively: 1, 2, 3.</text><text x="500" y="292" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">In general: (i, j, k) maps to (i, j−1, k−2), a triple from 1 to 7.</text><text x="500" y="341" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#21343f" text-anchor="middle">The reverse shift restores the required separation, so the correspondence is one-to-one.</text><text x="500" y="391" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#21343f" text-anchor="middle">The identities and orders of all ordinary and special exhibits are counted separately.</text></svg>