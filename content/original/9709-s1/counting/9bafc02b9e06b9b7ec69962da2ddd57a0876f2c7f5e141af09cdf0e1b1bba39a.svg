<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img"><title>The gaps used to separate the red displays</title><rect width="1000" height="380" fill="white"/><text x="32" y="35" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#21343f" text-anchor="start">The gaps used to separate the red displays</text><text x="500" y="74" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">5 different blue displays create 6 gaps, including two end gaps.</text><rect x="110.24" y="120" width="107.52" height="50" rx="4" fill="#f0f6f4" stroke="#27676a" stroke-width="1.5"/><text x="164.0" y="151" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">B1</text><rect x="278.24" y="120" width="107.52" height="50" rx="4" fill="#f0f6f4" stroke="#27676a" stroke-width="1.5"/><text x="332.0" y="151" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">B2</text><rect x="446.24" y="120" width="107.52" height="50" rx="4" fill="#f0f6f4" stroke="#27676a" stroke-width="1.5"/><text x="500.0" y="151" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">B3</text><rect x="614.24" y="120" width="107.52" height="50" rx="4" fill="#f0f6f4" stroke="#27676a" stroke-width="1.5"/><text x="668.0" y="151" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">B4</text><rect x="782.24" y="120" width="107.52" height="50" rx="4" fill="#f0f6f4" stroke="#27676a" stroke-width="1.5"/><text x="836.0" y="151" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">B5</text><line x1="80.0" y1="103" x2="80.0" y2="185" stroke="#607b83" stroke-width="1.5" stroke-dasharray="5 4"/><text x="80.0" y="211" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#21343f" text-anchor="middle">1</text><line x1="248.0" y1="103" x2="248.0" y2="185" stroke="#607b83" stroke-width="1.5" stroke-dasharray="5 4"/><text x="248.0" y="211" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#21343f" text-anchor="middle">2</text><line x1="416.0" y1="103" x2="416.0" y2="185" stroke="#607b83" stroke-width="1.5" stroke-dasharray="5 4"/><text x="416.0" y="211" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#21343f" text-anchor="middle">3</text><line x1="584.0" y1="103" x2="584.0" y2="185" stroke="#607b83" stroke-width="1.5" stroke-dasharray="5 4"/><text x="584.0" y="211" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#21343f" text-anchor="middle">4</text><line x1="752.0" y1="103" x2="752.0" y2="185" stroke="#607b83" stroke-width="1.5" stroke-dasharray="5 4"/><text x="752.0" y="211" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#21343f" text-anchor="middle">5</text><line x1="920.0" y1="103" x2="920.0" y2="185" stroke="#607b83" stroke-width="1.5" stroke-dasharray="5 4"/><text x="920.0" y="211" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#21343f" text-anchor="middle">6</text><text x="500" y="259" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">Part (a): choose 3 of all 6 gaps.</text><text x="500" y="294" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">Part (b): choose 3 of the 4 internal gaps only.</text><text x="500" y="341" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#21343f" text-anchor="middle">Numbered labels illustrate one blue order; all blue and red orders must also be counted.</text></svg>