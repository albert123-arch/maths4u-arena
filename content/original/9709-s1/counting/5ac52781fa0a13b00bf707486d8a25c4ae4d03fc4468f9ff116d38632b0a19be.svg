<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img"><title>Separate exactly one condition from at least one</title><rect width="1000" height="380" fill="white"/><text x="32" y="35" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#21343f" text-anchor="start">Separate exactly one condition from at least one</text><rect x="35" y="103" width="300" height="116" rx="4" fill="#e1efea" stroke="#27676a" stroke-width="1.5"/><text x="185" y="143" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#21343f" text-anchor="middle">PP only</text><text x="185" y="186" font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#21343f" text-anchor="middle">1,800</text><rect x="360" y="103" width="300" height="116" rx="4" fill="#f2eadb" stroke="#27676a" stroke-width="1.5"/><text x="510" y="143" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#21343f" text-anchor="middle">Both PP and QQ</text><text x="510" y="186" font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#21343f" text-anchor="middle">720</text><rect x="685" y="103" width="300" height="116" rx="4" fill="#e1efea" stroke="#27676a" stroke-width="1.5"/><text x="835" y="143" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#21343f" text-anchor="middle">QQ only</text><text x="835" y="186" font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#21343f" text-anchor="middle">1,800</text><text x="500" y="268" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">Exactly one: add the two outside boxes only.</text><text x="500" y="309" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">At least one: add all three boxes, including the intersection once.</text></svg>