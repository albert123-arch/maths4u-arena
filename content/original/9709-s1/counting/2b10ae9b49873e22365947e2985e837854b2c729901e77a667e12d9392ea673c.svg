<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img"><title>The gaps used to separate the red displays</title><rect width="1000" height="380" fill="white"/><text x="32" y="35" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#21343f" text-anchor="start">The gaps used to separate the red displays</text><text x="500" y="74" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">6 different blue displays create 7 gaps, including two end gaps.</text><rect x="105.2" y="120" width="89.60000000000001" height="50" rx="4" fill="#f0f6f4" stroke="#27676a" stroke-width="1.5"/><text x="150.0" y="151" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">B1</text><rect x="245.2" y="120" width="89.60000000000001" height="50" rx="4" fill="#f0f6f4" stroke="#27676a" stroke-width="1.5"/><text x="290.0" y="151" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">B2</text><rect x="385.2" y="120" width="89.60000000000001" height="50" rx="4" fill="#f0f6f4" stroke="#27676a" stroke-width="1.5"/><text x="430.0" y="151" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">B3</text><rect x="525.2" y="120" width="89.60000000000001" height="50" rx="4" fill="#f0f6f4" stroke="#27676a" stroke-width="1.5"/><text x="570.0" y="151" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">B4</text><rect x="665.2" y="120" width="89.60000000000001" height="50" rx="4" fill="#f0f6f4" stroke="#27676a" stroke-width="1.5"/><text x="710.0" y="151" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">B5</text><rect x="805.2" y="120" width="89.60000000000001" height="50" rx="4" fill="#f0f6f4" stroke="#27676a" stroke-width="1.5"/><text x="850.0" y="151" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">B6</text><line x1="80.0" y1="103" x2="80.0" y2="185" stroke="#607b83" stroke-width="1.5" stroke-dasharray="5 4"/><text x="80.0" y="211" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#21343f" text-anchor="middle">1</text><line x1="220.0" y1="103" x2="220.0" y2="185" stroke="#607b83" stroke-width="1.5" stroke-dasharray="5 4"/><text x="220.0" y="211" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#21343f" text-anchor="middle">2</text><line x1="360.0" y1="103" x2="360.0" y2="185" stroke="#607b83" stroke-width="1.5" stroke-dasharray="5 4"/><text x="360.0" y="211" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#21343f" text-anchor="middle">3</text><line x1="500.0" y1="103" x2="500.0" y2="185" stroke="#607b83" stroke-width="1.5" stroke-dasharray="5 4"/><text x="500.0" y="211" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#21343f" text-anchor="middle">4</text><line x1="640.0" y1="103" x2="640.0" y2="185" stroke="#607b83" stroke-width="1.5" stroke-dasharray="5 4"/><text x="640.0" y="211" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#21343f" text-anchor="middle">5</text><line x1="780.0" y1="103" x2="780.0" y2="185" stroke="#607b83" stroke-width="1.5" stroke-dasharray="5 4"/><text x="780.0" y="211" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#21343f" text-anchor="middle">6</text><line x1="920.0" y1="103" x2="920.0" y2="185" stroke="#607b83" stroke-width="1.5" stroke-dasharray="5 4"/><text x="920.0" y="211" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#21343f" text-anchor="middle">7</text><text x="500" y="259" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">Part (a): choose 4 of all 7 gaps.</text><text x="500" y="294" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">Part (b): choose 4 of the 5 internal gaps only.</text><text x="500" y="341" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#21343f" text-anchor="middle">Numbered labels illustrate one blue order; all blue and red orders must also be counted.</text></svg>