<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img"><title>The gaps used to separate the red displays</title><rect width="1000" height="380" fill="white"/><text x="32" y="35" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#21343f" text-anchor="start">The gaps used to separate the red displays</text><text x="500" y="74" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">7 different blue displays create 8 gaps, including two end gaps.</text><rect x="101.6" y="120" width="76.8" height="50" rx="4" fill="#f0f6f4" stroke="#27676a" stroke-width="1.5"/><text x="140.0" y="151" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">B1</text><rect x="221.6" y="120" width="76.8" height="50" rx="4" fill="#f0f6f4" stroke="#27676a" stroke-width="1.5"/><text x="260.0" y="151" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">B2</text><rect x="341.6" y="120" width="76.8" height="50" rx="4" fill="#f0f6f4" stroke="#27676a" stroke-width="1.5"/><text x="380.0" y="151" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">B3</text><rect x="461.6" y="120" width="76.8" height="50" rx="4" fill="#f0f6f4" stroke="#27676a" stroke-width="1.5"/><text x="500.0" y="151" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">B4</text><rect x="581.6" y="120" width="76.8" height="50" rx="4" fill="#f0f6f4" stroke="#27676a" stroke-width="1.5"/><text x="620.0" y="151" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">B5</text><rect x="701.6" y="120" width="76.8" height="50" rx="4" fill="#f0f6f4" stroke="#27676a" stroke-width="1.5"/><text x="740.0" y="151" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">B6</text><rect x="821.6" y="120" width="76.8" height="50" rx="4" fill="#f0f6f4" stroke="#27676a" stroke-width="1.5"/><text x="860.0" y="151" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">B7</text><line x1="80.0" y1="103" x2="80.0" y2="185" stroke="#607b83" stroke-width="1.5" stroke-dasharray="5 4"/><text x="80.0" y="211" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#21343f" text-anchor="middle">1</text><line x1="200.0" y1="103" x2="200.0" y2="185" stroke="#607b83" stroke-width="1.5" stroke-dasharray="5 4"/><text x="200.0" y="211" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#21343f" text-anchor="middle">2</text><line x1="320.0" y1="103" x2="320.0" y2="185" stroke="#607b83" stroke-width="1.5" stroke-dasharray="5 4"/><text x="320.0" y="211" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#21343f" text-anchor="middle">3</text><line x1="440.0" y1="103" x2="440.0" y2="185" stroke="#607b83" stroke-width="1.5" stroke-dasharray="5 4"/><text x="440.0" y="211" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#21343f" text-anchor="middle">4</text><line x1="560.0" y1="103" x2="560.0" y2="185" stroke="#607b83" stroke-width="1.5" stroke-dasharray="5 4"/><text x="560.0" y="211" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#21343f" text-anchor="middle">5</text><line x1="680.0" y1="103" x2="680.0" y2="185" stroke="#607b83" stroke-width="1.5" stroke-dasharray="5 4"/><text x="680.0" y="211" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#21343f" text-anchor="middle">6</text><line x1="800.0" y1="103" x2="800.0" y2="185" stroke="#607b83" stroke-width="1.5" stroke-dasharray="5 4"/><text x="800.0" y="211" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#21343f" text-anchor="middle">7</text><line x1="920.0" y1="103" x2="920.0" y2="185" stroke="#607b83" stroke-width="1.5" stroke-dasharray="5 4"/><text x="920.0" y="211" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#21343f" text-anchor="middle">8</text><text x="500" y="259" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">Part (a): choose 4 of all 8 gaps.</text><text x="500" y="294" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">Part (b): choose 4 of the 6 internal gaps only.</text><text x="500" y="341" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#21343f" text-anchor="middle">Numbered labels illustrate one blue order; all blue and red orders must also be counted.</text></svg>