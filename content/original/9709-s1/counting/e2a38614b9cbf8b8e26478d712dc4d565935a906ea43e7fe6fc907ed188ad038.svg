<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img"><title>A name changes what counts as a different allocation</title><rect width="1000" height="380" fill="white"/><text x="32" y="35" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#21343f" text-anchor="start">A name changes what counts as a different allocation</text><rect x="45" y="102" width="270" height="112" rx="4" fill="#f0f6f4" stroke="#27676a" stroke-width="1.5"/><text x="180" y="141" font-family="Arial, sans-serif" font-size="21" font-weight="600" fill="#21343f" text-anchor="middle">Station A</text><text x="180" y="184" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#21343f" text-anchor="middle">3 volunteers</text><rect x="365" y="102" width="270" height="112" rx="4" fill="#f0f6f4" stroke="#27676a" stroke-width="1.5"/><text x="500" y="141" font-family="Arial, sans-serif" font-size="21" font-weight="600" fill="#21343f" text-anchor="middle">Station B</text><text x="500" y="184" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#21343f" text-anchor="middle">3 volunteers</text><rect x="685" y="102" width="270" height="112" rx="4" fill="#f0f6f4" stroke="#27676a" stroke-width="1.5"/><text x="820" y="141" font-family="Arial, sans-serif" font-size="21" font-weight="600" fill="#21343f" text-anchor="middle">Station C</text><text x="820" y="184" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#21343f" text-anchor="middle">2 volunteers</text><text x="500" y="265" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">Named stations: exchanging the two equal-sized groups changes the allocation.</text><text x="500" y="310" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#21343f" text-anchor="middle">Unnamed groups: that exchange does not change the division; divide by 2!, not 3!.</text></svg>