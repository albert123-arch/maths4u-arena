<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img"><title>The adjacency events overlap at B</title><rect width="1000" height="380" fill="white"/><text x="32" y="35" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#21343f" text-anchor="start">The adjacency events overlap at B</text><text x="500" y="77" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">To have A next to B and B next to C, B must be in the middle.</text><rect x="389.0" y="115" width="64" height="46" rx="4" fill="#d8eae5" stroke="#27676a" stroke-width="1.5"/><text x="421.0" y="144" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">A</text><rect x="463.0" y="115" width="64" height="46" rx="4" fill="#d8eae5" stroke="#27676a" stroke-width="1.5"/><text x="495.0" y="144" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">B</text><rect x="537.0" y="115" width="64" height="46" rx="4" fill="#d8eae5" stroke="#27676a" stroke-width="1.5"/><text x="569.0" y="144" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">C</text><text x="500" y="204" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#21343f" text-anchor="middle">or</text><rect x="389.0" y="225" width="64" height="46" rx="4" fill="#d8eae5" stroke="#27676a" stroke-width="1.5"/><text x="421.0" y="254" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">C</text><rect x="463.0" y="225" width="64" height="46" rx="4" fill="#d8eae5" stroke="#27676a" stroke-width="1.5"/><text x="495.0" y="254" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">B</text><rect x="537.0" y="225" width="64" height="46" rx="4" fill="#d8eae5" stroke="#27676a" stroke-width="1.5"/><text x="569.0" y="254" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">A</text><text x="500" y="332" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21343f" text-anchor="middle">Only these two internal orders work. Treat either triple as one block.</text></svg>