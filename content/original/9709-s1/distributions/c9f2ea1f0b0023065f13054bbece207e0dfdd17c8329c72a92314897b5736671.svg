<svg xmlns="http://www.w3.org/2000/svg" width="820" height="365" viewBox="0 0 820 365" role="img" aria-labelledby="title desc"><title id="title">F034 Analogue 2: discrete probability distribution</title><desc id="desc">Probability masses X=2: 1/4; X=6: 9/20; X=9: 3/10. Expected value 59/10. Stems mark probabilities at individual values, not intervals.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#17262e"><text x="74.000" y="29.000" font-size="18" text-anchor="start" font-weight="700">F034 · Analogue 2</text><text x="786.000" y="29.000" font-size="17" text-anchor="end" >E(X) = 59/10</text><path d="M 74 63 V 286.0 H 794" fill="none" stroke="#263b45" stroke-width="1.5"/><line x1="74" x2="786" y1="286.000" y2="286.000" stroke="#d7dfe2" stroke-width="1"/><text x="64.000" y="291.000" font-size="13" text-anchor="end" >0.00</text><line x1="74" x2="786" y1="231.250" y2="231.250" stroke="#d7dfe2" stroke-width="1"/><text x="64.000" y="236.250" font-size="13" text-anchor="end" >0.14</text><line x1="74" x2="786" y1="176.500" y2="176.500" stroke="#d7dfe2" stroke-width="1"/><text x="64.000" y="181.500" font-size="13" text-anchor="end" >0.28</text><line x1="74" x2="786" y1="121.750" y2="121.750" stroke="#d7dfe2" stroke-width="1"/><text x="64.000" y="126.750" font-size="13" text-anchor="end" >0.42</text><line x1="74" x2="786" y1="67.000" y2="67.000" stroke="#d7dfe2" stroke-width="1"/><text x="64.000" y="72.000" font-size="13" text-anchor="end" >0.56</text><text x="29.000" y="176.500" font-size="14" text-anchor="middle" transform="rotate(-90 29 176.500)">P(X = x)</text><line x1="133.333" x2="133.333" y1="286.000" y2="188.667" stroke="#263b45" stroke-width="3"/><circle cx="133.333" cy="188.667" r="4.2" fill="#263b45"/><text x="133.333" y="177.667" font-size="15" text-anchor="middle" >1/4</text><text x="133.333" y="311.000" font-size="16" text-anchor="middle" >2</text><line x1="472.381" x2="472.381" y1="286.000" y2="110.800" stroke="#263b45" stroke-width="3"/><circle cx="472.381" cy="110.800" r="4.2" fill="#263b45"/><text x="472.381" y="99.800" font-size="15" text-anchor="middle" >9/20</text><text x="472.381" y="311.000" font-size="16" text-anchor="middle" >6</text><line x1="726.667" x2="726.667" y1="286.000" y2="169.200" stroke="#263b45" stroke-width="3"/><circle cx="726.667" cy="169.200" r="4.2" fill="#263b45"/><text x="726.667" y="158.200" font-size="15" text-anchor="middle" >3/10</text><text x="726.667" y="311.000" font-size="16" text-anchor="middle" >9</text><line x1="463.905" x2="463.905" y1="67" y2="286.000" stroke="#79868c" stroke-width="1.3" stroke-dasharray="5,5"/><text x="799.000" y="293.000" font-size="17" text-anchor="middle" >x</text><text x="410.000" y="340.000" font-size="14" text-anchor="middle" >Probabilities occur only at the listed values. Dashed line: expected value.</text></g></svg>