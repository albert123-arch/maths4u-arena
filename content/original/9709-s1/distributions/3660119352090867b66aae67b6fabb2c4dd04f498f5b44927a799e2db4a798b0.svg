<svg xmlns="http://www.w3.org/2000/svg" width="820" height="365" viewBox="0 0 820 365" role="img" aria-labelledby="title desc"><title id="title">F050 Analogue 2: discrete probability distribution</title><desc id="desc">Probability masses X=-1: 1/25; X=2: 3/25; X=6: 4/25; X=8: 2/5; X=10: 2/25; X=12: 1/5. Expected value 189/25. Stems mark probabilities at individual values, not intervals.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#17262e"><text x="74.000" y="29.000" font-size="18" text-anchor="start" font-weight="700">F050 · Analogue 2</text><text x="786.000" y="29.000" font-size="17" text-anchor="end" >E(X) = 189/25</text><path d="M 74 63 V 286.0 H 794" fill="none" stroke="#263b45" stroke-width="1.5"/><line x1="74" x2="786" y1="286.000" y2="286.000" stroke="#d7dfe2" stroke-width="1"/><text x="64.000" y="291.000" font-size="13" text-anchor="end" >0.00</text><line x1="74" x2="786" y1="231.250" y2="231.250" stroke="#d7dfe2" stroke-width="1"/><text x="64.000" y="236.250" font-size="13" text-anchor="end" >0.12</text><line x1="74" x2="786" y1="176.500" y2="176.500" stroke="#d7dfe2" stroke-width="1"/><text x="64.000" y="181.500" font-size="13" text-anchor="end" >0.25</text><line x1="74" x2="786" y1="121.750" y2="121.750" stroke="#d7dfe2" stroke-width="1"/><text x="64.000" y="126.750" font-size="13" text-anchor="end" >0.38</text><line x1="74" x2="786" y1="67.000" y2="67.000" stroke="#d7dfe2" stroke-width="1"/><text x="64.000" y="72.000" font-size="13" text-anchor="end" >0.50</text><text x="29.000" y="176.500" font-size="14" text-anchor="middle" transform="rotate(-90 29 176.500)">P(X = x)</text><line x1="133.333" x2="133.333" y1="286.000" y2="268.480" stroke="#263b45" stroke-width="3"/><circle cx="133.333" cy="268.480" r="4.2" fill="#263b45"/><text x="133.333" y="257.480" font-size="15" text-anchor="middle" >1/25</text><text x="133.333" y="311.000" font-size="16" text-anchor="middle" >-1</text><line x1="270.256" x2="270.256" y1="286.000" y2="233.440" stroke="#263b45" stroke-width="3"/><circle cx="270.256" cy="233.440" r="4.2" fill="#263b45"/><text x="270.256" y="222.440" font-size="15" text-anchor="middle" >3/25</text><text x="270.256" y="311.000" font-size="16" text-anchor="middle" >2</text><line x1="452.821" x2="452.821" y1="286.000" y2="215.920" stroke="#263b45" stroke-width="3"/><circle cx="452.821" cy="215.920" r="4.2" fill="#263b45"/><text x="452.821" y="204.920" font-size="15" text-anchor="middle" >4/25</text><text x="452.821" y="311.000" font-size="16" text-anchor="middle" >6</text><line x1="544.103" x2="544.103" y1="286.000" y2="110.800" stroke="#263b45" stroke-width="3"/><circle cx="544.103" cy="110.800" r="4.2" fill="#263b45"/><text x="544.103" y="99.800" font-size="15" text-anchor="middle" >2/5</text><text x="544.103" y="311.000" font-size="16" text-anchor="middle" >8</text><line x1="635.385" x2="635.385" y1="286.000" y2="250.960" stroke="#263b45" stroke-width="3"/><circle cx="635.385" cy="250.960" r="4.2" fill="#263b45"/><text x="635.385" y="239.960" font-size="15" text-anchor="middle" >2/25</text><text x="635.385" y="311.000" font-size="16" text-anchor="middle" >10</text><line x1="726.667" x2="726.667" y1="286.000" y2="198.400" stroke="#263b45" stroke-width="3"/><circle cx="726.667" cy="198.400" r="4.2" fill="#263b45"/><text x="726.667" y="187.400" font-size="15" text-anchor="middle" >1/5</text><text x="726.667" y="311.000" font-size="16" text-anchor="middle" >12</text><line x1="524.021" x2="524.021" y1="67" y2="286.000" stroke="#79868c" stroke-width="1.3" stroke-dasharray="5,5"/><text x="799.000" y="293.000" font-size="17" text-anchor="middle" >x</text><text x="410.000" y="340.000" font-size="14" text-anchor="middle" >Probabilities occur only at the listed values. Dashed line: expected value.</text></g></svg>