<svg xmlns="http://www.w3.org/2000/svg" width="820" height="365" viewBox="0 0 820 365" role="img" aria-labelledby="title desc"><title id="title">F014 Analogue 3: discrete probability distribution</title><desc id="desc">Probability masses X=0: 1/64; X=2: 13/32; X=5: 37/64. Expected value 237/64. Stems mark probabilities at individual values, not intervals.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#17262e"><text x="74.000" y="29.000" font-size="18" text-anchor="start" font-weight="700">F014 · Analogue 3</text><text x="786.000" y="29.000" font-size="17" text-anchor="end" >E(X) = 237/64</text><path d="M 74 63 V 286.0 H 794" fill="none" stroke="#263b45" stroke-width="1.5"/><line x1="74" x2="786" y1="286.000" y2="286.000" stroke="#d7dfe2" stroke-width="1"/><text x="64.000" y="291.000" font-size="13" text-anchor="end" >0.00</text><line x1="74" x2="786" y1="231.250" y2="231.250" stroke="#d7dfe2" stroke-width="1"/><text x="64.000" y="236.250" font-size="13" text-anchor="end" >0.18</text><line x1="74" x2="786" y1="176.500" y2="176.500" stroke="#d7dfe2" stroke-width="1"/><text x="64.000" y="181.500" font-size="13" text-anchor="end" >0.36</text><line x1="74" x2="786" y1="121.750" y2="121.750" stroke="#d7dfe2" stroke-width="1"/><text x="64.000" y="126.750" font-size="13" text-anchor="end" >0.54</text><line x1="74" x2="786" y1="67.000" y2="67.000" stroke="#d7dfe2" stroke-width="1"/><text x="64.000" y="72.000" font-size="13" text-anchor="end" >0.72</text><text x="29.000" y="176.500" font-size="14" text-anchor="middle" transform="rotate(-90 29 176.500)">P(X = x)</text><line x1="133.333" x2="133.333" y1="286.000" y2="281.265" stroke="#263b45" stroke-width="3"/><circle cx="133.333" cy="281.265" r="4.2" fill="#263b45"/><text x="133.333" y="270.265" font-size="15" text-anchor="middle" >1/64</text><text x="133.333" y="311.000" font-size="16" text-anchor="middle" >0</text><line x1="370.667" x2="370.667" y1="286.000" y2="162.886" stroke