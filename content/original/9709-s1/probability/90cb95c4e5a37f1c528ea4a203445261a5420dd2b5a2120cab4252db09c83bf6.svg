<svg xmlns="http://www.w3.org/2000/svg" width="850" height="420" viewBox="0 0 850 420" role="img" aria-labelledby="title desc"><title id="title">Two-event Venn diagram</title><desc id="desc">Region probabilities: A only, intersection, B only and neither.</desc><rect width="100%" height="100%" fill="white"/><text x="425.0" y="32.0" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="bold" fill="#172536">The four disjoint regions</text><rect x="35" y="65" width="780" height="320" rx="8" fill="none" stroke="#64748b" stroke-width="1.5"/><ellipse cx="330" cy="220" rx="180" ry="125" fill="#e9eff5" fill-opacity=".65" stroke="#334155" stroke-width="2"/><ellipse cx="520" cy="220" rx="180" ry="125" fill="#e9eff5" fill-opacity=".65" stroke="#334155" stroke-width="2"/><text x="210.0" y="105.0" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="bold" fill="#172536">A</text><text x="640.0" y="105.0" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="bold" fill="#172536">B</text><text x="265.0" y="228.0" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal" fill="#172536">1/5</text><text x="425.0" y="228.0" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal" fill="#172536">1/4</text><text x="585.0" y="228.0" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal" fill="#172536">9/40</text><text x="750.0" y="355.0" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal" fill="#172536">13/40</text><text x="73.0" y="92.0" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" font-weight="normal" fill="#172536">S</text></svg>