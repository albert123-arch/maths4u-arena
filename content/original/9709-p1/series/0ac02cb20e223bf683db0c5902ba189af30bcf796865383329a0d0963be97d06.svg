<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-label="Two annual changes, beginning after year 1"><rect width="900" height="480" fill="white"/><g font-family="Arial,sans-serif" fill="#15293c"><text x="32" y="34" font-size="20" font-weight="bold">Two annual changes, beginning after year 1</text><rect x="40.0" y="100" width="245.33333333333331" height="275" rx="12" fill="#eef6fa" stroke="#17647d"/><text x="52.0" y="147" font-size="32" font-weight="bold">Year 1</text><text x="52.0" y="198" font-size="34">salary</text><text x="52.0" y="239" font-size="34">£31000; bonus</text><text x="52.0" y="280" font-size="34">£800</text><path d="M 288.3333333333333 400 h 20 l -6 -5 m 6 5 l -6 5" stroke="#17647d" fill="none"/><rect x="303.3333333333333" y="100" width="245.33333333333331" height="275" rx="12" fill="#eef6fa" stroke="#17647d"/><text x="315.3333333333333" y="147" font-size="32" font-weight="bold">Year 2</text><text x="315.3333333333333" y="198" font-size="34">one</text><text x="315.3333333333333" y="239" font-size="34">percentage</text><text x="315.3333333333333" y="280" font-size="34">rise; one</text><text x="315.3333333333333" y="321" font-size="34">fixed rise</text><path d="M 551.6666666666666 400 h 20 l -6 -5 m 6 5 l -6 5" stroke="#17647d" fill="none"/><rect x="566.6666666666666" y="100" width="245.33333333333331" height="275" rx="12" fill="#eef6fa" stroke="#17647d"/><text x="578.6666666666666" y="147" font-size="32" font-weight="bold">Year 19</text><text x="578.6666666666666" y="198" font-size="34">18 rises of</text><text x="578.6666666666666" y="239" font-size="34">each type</text><text x="40" y="450" font-size="24">Known information only. Diagram not to scale.</text></g></svg>