<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-label="Birthday numbering and payment count"><rect width="900" height="480" fill="white"/><g font-family="Arial,sans-serif" fill="#15293c"><text x="32" y="34" font-size="20" font-weight="bold">Birthday numbering and payment count</text><rect x="40.0" y="100" width="245.33333333333331" height="275" rx="12" fill="#eef6fa" stroke="#17647d"/><text x="52.0" y="147" font-size="32" font-weight="bold">Birthday 1</text><text x="52.0" y="198" font-size="34">both pay £25</text><path d="M 288.3333333333333 400 h 20 l -6 -5 m 6 5 l -6 5" stroke="#17647d" fill="none"/><rect x="303.3333333333333" y="100" width="245.33333333333331" height="275" rx="12" fill="#eef6fa" stroke="#17647d"/><text x="315.3333333333333" y="147" font-size="32" font-weight="bold">Birthday 2</text><text x="315.3333333333333" y="198" font-size="34">one change in</text><text x="315.3333333333333" y="239" font-size="34">each plan</text><path d="M 551.6666666666666 400 h 20 l -6 -5 m 6 5 l -6 5" stroke="#17647d" fill="none"/><rect x="566.6666666666666" y="100" width="245.33333333333331" height="275" rx="12" fill="#eef6fa" stroke="#17647d"/><text x="578.6666666666666" y="147" font-size="32" font-weight="bold">Birthday 21</text><text x="578.6666666666666" y="198" font-size="34">21 payments;</text><text x="578.6666666666666" y="239" font-size="34">20 changes</text><text x="40" y="450" font-size="24">Known information only. Diagram not to scale.</text></g></svg>