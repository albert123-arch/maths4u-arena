<svg xmlns="http://www.w3.org/2000/svg" width="640" height="350" viewBox="0 0 640 350" role="img" aria-labelledby="title desc"><title id="title">A cumulative plateau leaves the previous mass unchanged</title><desc id="desc">The CDF begins at zero, reaches one half at two, remains flat until three, and rises to one at four.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#182c46"/></marker></defs><g font-family="system-ui,sans-serif"><rect width="640" height="350" rx="18" fill="#f8fbff"/>
<rect x="13" y="13" width="614" height="324" rx="14" fill="none" stroke="#d4e1f1"/>
<line x1="65.0" y1="249.348" x2="568.0" y2="249.348" stroke="#182c46" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="146.129" y1="280.0" x2="146.129" y2="45.0" stroke="#182c46" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="585.0" y="257.348" fill="#182c46" font-size="23" text-anchor="start">x</text>
<text x="141.129" y="32.0" fill="#182c46" font-size="23" text-anchor="start">F(x)</text>
<path d="M 65.0 249.348 L 146.129 249.348 L 308.387 164.203 L 389.516 164.203 L 470.645 79.058 L 551.774 79.058" stroke="#2452a9" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<text x="132.129" y="171.203" fill="#506784" font-size="19" text-anchor="end">0.5</text>
<text x="132.129" y="86.058" fill="#506784" font-size="19" text-anchor="end">1</text>
<line x1="308.387" y1="249.348" x2="308.387" y2="164.203" stroke="#067d82" stroke-width="1.7" stroke-linecap="round" stroke-dasharray="7 6"/>
<circle cx="308.387" cy="164.203" r="4.6" fill="#2452a9"/>
<text x="308.387" y="277.348" fill="#506784" font-size="19" text-anchor="middle">2</text>
<line x1="389.516" y1="249.348" x2="389.516" y2="164.203" stroke="#067d82" stroke-width="1.7" stroke-linecap="round" stroke-dasharray="7 6"/>
<circle cx="389.516" cy="164.203" r="4.6" fill="#2452a9"/>
<text x="389.516" y="277.348" fill="#506784" font-size="19" text-anchor="middle">3</text>
<line x1="470.645" y1="249.348" x2="470.645" y2="79.058" stroke="#067d82" stroke-width="1.7" stroke-linecap="round" stroke-dasharray="7 6"/>
<circle cx="470.645" cy="79.058" r="4.6" fill="#2452a9"/>
<text x="470.645" y="277.348" fill="#506784" font-size="19" text-anchor="middle">4</text>
<text x="348.952" y="145.203" fill="#067d82" font-size="20" text-anchor="middle">Flat at 0.5</text></g>
</svg>
