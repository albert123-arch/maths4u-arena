<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 316" width="520" height="316" role="img" aria-labelledby="title description">
  <title id="title">A unit circle with vertical and horizontal tangents</title>
  <desc id="description">With the same scale on both axes, the circle touches x = 1 at (1, 0) and y = 1 at (0, 1).</desc>
  <rect width="520" height="316" rx="14" fill="#f8fafc"/>
  <g fill="none" stroke="#dbe5ef">
    <path d="M178 46V254M342 46V254M96 69H424M96 233H424"/>
  </g>
  <g fill="none" stroke="#475569" stroke-width="1.5">
    <path d="M96 151H424M260 46V254"/>
    <path d="M178 147V155M342 147V155M256 69H264M256 233H264"/>
  </g>
  <g fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="6 4">
    <path d="M96 69H424M342 46V254"/>
  </g>
  <circle cx="260" cy="151" r="82" fill="none" stroke="#174a99" stroke-width="3"/>
  <g fill="#174a99">
    <circle cx="260" cy="69" r="4"/>
    <circle cx="342" cy="151" r="4"/>
  </g>
  <g font-family="system-ui,sans-serif" font-size="18" fill="#24354d">
    <text x="438" y="158">x</text>
    <text x="260" y="36" text-anchor="middle">y</text>
    <text x="178" y="276" text-anchor="middle">−1</text>
    <text x="260" y="276" text-anchor="middle">0</text>
    <text x="342" y="276" text-anchor="middle">1</text>
    <text x="83" y="75" text-anchor="end">1</text>
    <text x="83" y="239" text-anchor="end">−1</text>
    <text x="432" y="75" fill="#90400c">y = 1</text>
    <text x="356" y="239" fill="#90400c">x = 1</text>
  </g>
</svg>
