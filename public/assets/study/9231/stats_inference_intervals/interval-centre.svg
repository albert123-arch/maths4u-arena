<svg xmlns="http://www.w3.org/2000/svg" width="640" height="350" viewBox="0 0 640 350" role="img" aria-labelledby="title desc"><title id="title">Equal margins on the two sides of a confidence interval</title><desc id="desc">The lower endpoint and upper endpoint are equally far from the estimate. The arrow from the estimate to the upper endpoint marks the margin.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#182c46"/></marker></defs><g font-family="system-ui,sans-serif"><rect width="640" height="350" rx="18" fill="#f8fbff"/>
<rect x="13" y="13" width="614" height="324" rx="14" fill="none" stroke="#d4e1f1"/>
<line x1="97.804" y1="224.048" x2="535.196" y2="224.048" stroke="#182c46" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="193.484" y1="224.048" x2="439.516" y2="224.048" stroke="#2452a9" stroke-width="6" stroke-linecap="round"/>
<circle cx="193.484" cy="224.048" r="4.6" fill="#2452a9"/>
<text x="193.484" y="256.048" fill="#506784" font-size="20" text-anchor="middle">Lower endpoint</text>
<circle cx="316.5" cy="224.048" r="4.6" fill="#2452a9"/>
<text x="316.5" y="256.048" fill="#506784" font-size="20" text-anchor="middle">Estimate</text>
<circle cx="439.516" cy="224.048" r="4.6" fill="#2452a9"/>
<text x="439.516" y="256.048" fill="#506784" font-size="20" text-anchor="middle">Upper endpoint</text>
<line x1="316.5" y1="224.048" x2="316.5" y2="142.917" stroke="#067d82" stroke-width="1.9" stroke-linecap="round" stroke-dasharray="7 6"/>
<line x1="439.516" y1="224.048" x2="439.516" y2="142.917" stroke="#067d82" stroke-width="1.9" stroke-linecap="round" stroke-dasharray="7 6"/>
<line x1="316.5" y1="151.31" x2="439.516" y2="151.31" stroke="#067d82" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="378.008" y="135.31" fill="#067d82" font-size="22" text-anchor="middle">Margin</text></g>
</svg>
