<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 270" width="470" height="270" role="img" aria-labelledby="title description"><title id="title">One eigenvector and its reversed image</title><desc id="description">The original vector and its image lie on the same line through the origin. The image points in the opposite direction, indicating a negative eigenvalue.</desc><rect width="470" height="270" rx="14" fill="#f8fafc"/><g font-family="system-ui,sans-serif" font-size="16" fill="#132b48"><path d="M30 154H445 M162 229V33" stroke="#94a3b8" stroke-width="1.5"/><path d="M68 194L397 54" stroke="#b9cbe1" stroke-width="2" stroke-dasharray="5 4"/><defs><marker id="v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#174a99"/></marker><marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#087b66"/></marker></defs><path d="M162 154L252 116" stroke="#174a99" stroke-width="4" marker-end="url(#v)"/><path d="M162 154L83 188" stroke="#087b66" stroke-width="4" marker-end="url(#w)"/><text x="260" y="131">v</text><text x="43" y="205">Av</text></g></svg>
