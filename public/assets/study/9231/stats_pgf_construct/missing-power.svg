<svg xmlns="http://www.w3.org/2000/svg" width="640" height="290" viewBox="0 0 640 290" role="img" aria-labelledby="title desc"><title id="title">Distribution of a count with a missing value</title><desc id="desc">Probability masses are one half at zero, one third at one and one sixth at three. There is no mass at two.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#182c46"/></marker></defs><g font-family="system-ui,sans-serif"><rect width="640" height="290" rx="18" fill="#f8fbff"/>
<rect x="13" y="13" width="614" height="264" rx="14" fill="none" stroke="#d4e1f1"/>
<line x1="65.0" y1="202.5" x2="568.0" y2="202.5" stroke="#182c46" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="119.542" y1="220.0" x2="119.542" y2="45.0" stroke="#182c46" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="568" y="258" fill="#182c46" font-size="23" text-anchor="end">Count</text>
<text x="114.542" y="32.0" fill="#182c46" font-size="23" text-anchor="start">Probability</text>
<line x1="119.542" y1="202.5" x2="119.542" y2="56.667" stroke="#2452a9" stroke-width="5" stroke-linecap="round"/>
<circle cx="119.542" cy="56.667" r="4.6" fill="#2452a9"/>
<text x="119.542" y="230.5" fill="#506784" font-size="20" text-anchor="middle">0</text>
<line x1="240.747" y1="202.5" x2="240.747" y2="105.278" stroke="#2452a9" stroke-width="5" stroke-linecap="round"/>
<circle cx="240.747" cy="105.278" r="4.6" fill="#2452a9"/>
<text x="240.747" y="230.5" fill="#506784" font-size="20" text-anchor="middle">1</text>
<circle cx="361.952" cy="202.5" r="4.6" fill="#067d82"/>
<text x="361.952" y="230.5" fill="#506784" font-size="20" text-anchor="middle">2</text>
<line x1="483.157" y1="202.5" x2="483.157" y2="153.889" stroke="#2452a9" stroke-width="5" stroke-linecap="round"/>
<circle cx="483.157" cy="153.889" r="4.6" fill="#2452a9"/>
