<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 466 220" width="466" height="220" role="img" aria-labelledby="title desc"><title id="title">A shear can preserve a line without fixing the points on it.</title><desc id="desc">The point (1, 2) moves along the horizontal line to (5, 2). The line stays the same even though the point moves.</desc><rect width="466" height="220" fill="#f7fbff" rx="14"/><g font-family="Inter, Arial, sans-serif" font-size="14" fill="#172b4d"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#607a9a" stroke-width="1.1"/></marker></defs><path d="M34,165H441 M47,194V29" stroke="#607a9a" stroke-width="1.4"/><text x="444" y="184">x</text><text x="29" y="35">y</text><path d="M35,83H442" stroke="#728caa" stroke-dasharray="5 4"/><path d="M81,62 H217" marker-end="url(#arr)" fill="none" stroke="#607a9a" stroke-width="1.5"/><circle cx="81" cy="83" r="4" fill="#214fc8"/><text x="64" y="109" fill="#214fc8">(1, 2)</text><circle cx="217" cy="83" r="4" fill="#ae451d"/><text x="200" y="109" fill="#ae451d">(5, 2)</text></g></svg>
