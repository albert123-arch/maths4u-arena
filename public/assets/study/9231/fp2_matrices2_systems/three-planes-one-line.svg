<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 270" width="470" height="270" role="img" aria-labelledby="title description"><title id="title">Three planes with one common line</title><desc id="description">The planes x = 0, y = 0 and x = y all contain the vertical z-axis. The shared line is highlighted in blue.</desc><rect width="470" height="270" rx="14" fill="#f8fafc"/><g font-family="system-ui,sans-serif" font-size="16" fill="#132b48"><polygon points="184,247 286,183 286,31 184,95" fill="#d5e8fc" stroke="#174a99" opacity=".73" stroke-width="2"/><polygon points="154,191 316,239 316,87 154,39" fill="#c9eee5" stroke="#087b66" opacity=".73" stroke-width="2"/><polygon points="103,223 367,207 367,55 103,71" fill="#ffe6c5" stroke="#b45309" opacity=".73" stroke-width="2"/><path d="M235 234V37" stroke="#174a99" stroke-width="4"/><text x="246" y="40">Common line</text><text x="59" y="158">x = y</text><text x="340" y="136">y = 0</text><text x="295" y="205">x = 0</text></g></svg>
