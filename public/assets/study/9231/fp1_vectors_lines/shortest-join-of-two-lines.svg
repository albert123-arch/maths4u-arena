<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 465 194" width="465" height="194" role="img" aria-labelledby="title desc">
  <title id="title">The shortest segment between two skew lines</title>
  <desc id="desc">The dashed segment meets both lines at right angles in space. Both markers are drawn in perspective with the lines.</desc>
  <rect width="465" height="194" rx="14" fill="#f7fbff"/>
  <g fill="none">
    <path d="M55 159H345" stroke="#1749bd" stroke-width="2.7"/>
    <path d="M98 98L362 34.727" stroke="#a74716" stroke-width="2.7"/>
    <path d="M219 69V159" stroke="#385778" stroke-width="2.2" stroke-dasharray="6 4"/>
    <path d="M233 65.645V79.645L219 83M219 145H233V159" stroke="#385778" stroke-width="1.7"/>
  </g>
  <circle cx="219" cy="69" r="4" fill="#a74716"/>
  <circle cx="219" cy="159" r="4" fill="#1749bd"/>
  <g font-family="Inter, Arial, sans-serif" font-size="17" fill="#172b4d">
    <text x="372" y="40">Line 2</text>
