<svg xmlns="http://www.w3.org/2000/svg" width="640" height="325" viewBox="0 0 640 325" role="img" aria-labelledby="title desc"><title id="title">A monotone transform takes each endpoint to its new value</title><desc id="desc">The upper line marks zero and one for X. The lower line shows endpoints one and three for Y. Connector arrows map the first to the first and the last to the last.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#182c46"/></marker></defs><g font-family="system-ui,sans-serif"><rect width="640" height="325" rx="18" fill="#f8fbff"/>
<rect x="13" y="13" width="614" height="299" rx="14" fill="none" stroke="#d4e1f1"/>
<line x1="98.533" y1="99.0" x2="551.233" y2="99.0" stroke="#182c46" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="98.533" y1="216.0" x2="551.233" y2="216.0" stroke="#182c46" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="567.233" y="107.0" fill="#182c46" font-size="23" text-anchor="start">X</text>
<text x="567.233" y="224.0" fill="#182c46" font-size="23" text-anchor="start">Y</text>
<line x1="148.833" y1="99.0" x2="232.667" y2="216.0" stroke="#067d82" stroke-width="2.8" stroke-linecap="round" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<circle cx="148.833" cy="99.0" r="4.6" fill="#2452a9"/>
<circle cx="232.667" cy="216.0" r="4.6" fill="#2452a9"/>
<text x="148.833" y="81.0" fill="#506784" font-size="19" text-anchor="middle">0</text>
<text x="232.667" y="244.0" fill="#506784" font-size="19" text-anchor="middle">1</text>
<line x1="232.667" y1="99.0" x2="400.333" y2="216.0" stroke="#067d82" stroke-width="2.8" stroke-linecap="round" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<circle cx="232.667" cy="99.0" r="4.6" fill="#2452a9"/>
<circle cx="400.333" cy="216.0" r="4.6" fill="#2452a9"/>
<text x="232.667" y="81.0" fill="#506784" font-size="19" text-anchor="middle">1</text>
