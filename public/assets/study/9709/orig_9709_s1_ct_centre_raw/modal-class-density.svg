<svg xmlns="http://www.w3.org/2000/svg" width="620" height="280" viewBox="0 0 620 280" role="img" aria-labelledby="title desc">
<title id="title">Histogram with unequal class widths</title>
<desc id="desc">Heights are frequency densities and widths are class widths.</desc>
<rect width="620" height="280" rx="14" fill="#f6f9fc"/>
<g font-family="Arial,sans-serif">
<text x="80" y="30" fill="#233750" font-size="22" text-anchor="start">Frequency density</text>
<text x="332.5" y="270" fill="#233750" font-size="21" text-anchor="middle">Time (s)</text>
<line x1="80" y1="223" x2="585" y2="223" stroke="#dce5ec" stroke-width="1"/>
<text x="69" y="230" fill="#233750" font-size="19" text-anchor="end">0</text>
<line x1="80" y1="172.39" x2="585" y2="172.39" stroke="#dce5ec" stroke-width="1"/>
<text x="69" y="179.39" fill="#233750" font-size="19" text-anchor="end">1</text>
<line x1="80" y1="121.79" x2="585" y2="121.79" stroke="#dce5ec" stroke-width="1"/>
<text x="69" y="128.79" fill="#233750" font-size="19" text-anchor="end">2</text>
<line x1="80" y1="71.18" x2="585" y2="71.18" stroke="#dce5ec" stroke-width="1"/>
<text x="69" y="78.18" fill="#233750" font-size="19" text-anchor="end">3</text>
<line x1="80" y1="56" x2="80" y2="223" stroke="#dce5ec" stroke-width="1"/>
<text x="80" y="247" fill="#233750" font-size="19" text-anchor="middle">0</text>
<line x1="171.82" y1="56" x2="171.82" y2="223" stroke="#dce5ec" stroke-width="1"/>
<text x="171.82" y="247" fill="#233750" font-size="19" text-anchor="middle">4</text>
<line x1="309.55" y1="56" x2="309.55" y2="223" stroke="#dce5ec" stroke-width="1"/>
<text x="309.55" y="247" fill="#233750" font-size="19" text-anchor="middle">10</text>
<line x1="585" y1="56" x2="585" y2="223" stroke="#dce5ec" stroke-width="1"/>
<text x="585" y="247" fill="#233750" font-size="19" text-anchor="middle">22</text>
<line x1="80" y1="56" x2="80" y2="223" stroke="#233750" stroke-width="2"/>
<line x1="80" y1="223" x2="585" y2="223" stroke="#233750" stroke-width="2"/>
<rect x="80" y="121.79" width="91.82" height="101.21" rx="0" fill="#2459ac" fill-opacity="0.15" stroke="#2459ac" stroke-width="2"/>
<rect x="171.82" y="71.18" width="137.73" height="151.82" rx="0" fill="#087c78" fill-opacity="0.15" stroke="#087c78" stroke-width="2"/>
<rect x="309.55" y="121.79" width="275.45" height="101.21" rx="0" fill="#6e4cb0" fill-opacity="0.15" stroke="#6e4cb0" stroke-width="2"/>
</g>
</svg>
