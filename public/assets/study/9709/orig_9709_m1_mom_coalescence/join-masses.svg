<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">One body after a sticking collision</title><desc id="desc">A approaches B, which is stationary in this diagram. After contact both masses are joined and move right at a common velocity.</desc><defs><marker id="ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#16283c"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2052ac"/></marker><marker id="green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#087a76"/></marker><marker id="gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#87500c"/></marker></defs><g font-family="system-ui,sans-serif"><rect width="640" height="360" rx="18" fill="#f8fbff"/>
<rect x="14" y="14" width="612" height="332" rx="14" fill="none" stroke="#ccdbea"/>
<text x="43" y="50" fill="#536983" font-size="22" text-anchor="start">Positive direction</text>
<line x1="251" y1="43" x2="359" y2="43" stroke="#16283c" stroke-width="4" stroke-linecap="round" marker-end="url(#ink)"/>
<text x="43" y="118" fill="#16283c" font-size="22" text-anchor="start">Before</text>
<line x1="53" y1="164" x2="587" y2="164" stroke="#ccdbea" stroke-width="2" stroke-linecap="round"/>
<rect x="202.0" y="115" width="54" height="46" rx="11" fill="#2052ac" stroke="#2052ac" stroke-width="2"/>
<text x="229" y="146" fill="#fff" font-size="23" text-anchor="middle" font-weight="650">A</text>
<rect x="428.0" y="115" width="54" height="46" rx="11" fill="#087a76" stroke="#087a76" stroke-width="2"/>
<text x="455" y="146" fill="#fff" font-size="23" text-anchor="middle" font-weight="650">B</text>
<line x1="266" y1="138" x2="376" y2="138" stroke="#2052ac" stroke-width="4" stroke-linecap="round" marker-end="url(#blue)"/>
<text x="455" y="190" fill="#536983" font-size="18" text-anchor="middle">At rest</text>
<text x="43" y="258" fill="#16283c" font-size="22" text-anchor="start">After</text>
<line x1="53" y1="300" x2="587" y2="300" stroke="#ccdbea" stroke-width="2" stroke-linecap="round"/>
<rect x="248.5" y="251" width="133" height="46" rx="11" fill="#087a76" stroke="#087a76" stroke-width="2"/>
<text x="315" y="282" fill="#fff" font-size="23" text-anchor="middle" font-weight="650">A + B</text>
<line x1="388" y1="275" x2="505" y2="275" stroke="#087a76" stroke-width="4" stroke-linecap="round" marker-end="url(#green)"/>
<text x="463" y="321" fill="#536983" font-size="18" text-anchor="middle">Shared velocity</text></g>
</svg>
