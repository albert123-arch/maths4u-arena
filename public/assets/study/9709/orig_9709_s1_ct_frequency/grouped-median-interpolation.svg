<svg xmlns="http://www.w3.org/2000/svg" width="620" height="280" viewBox="0 0 620 280" role="img" aria-labelledby="title desc">
<title id="title">Cumulative frequency plot</title>
<desc id="desc">Dashed guides connect time or measurement values to cumulative counts.</desc>
<rect width="620" height="280" rx="14" fill="#f6f9fc"/>
<g font-family="Arial,sans-serif">
<text x="80" y="30" fill="#233750" font-size="22" text-anchor="start">Cumulative count</text>
<text x="332.5" y="270" fill="#233750" font-size="21" text-anchor="middle">Height (cm)</text>
<line x1="80" y1="223" x2="585" y2="223" stroke="#dce5ec" stroke-width="1"/>
<text x="69" y="230" fill="#233750" font-size="19" text-anchor="end">0</text>
<line x1="80" y1="181.25" x2="585" y2="181.25" stroke="#dce5ec" stroke-width="1"/>
<text x="69" y="188.25" fill="#233750" font-size="19" text-anchor="end">5</text>
<line x1="80" y1="139.5" x2="585" y2="139.5" stroke="#dce5ec" stroke-width="1"/>
<text x="69" y="146.5" fill="#233750" font-size="19" text-anchor="end">10</text>
<line x1="80" y1="97.75" x2="585" y2="97.75" stroke="#dce5ec" stroke-width="1"/>
<text x="69" y="104.75" fill="#233750" font-size="19" text-anchor="end">15</text>
<line x1="80" y1="56" x2="585" y2="56" stroke="#dce5ec" stroke-width="1"/>
<text x="69" y="63" fill="#233750" font-size="19" text-anchor="end">20</text>
<line x1="80" y1="56" x2="80" y2="223" stroke="#dce5ec" stroke-width="1"/>
<text x="80" y="247" fill="#233750" font-size="19" text-anchor="middle">10</text>
<line x1="206.25" y1="56" x2="206.25" y2="223" stroke="#dce5ec" stroke-width="1"/>
<text x="206.25" y="247" fill="#233750" font-size="19" text-anchor="middle">20</text>
<line x1="332.5" y1="56" x2="332.5" y2="223" stroke="#dce5ec" stroke-width="1"/>
<text x="332.5" y="247" fill="#233750" font-size="19" text-anchor="middle">30</text>
<line x1="458.75" y1="56" x2="458.75" y2="223" stroke="#dce5ec" stroke-width="1"/>
<text x="458.75" y="247" fill="#233750" font-size="19" text-anchor="middle">40</text>
<line x1="585" y1="56" x2="585" y2="223" stroke="#dce5ec" stroke-width="1"/>
<text x="585" y="247" fill="#233750" font-size="19" text-anchor="middle">50</text>
<line x1="80" y1="56" x2="80" y2="223" stroke="#233750" stroke-width="2"/>
<line x1="80" y1="223" x2="585" y2="223" stroke="#233750" stroke-width="2"/>
<polyline points="80,223 206.25,172.9 332.5,89.4 585,56" fill="none" stroke="#2459ac" stroke-width="3" stroke-linejoin="round"/>
<circle cx="80" cy="223" r="3.8" fill="#2459ac"/>
<circle cx="206.25" cy="172.9" r="3.8" fill="#2459ac"/>
<circle cx="332.5" cy="89.4" r="3.8" fill="#2459ac"/>
<circle cx="585" cy="56" r="3.8" fill="#2459ac"/>
<line x1="80" y1="139.5" x2="256.75" y2="139.5" stroke="#b26b16" stroke-width="2" stroke-dasharray="8 6"/>
<line x1="256.75" y1="223" x2="256.75" y2="139.5" stroke="#b26b16" stroke-width="2" stroke-dasharray="8 6"/>
<circle cx="256.75" cy="139.5" r="5" fill="#b26b16"/>
</g>
</svg>
