<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Before and after a direct impact</title><desc id="desc">A initially approaches B, which is at rest. After impact both move right. The arrow on B is longer, showing their separation.</desc><defs><marker id="ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#16283c"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2052ac"/></marker><marker id="green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#087a76"/></marker><marker id="gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#87500c"/></marker></defs><g font-family="system-ui,sans-serif"><rect width="640" height="360" rx="18" fill="#f8fbff"/>
<rect x="14" y="14" width="612" height="332" rx="14" fill="none" stroke="#ccdbea"/>
<text x="43" y="50" fill="#536983" font-size="22" text-anchor="start">Positive direction</text>
<line x1="251" y1="43" x2="359" y2="43" stroke="#16283c" stroke-width="4" stroke-linecap="round" marker-end="url(#ink)"/>
<text x="43" y="119" fill="#16283c" font-size="22" text-anchor="start">Before</text>
<line x1="53" y1="161" x2="587" y2="161" stroke="#ccdbea" stroke-width="2" stroke-linecap="round"/>
<rect x="186.0" y="112" width="54" height="46" rx="11" fill="#2052ac" stroke="#2052ac" stroke-width="2"/>
<text x="213" y="143" fill="#fff" font-size="23" text-anchor="middle" font-weight="650">A</text>
<rect x="435.0" y="112" width="54" height="46" rx="11" fill="#087a76" stroke="#087a76" stroke-width="2"/>
<text x="462" y="143" fill="#fff" font-size="23" text-anchor="middle" font-weight="650">B</text>
<line x1="245" y1="136" x2="359" y2="136" stroke="#2052ac" stroke-width="4" stroke-linecap="round" marker-end="url(#blue)"/>
<text x="460" y="190" fill="#536983" font-size="18" text-anchor="middle">At rest</text>
<text x="43" y="258" fill="#16283c" font-size="22" text-anchor="start">After</text>
<line x1="53" y1="301" x2="587" y2="301" stroke="#ccdbea" stroke-width="2" stroke-linecap="round"/>
<rect x="191.0" y="252" width="54" height="46" rx="11" fill="#2052ac" stroke="#2052ac" stroke-width="2"/>
<text x="218" y="283" fill="#fff" font-size="23" text-anchor="middle" font-weight="650">A</text>
<rect x="387.0" y="252" width="54" height="46" rx="11" fill="#087a76" stroke="#087a76" stroke-width="2"/>
<text x="414" y="283" fill="#fff" font-size="23" text-anchor="middle" font-weight="650">B</text>
<line x1="251" y1="276" x2="301" y2="276" stroke="#2052ac" stroke-width="4" stroke-linecap="round" marker-end="url(#blue)"/>
<line x1="448" y1="276" x2="563" y2="276" stroke="#087a76" stroke-width="4" stroke-linecap="round" marker-end="url(#green)"/></g>
</svg>
