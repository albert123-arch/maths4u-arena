<svg xmlns="http://www.w3.org/2000/svg" width="620" height="171" viewBox="0 0 620 171" role="img" aria-labelledby="title desc">
<title id="title">Group means and their pooled mean</title>
<desc id="desc">Group A is centred at 12 and group B at 17. The pooled mean of 15 is closer to B.</desc>
<rect width="620" height="171" rx="14" fill="#f6f9fc"/>
<g font-family="Arial,sans-serif">
<line x1="72" y1="76" x2="572" y2="76" stroke="#233750" stroke-width="2"/>
<circle cx="129" cy="76" r="6" fill="#2459ac"/>
<text x="129" y="51" fill="#2459ac" font-size="20" text-anchor="middle">A</text>
<text x="129" y="111" fill="#2459ac" font-size="20" text-anchor="middle">12</text>
<circle cx="365" cy="76" r="6" fill="#b26b16"/>
<text x="365" y="51" fill="#b26b16" font-size="20" text-anchor="middle">Pooled</text>
<text x="365" y="111" fill="#b26b16" font-size="20" text-anchor="middle">15</text>
<circle cx="521" cy="76" r="6" fill="#087c78"/>
<text x="521" y="51" fill="#087c78" font-size="20" text-anchor="middle">B</text>
<text x="521" y="111" fill="#087c78" font-size="20" text-anchor="middle">17</text>
<text x="307" y="152" fill="#233750" font-size="20" text-anchor="middle">Mean (cm)</text>
</g>
</svg>
