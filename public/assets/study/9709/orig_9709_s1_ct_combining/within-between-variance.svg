<svg xmlns="http://www.w3.org/2000/svg" width="620" height="280" viewBox="0 0 620 280" role="img" aria-labelledby="title desc">
<title id="title">Pooled variance in two situations</title>
<desc id="desc">Both bars have within-group variance six. Only the separated means add between-group variance six.</desc>
<rect width="620" height="280" rx="14" fill="#f6f9fc"/>
<g font-family="Arial,sans-serif">
<text x="80" y="30" fill="#233750" font-size="22" text-anchor="start">Variance contributions</text>
<text x="332.5" y="270" fill="#233750" font-size="21" text-anchor="middle">Group centres (cm)</text>
<line x1="80" y1="223" x2="585" y2="223" stroke="#dce5ec" stroke-width="1"/>
<text x="69" y="230" fill="#233750" font-size="19" text-anchor="end">0</text>
<line x1="80" y1="184.46" x2="585" y2="184.46" stroke="#dce5ec" stroke-width="1"/>
<text x="69" y="191.46" fill="#233750" font-size="19" text-anchor="end">3</text>
<line x1="80" y1="145.92" x2="585" y2="145.92" stroke="#dce5ec" stroke-width="1"/>
<text x="69" y="152.92" fill="#233750" font-size="19" text-anchor="end">6</text>
<line x1="80" y1="107.38" x2="585" y2="107.38" stroke="#dce5ec" stroke-width="1"/>
<text x="69" y="114.38" fill="#233750" font-size="19" text-anchor="end">9</text>
<line x1="80" y1="68.85" x2="585" y2="68.85" stroke="#dce5ec" stroke-width="1"/>
<text x="69" y="75.85" fill="#233750" font-size="19" text-anchor="end">12</text>
<line x1="206.25" y1="56" x2="206.25" y2="223" stroke="#dce5ec" stroke-width="1"/>
<text x="206.25" y="247" fill="#233750" font-size="19" text-anchor="middle">Means 12 and 17</text>
<line x1="458.75" y1="56" x2="458.75" y2="223" stroke="#dce5ec" stroke-width="1"/>
<text x="458.75" y="247" fill="#233750" font-size="19" text-anchor="middle">Both means 12</text>
<line x1="80" y1="56" x2="80" y2="223" stroke="#233750" stroke-width="2"/>
<line x1="80" y1="223" x2="585" y2="223" stroke="#233750" stroke-width="2"/>
<rect x="149.44" y="145.92" width="113.62" height="77.08" rx="0" fill="#087c78" fill-opacity="0.15" stroke="#087c78" stroke-width="2"/>
<rect x="149.44" y="68.85" width="113.62" height="77.08" rx="0" fill="#b26b16" fill-opacity="0.15" stroke="#b26b16" stroke-width="2"/>
<rect x="401.94" y="145.92" width="113.62" height="77.08" rx="0" fill="#087c78" fill-opacity="0.15" stroke="#087c78" stroke-width="2"/>
<text x="206.25" y="189.46" fill="#233750" font-size="19" text-anchor="middle">Within: 6</text>
<text x="458.75" y="189.46" fill="#233750" font-size="19" text-anchor="middle">Within: 6</text>
<text x="206.25" y="112.38" fill="#233750" font-size="19" text-anchor="middle">Between: 6</text>
</g>
</svg>
