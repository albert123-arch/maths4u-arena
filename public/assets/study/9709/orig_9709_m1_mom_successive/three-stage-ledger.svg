<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">A three-particle sequence of direct impacts</title><desc id="desc">Before the first impact A, B and C are ordered left to right. At first contact A and B meet and move right. At the second contact B and C meet while A is behind.</desc><defs><marker id="ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#16283c"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2052ac"/></marker><marker id="green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#087a76"/></marker><marker id="gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#87500c"/></marker></defs><g font-family="system-ui,sans-serif"><rect width="640" height="360" rx="18" fill="#f8fbff"/>
<rect x="14" y="14" width="612" height="332" rx="14" fill="none" stroke="#ccdbea"/>
<line x1="53" y1="128" x2="587" y2="128" stroke="#ccdbea" stroke-width="2" stroke-linecap="round"/>
<line x1="53" y1="233" x2="587" y2="233" stroke="#ccdbea" stroke-width="2" stroke-linecap="round"/>
<line x1="53" y1="338" x2="587" y2="338" stroke="#ccdbea" stroke-width="2" stroke-linecap="round"/>
<text x="42" y="57" fill="#536983" font-size="21" text-anchor="start">Before the first impact</text>
<rect x="142.0" y="77" width="54" height="46" rx="11" fill="#2052ac" stroke="#2052ac" stroke-width="2"/>
<text x="169" y="108" fill="#fff" font-size="23" text-anchor="middle" font-weight="650">A</text>
<rect x="336.0" y="77" width="54" height="46" rx="11" fill="#087a76" stroke="#087a76" stroke-width="2"/>
<text x="363" y="108" fill="#fff" font-size="23" text-anchor="middle" font-weight="650">B</text>
<rect x="504.0" y="77" width="54" height="46" rx="11" fill="#87500c" stroke="#87500c" stroke-width="2"/>
<text x="531" y="108" fill="#fff" font-size="23" text-anchor="middle" font-weight="650">C</text>
<line x1="206" y1="100" x2="295" y2="100" stroke="#2052ac" stroke-width="4" stroke-linecap="round" marker-end="url(#blue)"/>
<text x="42" y="162" fill="#536983" font-size="21" text-anchor="start">Immediately after A–B</text>
<rect x="162.0" y="182" width="54" height="46" rx="11" fill="#2052ac" stroke="#2052ac" stroke-width="2"/>
<text x="189" y="213" fill="#fff" font-size="23" text-anchor="middle" font-weight="650">A</text>
<rect x="216.0" y="182" width="54" height="46" rx="11" fill="#087a76" stroke="#087a76" stroke-width="2"/>
<text x="243" y="213" fill="#fff" font-size="23" text-anchor="middle" font-weight="650">B</text>
<rect x="504.0" y="182" width="54" height="46" rx="11" fill="#87500c" stroke="#87500c" stroke-width="2"/>
<text x="531" y="213" fill="#fff" font-size="23" text-anchor="middle" font-weight="650">C</text>
<line x1="221" y1="174" x2="258" y2="174" stroke="#2052ac" stroke-width="4" stroke-linecap="round" marker-end="url(#blue)"/>
<line x1="277" y1="205" x2="396" y2="205" stroke="#087a76" stroke-width="4" stroke-linecap="round" marker-end="url(#green)"/>
<text x="42" y="267" fill="#536983" font-size="21" text-anchor="start">Immediately after B–C</text>
<rect x="205.0" y="287" width="54" height="46" rx="11" fill="#2052ac" stroke="#2052ac" stroke-width="2"/>
<text x="232" y="318" fill="#fff" font-size="23" text-anchor="middle" font-weight="650">A</text>
<rect x="415.0" y="287" width="54" height="46" rx="11" fill="#087a76" stroke="#087a76" stroke-width="2"/>
<text x="442" y="318" fill="#fff" font-size="23" text-anchor="middle" font-weight="650">B</text>
<rect x="469.0" y="287" width="54" height="46" rx="11" fill="#87500c" stroke="#87500c" stroke-width="2"/>
<text x="496" y="318" fill="#fff" font-size="23" text-anchor="middle" font-weight="650">C</text>
<line x1="266" y1="310" x2="306" y2="310" stroke="#2052ac" stroke-width="4" stroke-linecap="round" marker-end="url(#blue)"/>
<line x1="475" y1="279" x2="515" y2="279" stroke="#087a76" stroke-width="4" stroke-linecap="round" marker-end="url(#green)"/>
<line x1="530" y1="310" x2="582" y2="310" stroke="#87500c" stroke-width="4" stroke-linecap="round" marker-end="url(#gold)"/></g>
</svg>
