<svg xmlns="http://www.w3.org/2000/svg" width="620" height="280" viewBox="0 0 620 280" role="img" aria-labelledby="title desc">
<title id="title">Histogram with unequal class widths</title>
<desc id="desc">Heights are frequency densities and widths are class widths.</desc>
<rect width="620" height="280" rx="14" fill="#f6f9fc"/>
<g font-family="Arial,sans-serif">
<text x="80" y="30" fill="#233750" font-size="22" text-anchor="start">Frequency density</text>
<text x="332.5" y="270" fill="#233750" font-size="21" text-anchor="middle">Height (cm)</text>
<line x1="80" y1="223" x2="585" y2="223" stroke="#dce5ec" stroke-width="1"/>
<text x="69" y="230" fill="#233750" font-size="19" text-anchor="end">0</text>
<line x1="80" y1="147.09" x2="585" y2="147.09" stroke="#dce5ec" stroke-width="1"/>
<text x="69" y="154.09" fill="#233750" font-size="19" text-anchor="end">1</text>
<line x1="80" y1="71.18" x2="585" y2="71.18" stroke="#dce5ec" stroke-width="1"/>
<text x="69" y="78.18" fill="#233750" font-size="19" text-anchor="end">2</text>
<line x1="80" y1="56" x2="80" y2="223" stroke="#dce5ec" stroke-width="1"/>
<text x="80" y="247" fill="#233750" font-size="19" text-anchor="middle">0</text>
<line x1="181" y1="56" x2="181" y2="223" stroke="#dce5ec" stroke-width="1"/>
<text x="181" y="247" fill="#233750" font-size="19" text-anchor="middle">5</text>
<line x1="383" y1="56" x2="383" y2="223" stroke="#dce5ec" stroke-width="1"/>
<text x="383" y="247" fill="#233750" font-size="19" text-anchor="middle">15</text>
<line x1="585" y1="56" x2="585" y2="223" stroke="#dce5ec" stroke-width="1"/>
<text x="585" y="247" fill="#233750" font-size="19" text-anchor="middle">25</text>
<line x1="80" y1="56" x2="80" y2="223" stroke="#233750" stroke-width="2"/>
<line x1="80" y1="223" x2="585" y2="223" stroke="#233750" stroke-width="2"/>
<rect x="80" y="101.55" width="101" height="121.45" rx="0" fill="#2459ac" fill-opacity="0.15" stroke="#2459ac" stroke-width="2"/>
<rect x="181" y="71.18" width="202" height="151.82" rx="0" fill="#087c78" fill-opacity="0.15" stroke="#087c78" stroke-width="2"/>
<rect x="383" y="131.91" width="202" height="91.09" rx="0" fill="#6e4cb0" fill-opacity="0.15" stroke="#6e4cb0" stroke-width="2"/>
</g>
</svg>
