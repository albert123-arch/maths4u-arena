<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300" role="img" aria-labelledby="ellipse-title ellipse-desc">
  <title id="ellipse-title">Horizontal and vertical tangents of an ellipse</title>
  <desc id="ellipse-desc">The ellipse meets its horizontal tangent at zero comma two and its vertical tangent at four comma zero.</desc>
  <rect width="600" height="300" fill="#fff"/>
  <path d="M78 147H541m-8-4 8 4-8 4M300 254V29m-4 8 4-8 4 8" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <ellipse cx="300" cy="147" rx="168" ry="84" fill="#eff6ff" fill-opacity=".45" stroke="#1d4ed8" stroke-width="3"/>
  <path d="M93 63H535M468 36V252" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="7 5"/>
  <circle cx="300" cy="63" r="4.5" fill="#4c1d95"/>
  <circle cx="468" cy="147" r="4.5" fill="#4c1d95"/>
  <g fill="#172554" font-family="system-ui, sans-serif" font-size="18">
    <text x="546" y="151">x</text>
    <text x="306" y="34">y</text>
    <text x="238" y="53">(0, 2)</text>
    <text x="480" y="171">(4, 0)</text>
  </g>
</svg>
