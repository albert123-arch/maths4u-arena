<svg xmlns="http://www.w3.org/2000/svg" width="480" height="270" viewBox="0 0 480 270" role="img" aria-labelledby="title desc">
<title id="title">A box sliding up a rough slope</title><desc id="desc">An inclined surface slopes upwards to the right. Weight is vertical down, the reaction is perpendicular to the surface, and friction is downhill while the box moves uphill.</desc>
<rect width="480" height="270" rx="12" fill="#f8fafc"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="context-stroke"/></marker></defs>
<path d="M92 253L404 19" stroke="#64748b" stroke-width="2.5"/><circle cx="244" cy="139" r="8" fill="#1e293b"/>
<g font-family="system-ui,sans-serif" font-size="19" fill="#162b42"><path d="M244 139L244 231" stroke="#374151" stroke-width="3.5" marker-end="url(#arrow)" fill="none"/><text x="304" y="228" text-anchor="middle">Weight</text><path d="M244 139L184 59" stroke="#08765e" stroke-width="3.5" marker-end="url(#arrow)" fill="none"/><text x="160" y="52" text-anchor="middle">Reaction</text><path d="M244 139L156 205" stroke="#9a3412" stroke-width="3.5" marker-end="url(#arrow)" fill="none"/><text x="135" y="221" text-anchor="middle">Friction</text><path d="M278 130L390 46" stroke="#1d4ed8" stroke-width="3.5" marker-end="url(#arrow)" fill="none"/><text x="403" y="38" text-anchor="middle">Motion</text></g>
</svg>
