<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Signed directions and momenta</title><desc id="desc">The positive axis points right. A moves left and has negative signed momentum. B moves right and has positive signed momentum.</desc><defs><marker id="ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#16283c"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2052ac"/></marker><marker id="green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#087a76"/></marker><marker id="gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#87500c"/></marker></defs><g font-family="system-ui,sans-serif"><rect width="640" height="360" rx="18" fill="#f8fbff"/>
<rect x="14" y="14" width="612" height="332" rx="14" fill="none" stroke="#ccdbea"/>
<text x="43" y="50" fill="#536983" font-size="22" text-anchor="start">Positive direction</text>
<line x1="251" y1="43" x2="359" y2="43" stroke="#16283c" stroke-width="4" stroke-linecap="round" marker-end="url(#ink)"/>
<line x1="53" y1="213" x2="587" y2="213" stroke="#ccdbea" stroke-width="2" stroke-linecap="round"/>
<rect x="153.0" y="162" width="54" height="46" rx="11" fill="#2052ac" stroke="#2052ac" stroke-width="2"/>
<text x="180" y="193" fill="#fff" font-size="23" text-anchor="middle" font-weight="650">A</text>
<rect x="418.0" y="162" width="54" height="46" rx="11" fill="#087a76" stroke="#087a76" stroke-width="2"/>
<text x="445" y="193" fill="#fff" font-size="23" text-anchor="middle" font-weight="650">B</text>
<line x1="147" y1="185" x2="67" y2="185" stroke="#2052ac" stroke-width="4" stroke-linecap="round" marker-end="url(#blue)"/>
<line x1="479" y1="185" x2="559" y2="185" stroke="#087a76" stroke-width="4" stroke-linecap="round" marker-end="url(#green)"/>
<text x="119" y="271" fill="#2052ac" font-size="23" text-anchor="middle" font-weight="650">Negative</text>
<text x="519" y="271" fill="#087a76" font-size="23" text-anchor="middle" font-weight="650">Positive</text></g>
</svg>
