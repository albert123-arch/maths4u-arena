<svg xmlns="http://www.w3.org/2000/svg" width="480" height="215" viewBox="0 0 480 215" role="img" aria-labelledby="title desc">
  <title id="title">Intersection of two open intervals</title>
  <desc id="desc">The square root expansion is valid between negative one half and one half. The reciprocal expansion is valid between negative three and three. The shared interval is the smaller open interval.</desc>
  <rect width="480" height="215" rx="12" fill="#f8fafc"/>
  <path d="M282.5 36V167m45-131V167" stroke="#94a3b8" stroke-dasharray="4 4"/>
  <path d="M282.5 39h45" stroke="#1d4ed8" stroke-width="4"/>
  <path d="M170 86h270" stroke="#7e22ce" stroke-width="4"/>
  <path d="M282.5 133h45" stroke="#047857" stroke-width="4"/>
  <g fill="#f8fafc" stroke-width="2.5">
    <circle cx="282.5" cy="39" r="5" stroke="#1d4ed8"/>
    <circle cx="327.5" cy="39" r="5" stroke="#1d4ed8"/>
    <circle cx="170" cy="86" r="5" stroke="#7e22ce"/>
    <circle cx="440" cy="86" r="5" stroke="#7e22ce"/>
    <circle cx="282.5" cy="133" r="5" stroke="#047857"/>
    <circle cx="327.5" cy="133" r="5" stroke="#047857"/>
  </g>
  <path d="M144 167H459l-7-5M459 167l-7 5M170 161v12m112.5-12v12m45-12v12M440 161v12" fill="none" stroke="#475569" stroke-width="1.5"/>
  <g font-family="system-ui,sans-serif" font-size="17" fill="#1e293b">
    <text x="15" y="45">Square root</text>
    <text x="15" y="92">Reciprocal</text>
    <text x="15" y="139">Both</text>
    <g text-anchor="middle">
      <text x="170" y="194">−3</text><text x="282.5" y="194">−0.5</text>
      <text x="327.5" y="194">0.5</text><text x="440" y="194">3</text>
    </g>
    <text x="464" y="172">x</text>
  </g>
</svg>
