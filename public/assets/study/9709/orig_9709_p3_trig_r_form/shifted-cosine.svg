<title id="plot-title">A shifted cosine retains its amplitude</title>
<desc id="plot-desc">The blue cosine has phase arctangent of four thirds, a peak at alpha and a trough at pi plus alpha. The grey cosine has the same amplitude and no shift.</desc>
