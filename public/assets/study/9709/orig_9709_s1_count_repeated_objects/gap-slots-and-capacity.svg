<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="885" height="125" viewBox="10 228 885 125" version="1.1" role="img" aria-labelledby="gap-slots-and-capacity-title gap-slots-and-capacity-desc">
 <title id="gap-slots-and-capacity-title">Five gaps around four distinct anchors allow three identical A copies to be placed separately</title><desc id="gap-slots-and-capacity-desc">The multiset is three identical A copies and four distinct anchors B, C, D and E. The anchors have four factorial, twenty-four, orders. Any one order has five gaps: before the first anchor, three internal gaps, and after the last anchor. The illustrated order is B C D E. Gaps one, three and five contain an A, while gaps two and four are empty; reading the filled row gives A B C A D E A. To place all three identical A copies with no adjacent A symbols, choose three different gaps from the five. There are five choose three, ten, choices, and each choice fixes the placement of the identical copies. Hence twenty-four times ten gives two hundred forty separated visible rows. Do not multiply by three factorial again. Each gap holds at most one A under this restriction, so this particular four-anchor set has capacity five separated A copies. The smaller interactive uses only B and C as anchors and therefore has a different gap capacity.</desc><defs>
