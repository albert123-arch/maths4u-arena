<svg xmlns="http://www.w3.org/2000/svg" width="480" height="270" viewBox="0 0 480 270" role="img" aria-labelledby="title desc">
<title id="title">Forces on a parcel in a lift</title><desc id="desc">A parcel is supported by the lift floor. Its normal reaction R acts upward and its weight W acts downward.</desc>
<rect width="480" height="270" rx="12" fill="#f8fafc"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="context-stroke"/></marker></defs>
<path d="M106 42V190H340V42" stroke="#94a3b8" stroke-width="2" fill="none"/><rect x="206" y="119" width="68" height="71" rx="5" fill="#dbeafe" stroke="#64748b"/>
<g font-family="system-ui,sans-serif" font-size="19" fill="#162b42"><path d="M240 136L240 47" stroke="#08765e" stroke-width="3.5" marker-end="url(#arrow)" fill="none"/><text x="278" y="64" text-anchor="middle">R</text><path d="M240 136L240 222" stroke="#9a3412" stroke-width="3.5" marker-end="url(#arrow)" fill="none"/><text x="278" y="210" text-anchor="middle">W</text><path d="M365 201L365 76" stroke="#1d4ed8" stroke-width="3.5" marker-end="url(#arrow)" fill="none"/><text x="412" y="97" text-anchor="middle">Upwards</text></g>
</svg>
