<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="480" height="120" role="img" aria-labelledby="title desc">
  <title id="title">Two rays for a strict distance inequality</title>
  <desc id="desc">The solution to |x + 2| &gt; 4 is the two shaded rays outside the interval from −6 to 2. The boundaries −6 and 2 are hollow, and the centre −2 is excluded.</desc>
  <rect width="480" height="120" rx="12" fill="#f8fafc"/>
  <path d="M26 56H454" fill="none" stroke="#475569" stroke-width="1.5"/>
  <g fill="none" stroke="#1d4ed8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M26 56H115M35 50l-9 6 9 6M365 56h89m-9-6 9 6-9 6"/>
  </g>
  <g fill="#f8fafc" stroke="#1d4ed8" stroke-width="2.5">
    <circle cx="115" cy="56" r="6"/><circle cx="365" cy="56" r="6"/>
  </g>
  <path d="M240 51v10" stroke="#475569" stroke-width="1.5"/>
  <g font-family="system-ui,sans-serif" font-size="17" text-anchor="middle" fill="#334155">
    <text x="115" y="86">−6</text><text x="240" y="86">−2</text>
    <text x="365" y="86">2</text><text x="465" y="62">x</text>
    <text x="240" y="32">Centre</text>
  </g>
</svg>
