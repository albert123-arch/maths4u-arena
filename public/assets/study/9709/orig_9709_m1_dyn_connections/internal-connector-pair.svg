<svg xmlns="http://www.w3.org/2000/svg" width="480" height="270" viewBox="0 0 480 270" role="img" aria-labelledby="title desc">
<title id="title">Internal forces of a two-vehicle system</title><desc id="desc">Two vehicles are joined by a connector. It pulls the front vehicle to the left and the rear vehicle to the right. A drive arrow acts right on the front vehicle.</desc>
<rect width="480" height="270" rx="12" fill="#f8fafc"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="context-stroke"/></marker></defs>
<path d="M47 189H444" stroke="#64748b" stroke-width="2"/><rect x="83" y="109" width="108" height="55" rx="8" fill="#e0f2fe" stroke="#1d4ed8"/><rect x="289" y="109" width="104" height="55" rx="8" fill="#dbeafe" stroke="#1d4ed8"/><path d="M191 151H289" stroke="#64748b" stroke-width="3"/><text x="137" y="218" text-anchor="middle" font-size="17" font-family="system-ui">Rear</text><text x="341" y="218" text-anchor="middle" font-size="17" font-family="system-ui">Front</text>
<g font-family="system-ui,sans-serif" font-size="19" fill="#162b42"><path d="M342 135L434 135" stroke="#1d4ed8" stroke-width="3.5" marker-end="url(#arrow)" fill="none"/><text x="421" y="115" text-anchor="middle">Drive</text><path d="M341 135L251 135" stroke="#9a3412" stroke-width="3.5" marker-end="url(#arrow)" fill="none"/><text x="276" y="119" text-anchor="middle">T</text><path d="M138 135L213 135" stroke="#9a3412" stroke-width="3.5" marker-end="url(#arrow)" fill="none"/><text x="181" y="119" text-anchor="middle">T</text></g>
</svg>
