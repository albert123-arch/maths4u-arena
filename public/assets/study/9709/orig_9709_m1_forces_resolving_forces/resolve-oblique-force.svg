<svg xmlns="http://www.w3.org/2000/svg" width="480" height="270" viewBox="0 0 480 270" role="img">
<title>An angled force P points up and right. A right triangle shows the horizontal projection P x and vertical projection P y.</title>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L7 4L0 8Z" style="fill:context-stroke;stroke:none"/></marker></defs>
<style>
path { fill:none; stroke-linecap:round; stroke-width:3.2 }
.arrow { marker-end:url(#arrow) } .normal { stroke:#0c756a } .weight { stroke:#954111 } .applied { stroke:#2855b0 }
.friction { stroke:#7b3e9b } .surface { stroke:#69809d } .guide { stroke:#91a3b6; stroke-width:2; stroke-dasharray:5 5 }
.arc { stroke:#527093; stroke-width:2.4 } .body { fill:#dbe8f9; stroke:#839ab7; stroke-width:2 }
circle { fill:#16365f } text { font:700 24px system-ui,sans-serif; fill:#16365f }
</style>
<rect x="1" y="1" width="478" height="268" rx="16" fill="#f2f7ff" stroke="#c7d6eb"/><path d="M93,208L390,208" class="surface"/><path d="M355,208L355,66" class="guide"/><path d="M93,208L355,66" class="arrow applied"/><text x="372" y="66">P</text><path d="M154 208A61 61 0 0 0 146 179" class="arc"/><text x="166" y="201">θ</text><text x="216" y="242">Pₓ</text><text x="365" y="146">Pᵧ</text><circle cx="93" cy="208" r="5"/></svg>
