<svg xmlns="http://www.w3.org/2000/svg" width="480" height="270" viewBox="0 0 480 270" role="img">
<title>A vehicle moves uphill. Driving force is uphill, resistance is downhill, weight is vertical and normal reaction is perpendicular to the road.</title>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L7 4L0 8Z" style="fill:context-stroke;stroke:none"/></marker></defs>
<style>
path { fill:none; stroke-linecap:round; stroke-width:3.2 }
.arrow { marker-end:url(#arrow) } .normal { stroke:#0c756a } .weight { stroke:#954111 } .applied { stroke:#2855b0 }
.friction { stroke:#7b3e9b } .motion { stroke:#526b88 } .surface { stroke:#69809d } .guide { stroke:#91a3b6; stroke-width:2; stroke-dasharray:5 5 }
.route { stroke:#526b88; stroke-width:4 } .datum { stroke:#6e839e; stroke-width:2; stroke-dasharray:8 5 } .arc { stroke:#527093; stroke-width:2.4 } .body { fill:#dbe8f9; stroke:#839ab7; stroke-width:2 }
.pulley { fill:#e7edf7; stroke:#426687; stroke-width:3 } circle { fill:#16365f } text { font:700 24px system-ui,sans-serif; fill:#16365f }
</style>
<rect x="1" y="1" width="478" height="268" rx="16" fill="#f2f7ff" stroke="#c7d6eb"/><path d="M62,257L422,77" class="route"/><circle cx="231" cy="156" r="5"/><path d="M231,156L337,103" class="arrow applied"/><text x="343" y="97">F</text><path d="M231,156L147,198" class="arrow friction"/><text x="118" y="200">R</text><path d="M231,156L231,229" class="arrow weight"/><text x="247" y="231">mg</text><path d="M231,156L189,72" class="arrow normal"/><text x="169" y="63">N</text><path d="M253,102L317,70" class="arrow motion"/><text x="322" y="68">v</text></svg>
