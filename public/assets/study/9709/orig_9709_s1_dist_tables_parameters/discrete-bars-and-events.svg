<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="815" height="391" viewBox="-4 107 815 391" version="1.1" role="img" aria-labelledby="discrete-bars-and-events-title discrete-bars-and-events-desc">
 <title id="discrete-bars-and-events-title">A discrete probability event selects specified supported values</title><desc id="discrete-bars-and-events-desc">A probability bar plot has actual horizontal positions minus one, zero, one half and two, with respective heights one fifth, one tenth, three tenths and two fifths. The event absolute value of X less than one selects only zero and one half, whose bars are highlighted. Their probabilities add to two fifths. Minus one fails the strict inequality. No probability is spread continuously through the gaps between the supported values.</desc><defs>
