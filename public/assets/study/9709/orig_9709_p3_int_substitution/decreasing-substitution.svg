<svg xmlns="http://www.w3.org/2000/svg" width="640" height="340" viewBox="0 0 640 340" role="img" aria-labelledby="title desc">
<title id="title">A decreasing substitution reverses the endpoint order</title><desc id="desc">A line falls as x increases. The first input x equals one maps to seven and the second input x equals three maps to three.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#182c46"/></marker></defs>
<g font-family="system-ui,sans-serif">
<rect width="640" height="340" rx="18" fill="#f8fbff"/>
<rect x="13" y="13" width="614" height="314" rx="14" fill="none" stroke="#d4e1f1"/>
<line x1="65.0" y1="255.577" x2="568.0" y2="255.577" stroke="#182c46" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="110.27" y1="270.0" x2="110.27" y2="45.0" stroke="#182c46" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="585.0" y="263.577" fill="#182c46" font-size="23" text-anchor="start">x</text>
<text x="105.27" y="32.0" fill="#182c46" font-size="23" text-anchor="start">u</text>
<line x1="110.27" y1="82.5" x2="532.79" y2="244.038" stroke="#2452a9" stroke-width="3" stroke-linecap="round"/>
<line x1="210.87" y1="255.577" x2="210.87" y2="120.962" stroke="#067d82" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="7 6"/>
<line x1="110.27" y1="120.962" x2="210.87" y2="120.962" stroke="#067d82" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="7 6"/>
<circle cx="210.87" cy="120.962" r="4.6" fill="#2452a9"/>
<text x="210.87" y="280.577" fill="#506784" font-size="19" text-anchor="middle">1</text>
<text x="101.27" y="126.962" fill="#506784" font-size="19" text-anchor="end">7</text>
<line x1="412.07" y1="255.577" x2="412.07" y2="197.885" stroke="#067d82" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="7 6"/>
<line x1="110.27" y1="197.885" x2="412.07" y2="197.885" stroke="#067d82" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="7 6"/>
<circle cx="412.07" cy="197.885" r="4.6" fill="#2452a9"/>
<text x="412.07" y="280.577" fill="#506784" font-size="19" text-anchor="middle">3</text>
<text x="101.27" y="203.885" fill="#506784" font-size="19" text-anchor="end">3</text>
</g>
</svg>
