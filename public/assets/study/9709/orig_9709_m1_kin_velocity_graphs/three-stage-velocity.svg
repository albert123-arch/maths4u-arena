<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 484 252" width="484" height="252" role="img" aria-labelledby="title desc"><title id="title">Each velocity stage contributes a separate area.</title><desc id="desc">Velocity rises from zero to 4 at t = 2, stays at 4 until t = 5, then falls to zero at t = 9.</desc><rect width="484" height="252" rx="14" fill="#f7fbff"/><g font-family="Inter, Arial, sans-serif" font-size="14" fill="#172b4d" stroke-linejoin="round"><path d="M53.00,210.00 L443.00,210.00" stroke="#52647c" stroke-width="1.4" fill="none" /><path d="M53.00,210.00 L53.00,23.00" stroke="#52647c" stroke-width="1.4" fill="none" /><text x="469" y="233.00" text-anchor="end">t (s)</text><text x="20" y="16">v (m s⁻¹)</text><path d="M53.00,210.00 L131.00,74.00 L248.00,74.00 L404.00,210.00 Z" fill="#d8e7ff"/><path d="M53.00,210.00 L131.00,74.00 L248.00,74.00 L404.00,210.00" stroke="#1d4ed8" stroke-width="1.4" fill="none" style="stroke-width:3"/><circle cx="131.00" cy="74.00" r="3.3" fill="#1d4ed8"/><text x="118.00" y="63.00">(2, 4)</text><circle cx="248.00" cy="74.00" r="3.3" fill="#1d4ed8"/><text x="235.00" y="63.00">(5, 4)</text><circle cx="404.00" cy="210.00" r="3.3" fill="#1d4ed8"/><text x="401.00" y="228.00">9</text></g></svg>
