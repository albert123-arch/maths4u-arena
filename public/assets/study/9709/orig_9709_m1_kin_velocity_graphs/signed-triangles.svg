<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 484 252" width="484" height="252" role="img" aria-labelledby="title desc"><title id="title">Use opposite signs for displacement and positive magnitudes for distance.</title><desc id="desc">Velocity falls in a straight line from 4 at time zero through zero at two seconds to −6 at five seconds. The two triangles have opposite signed areas.</desc><rect width="484" height="252" rx="14" fill="#f7fbff"/><g font-family="Inter, Arial, sans-serif" font-size="14" fill="#172b4d" stroke-linejoin="round"><path d="M53.00,105.28 L443.00,105.28" stroke="#52647c" stroke-width="1.4" fill="none" /><path d="M53.00,210.00 L53.00,23.00" stroke="#52647c" stroke-width="1.4" fill="none" /><text x="469" y="128.28" text-anchor="end">t (s)</text><text x="20" y="16">v (m s⁻¹)</text><path d="M53.00,105.28 L53.00,45.44 L192.29,105.28 Z" fill="#d8e7ff"/><path d="M192.29,105.28 L401.21,195.04 L401.21,105.28 Z" fill="#ffe0d0"/><path d="M53.00,45.44 L401.21,195.04" stroke="#1d4ed8" stroke-width="1.4" fill="none" style="stroke-width:3"/><circle cx="53.00" cy="45.44" r="3.3" fill="#1d4ed8"/><text x="62.00" y="36.44">4</text><circle cx="192.29" cy="105.28" r="3.3" fill="#1d4ed8"/><text x="197.29" y="122.28">2</text><circle cx="401.21" cy="195.04" r="3.3" fill="#a1390f"/><text x="346.21" y="214.04">(5, −6)</text></g></svg>
