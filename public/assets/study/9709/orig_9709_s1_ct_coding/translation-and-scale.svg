<line x1="508.5" y1="25" x2="508.5" y2="230" stroke="#dce5ec" stroke-width="1"/>
<text x="508.5" y="252" fill="#233750" font-size="19" text-anchor="middle">55</text>
<line x1="583" y1="25" x2="583" y2="230" stroke="#dce5ec" stroke-width="1"/>
<text x="583" y="252" fill="#233750" font-size="19" text-anchor="middle">60</text>
<text x="12" y="55" fill="#233750" font-size="18" text-anchor="start">Scale 1</text>
