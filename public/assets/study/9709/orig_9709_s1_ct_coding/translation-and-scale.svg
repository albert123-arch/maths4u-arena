<svg xmlns="http://www.w3.org/2000/svg" width="620" height="282" viewBox="0 0 620 282" role="img" aria-labelledby="title desc">
<title id="title">Shifts and signed scaling on a common scale</title>
<desc id="desc">The translation yields values 44 to 48. A positive scale of four yields 41, 45, 49, 53 and 57. A negative scale of four yields 33, 37, 41, 45 and 49 in increasing order.</desc>
