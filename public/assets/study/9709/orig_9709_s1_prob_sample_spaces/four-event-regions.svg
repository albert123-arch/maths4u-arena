<svg xmlns="http://www.w3.org/2000/svg" width="620" height="225" viewBox="0 0 620 225" role="img" aria-labelledby="title desc">
<title id="title">Eight tickets in four event regions</title>
<desc id="desc">Tickets 1 and 2 are in A alone. Tickets 3 and 4 are in both circles. Tickets 5 and 6 are in B alone. Tickets 7 and 8 are outside both.</desc>
<rect width="620" height="225" rx="14" fill="#f6f9fc"/>
<g font-family="Arial,sans-serif">
<rect x="19" y="22" width="582" height="180" rx="0" fill="#dce5ec" fill-opacity=".30" stroke="#dce5ec" stroke-width="2"/>
<circle cx="240" cy="113" r="88" fill="#2459ac" fill-opacity=".13" stroke="#2459ac" stroke-width="3"/>
<circle cx="360" cy="113" r="88" fill="#087c78" fill-opacity=".13" stroke="#087c78" stroke-width="3"/>
<text x="42" y="52" fill="#233750" font-size="24" text-anchor="start">Ω</text>
<text x="196" y="62" fill="#2459ac" font-size="22" text-anchor="middle">A</text>
<text x="405" y="62" fill="#087c78" font-size="22" text-anchor="middle">B</text>
<text x="210" y="122" fill="#233750" font-size="19" text-anchor="middle">1, 2</text>
<text x="300" y="122" fill="#233750" font-size="19" text-anchor="middle">3, 4</text>
<text x="390" y="122" fill="#233750" font-size="19" text-anchor="middle">5, 6</text>
<text x="515" y="177" fill="#233750" font-size="19" text-anchor="middle">7, 8</text>
</g>
</svg>
