<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 504 294" width="504" height="294" role="img" aria-labelledby="title desc">
  <title id="title">A modulus and a signed line</title>
  <desc id="desc">The curves y = |2x − 1| and y = x + 4 meet at (−1, 3) and (5, 9). The dashed negative part of the line lies to the left of the guide at x = −4.</desc>
  <rect width="504" height="294" rx="12" fill="#f8fafc"/>
  <g fill="none" stroke="#cbd5e1">
    <path d="M44 84H458M44 138H458M44 192H458"/>
    <path d="M196 44V246M400 44V246"/>
  </g>
  <path d="M94 44V246" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 5"/>
  <g fill="none" stroke="#475569" stroke-width="1.5">
    <path d="M44 246H458m-7-5 7 5-7 5M230 267V44m-5 7 5-7 5 7"/>
    <path d="M94 242v8M196 242v8M400 242v8M226 192h8M226 138h8M226 84h8"/>
  </g>
  <g fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M60 48L247 246L434 48" stroke="#1d4ed8"/>
    <path d="M94 246L434 66" stroke="#047857"/>
    <path d="M60 264L94 246" stroke="#047857" stroke-dasharray="4 5"/>
    <path d="M25 24h28" stroke="#1d4ed8"/>
    <path d="M233 24h28" stroke="#047857"/>
  </g>
  <g fill="#334155" font-family="system-ui,sans-serif" font-size="16">
    <text x="61" y="29" fill="#1e3a8a">y = |2x − 1|</text>
    <text x="270" y="29" fill="#065f46">y = x + 4</text>
    <text x="468" y="251">x</text>
    <text x="242" y="50">y</text>
    <g text-anchor="middle">
      <text x="94" y="273">−4</text><text x="196" y="273">−1</text>
      <text x="230" y="273">0</text><text x="400" y="273">5</text>
    </g>
    <g text-anchor="end"><text x="220" y="187">3</text><text x="220" y="133">6</text><text x="220" y="79">9</text></g>
  </g>
  <g fill="#162c53" stroke="#f8fafc" stroke-width="1.5">
    <circle cx="196" cy="192" r="5"/>
    <circle cx="400" cy="84" r="5"/>
  </g>
  <g fill="#162c53" font-family="system-ui,sans-serif" font-size="16" font-weight="600">
    <text x="119" y="209">(−1, 3)</text>
    <text x="412" y="108">(5, 9)</text>
  </g>
</svg>
