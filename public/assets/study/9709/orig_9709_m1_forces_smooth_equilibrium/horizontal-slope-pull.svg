<style>
path { fill:none; stroke-linecap:round; stroke-width:3.2 }
.arrow { marker-end:url(#arrow) } .normal { stroke:#0c756a } .weight { stroke:#954111 } .applied { stroke:#2855b0 }
.friction { stroke:#7b3e9b } .surface { stroke:#69809d } .guide { stroke:#91a3b6; stroke-width:2; stroke-dasharray:5 5 }
.arc { stroke:#527093; stroke-width:2.4 } .body { fill:#dbe8f9; stroke:#839ab7; stroke-width:2 }
circle { fill:#16365f } text { font:700 24px system-ui,sans-serif; fill:#16365f }
</style>
