<svg xmlns="http://www.w3.org/2000/svg" width="480" height="270" viewBox="0 0 480 270" role="img" aria-labelledby="title description">
  <title id="title">A horizontal tension on a smooth slope</title>
  <desc id="description">The plane rises to the right at angle alpha. Tension T pulls to the right, W points vertically down, and reaction R points out of the plane at a right angle. Dashed lines resolve T into uphill T cos alpha and inward T sin alpha.</desc>
  <defs>
    <marker id="normal-head" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 8 4.5 0 9Z" fill="#0c756a"/></marker>
    <marker id="weight-head" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 8 4.5 0 9Z" fill="#954111"/></marker>
    <marker id="tension-head" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 8 4.5 0 9Z" fill="#2855b0"/></marker>
  </defs>
  <rect x="1" y="1" width="478" height="268" rx="16" fill="#f2f7ff" stroke="#c7d6eb"/>
  <path d="M83 264 415 15" fill="none" stroke="#69809d" stroke-width="3"/>
  <path d="M235 150 331 78 385 150" fill="none" stroke="#2855b0" stroke-width="2" stroke-dasharray="6 4"/>
  <path d="M331 78l-8 6 6 8 8-6M223 159l-9-12 12-9" fill="none" stroke="#52657e" stroke-width="1.8"/>
  <path d="M235 150 175 70" fill="none" stroke="#0c756a" stroke-width="3" marker-end="url(#normal-head)"/>
  <path d="M235 150V241" fill="none" stroke="#954111" stroke-width="3" marker-end="url(#weight-head)"/>
  <path d="M235 150H385" fill="none" stroke="#2855b0" stroke-width="3" marker-end="url(#tension-head)"/>
  <path d="M280 150a45 45 0 0 0-9-27" fill="none" stroke="#52657e" stroke-width="2"/>
  <circle cx="235" cy="150" r="5" fill="#16365f"/>
  <g fill="#16365f" font-family="system-ui,sans-serif" font-weight="700">
    <text x="148" y="69" font-size="25">R</text>
    <text x="246" y="241" font-size="25">W</text>
    <text x="397" y="158" font-size="25">T</text>
    <text x="283" y="137" font-size="23">α</text>
    <text x="226" y="97" font-size="21">T cos α</text>
    <text x="375" y="107" font-size="21">T sin α</text>
  </g>
</svg>
