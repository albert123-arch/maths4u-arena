<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 484 252" width="484" height="252" role="img" aria-labelledby="title desc"><title id="title">The sign of the gradient gives the direction of motion.</title><desc id="desc">A falling straight position–time segment joins (1, 4) to (4, −2). It passes through position zero between these endpoints.</desc><rect width="484" height="252" rx="14" fill="#f7fbff"/><g font-family="Inter, Arial, sans-serif" font-size="14" fill="#172b4d" stroke-linejoin="round"><path d="M53.00,135.20 L443.00,135.20" stroke="#52647c" stroke-width="1.4" fill="none" /><path d="M53.00,210.00 L53.00,23.00" stroke="#52647c" stroke-width="1.4" fill="none" /><text x="469" y="158.20" text-anchor="end">t (s)</text><text x="20" y="16">s (m)</text><path d="M131.00,60.40 L365.00,172.60" stroke="#1d4ed8" stroke-width="1.4" fill="none" style="stroke-width:3"/><circle cx="131.00" cy="60.40" r="3.3" fill="#1d4ed8"/><text x="139.00" y="52.40">(1, 4)</text><circle cx="365.00" cy="172.60" r="3.3" fill="#1d4ed8"/><text x="373.00" y="191.60">(4, −2)</text></g></svg>
