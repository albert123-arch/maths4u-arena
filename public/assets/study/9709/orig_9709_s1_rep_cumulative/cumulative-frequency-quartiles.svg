<svg xmlns="http://www.w3.org/2000/svg" width="620" height="280" viewBox="0 0 620 280" role="img" aria-labelledby="title desc">
<title id="title">Cumulative frequency plot</title>
<desc id="desc">Dashed guides connect time or measurement values to cumulative counts.</desc>
<rect width="620" height="280" rx="14" fill="#f6f9fc"/>
<g font-family="Arial,sans-serif">
<text x="80" y="30" fill="#233750" font-size="22" text-anchor="start">Cumulative count</text>
<text x="332.5" y="270" fill="#233750" font-size="21" text-anchor="middle">Time (s)</text>
<line x1="80" y1="223" x2="585" y2="223" stroke="#dce5ec" stroke-width="1"/>
<text x="69" y="230" fill="#233750" font-size="19" text-anchor="end">0</text>
<line x1="80" y1="181.25" x2="585" y2="181.25" stroke="#dce5ec" stroke-width="1"/>
<text x="69" y="188.25" fill="#233750" font-size="19" text-anchor="end">10</text>
<line x1="80" y1="139.5" x2="585" y2="139.5" stroke="#dce5ec" stroke-width="1"/>
<text x="69" y="146.5" fill="#233750" font-size="19" text-anchor="end">20</text>
<line x1="80" y1="97.75" x2="585" y2="97.75" stroke="#dce5ec" stroke-width="1"/>
<text x="69" y="104.75" fill="#233750" font-size="19" text-anchor="end">30</text>
<line x1="80" y1="56" x2="585" y2="56" stroke="#dce5ec" stroke-width="1"/>
<text x="69" y="63" fill="#233750" font-size="19" text-anchor="end">40</text>
<line x1="80" y1="56" x2="80" y2="223" stroke="#dce5ec" stroke-width="1"/>
<text x="80" y="247" fill="#233750" font-size="19" text-anchor="middle">0</text>
<line x1="181" y1="56" x2="181" y2="223" stroke="#dce5ec" stroke-width="1"/>
<text x="181" y="247" fill="#233750" font-size="19" text-anchor="middle">10</text>
<line x1="282" y1="56" x2="282" y2="223" stroke="#dce5ec" stroke-width="1"/>
<text x="282" y="247" fill="#233750" font-size="19" text-anchor="middle">20</text>
<line x1="383" y1="56" x2="383" y2="223" stroke="#dce5ec" stroke-width="1"/>
<text x="383" y="247" fill="#233750" font-size="19" text-anchor="middle">30</text>
<line x1="484" y1="56" x2="484" y2="223" stroke="#dce5ec" stroke-width="1"/>
<text x="484" y="247" fill="#233750" font-size="19" text-anchor="middle">40</text>
<line x1="585" y1="56" x2="585" y2="223" stroke="#dce5ec" stroke-width="1"/>
<text x="585" y="247" fill="#233750" font-size="19" text-anchor="middle">50</text>
<line x1="80" y1="56" x2="80" y2="223" stroke="#233750" stroke-width="2"/>
<line x1="80" y1="223" x2="585" y2="223" stroke="#233750" stroke-width="2"/>
<polyline points="80,223 181,206.3 231.5,206.3 332.5,156.2 484,72.7 585,56" fill="none" stroke="#2459ac" stroke-width="3" stroke-linejoin="round"/>
<circle cx="80" cy="223" r="3.8" fill="#2459ac"/>
<circle cx="181" cy="206.3" r="3.8" fill="#2459ac"/>
<circle cx="231.5" cy="206.3" r="3.8" fill="#2459ac"/>
<circle cx="332.5" cy="156.2" r="3.8" fill="#2459ac"/>
<circle cx="484" cy="72.7" r="3.8" fill="#2459ac"/>
<circle cx="585" cy="56" r="3.8" fill="#2459ac"/>
<line x1="80" y1="181.25" x2="282" y2="181.25" stroke="#b26b16" stroke-width="2" stroke-dasharray="8 6"/>
<line x1="282" y1="223" x2="282" y2="181.25" stroke="#b26b16" stroke-width="2" stroke-dasharray="8 6"/>
<circle cx="282" cy="181.25" r="5" fill="#b26b16"/>
<line x1="80" y1="139.5" x2="362.8" y2="139.5" stroke="#087c78" stroke-width="2" stroke-dasharray="8 6"/>
<line x1="362.8" y1="223" x2="362.8" y2="139.5" stroke="#087c78" stroke-width="2" stroke-dasharray="8 6"/>
<circle cx="362.8" cy="139.5" r="5" fill="#087c78"/>
<line x1="80" y1="97.75" x2="438.55" y2="97.75" stroke="#6e4cb0" stroke-width="2" stroke-dasharray="8 6"/>
<line x1="438.55" y1="223" x2="438.55" y2="97.75" stroke="#6e4cb0" stroke-width="2" stroke-dasharray="8 6"/>
<circle cx="438.55" cy="97.75" r="5" fill="#6e4cb0"/>
</g>
</svg>
