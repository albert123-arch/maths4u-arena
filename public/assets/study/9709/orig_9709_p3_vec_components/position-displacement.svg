<svg xmlns="http://www.w3.org/2000/svg" width="500" height="250" viewBox="0 0 500 250" role="img">
<title>Three arrows show the route from O to A, from O to B and from A to B.</title>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L7 4L0 8Z" style="fill:context-stroke;stroke:none"/></marker></defs>
<style>
  path { fill:none; stroke-linejoin:round; stroke-linecap:round; stroke-width:3.2 }
  .line { stroke:#526682 } .guide { stroke:#7488a0; stroke-width:2 } .arrow { stroke:#2355bd; marker-end:url(#arrow) }
  .teal { stroke:#0d716b } .amber { stroke:#9a4e13 } .dashed { stroke-dasharray:7 6 }
  text { font: 700 23px system-ui, sans-serif; fill:#16365f } circle { fill:#16365f }
</style>
<rect x="1" y="1" width="498" height="248" rx="15" fill="#f2f7ff" stroke="#c7d6eb"/><path d="M62 183L203 160" class="arrow"/><path d="M203 160L427 55" class="arrow"/><path d="M62 183L427 55" class="guide arrow"/><circle cx="62" cy="183" r="5"/><circle cx="203" cy="160" r="5"/><circle cx="427" cy="55" r="5"/><text x="48" y="216">O</text><text x="183" y="193">A</text><text x="439" y="59">B</text></svg>
