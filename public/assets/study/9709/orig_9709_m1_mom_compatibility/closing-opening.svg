<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Closing and opening gaps with both bodies travelling left</title><desc id="desc">In the top row the right particle has a longer leftward arrow and closes the gap. In the lower row the left particle has the longer leftward arrow and the gap opens.</desc><defs><marker id="ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#16283c"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2052ac"/></marker><marker id="green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#087a76"/></marker><marker id="gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#87500c"/></marker></defs><g font-family="system-ui,sans-serif"><rect width="640" height="360" rx="18" fill="#f8fbff"/>
<rect x="14" y="14" width="612" height="332" rx="14" fill="none" stroke="#ccdbea"/>
<text x="43" y="50" fill="#536983" font-size="22" text-anchor="start">Positive direction</text>
<line x1="251" y1="43" x2="359" y2="43" stroke="#16283c" stroke-width="4" stroke-linecap="round" marker-end="url(#ink)"/>
<text x="43" y="112" fill="#16283c" font-size="22" text-anchor="start">Approach</text>
<line x1="53" y1="162" x2="587" y2="162" stroke="#ccdbea" stroke-width="2" stroke-linecap="round"/>
<rect x="223.0" y="113" width="54" height="46" rx="11" fill="#2052ac" stroke="#2052ac" stroke-width="2"/>
<text x="250" y="144" fill="#fff" font-size="23" text-anchor="middle" font-weight="650">A</text>
<rect x="478.0" y="113" width="54" height="46" rx="11" fill="#087a76" stroke="#087a76" stroke-width="2"/>
<text x="505" y="144" fill="#fff" font-size="23" text-anchor="middle" font-weight="650">B</text>
<line x1="216" y1="136" x2="156" y2="136" stroke="#2052ac" stroke-width="4" stroke-linecap="round" marker-end="url(#blue)"/>
<line x1="472" y1="136" x2="360" y2="136" stroke="#087a76" stroke-width="4" stroke-linecap="round" marker-end="url(#green)"/>
<text x="43" y="244" fill="#16283c" font-size="22" text-anchor="start">Separation</text>
<line x1="53" y1="303" x2="587" y2="303" stroke="#ccdbea" stroke-width="2" stroke-linecap="round"/>
<rect x="245.0" y="254" width="54" height="46" rx="11" fill="#2052ac" stroke="#2052ac" stroke-width="2"/>
<text x="272" y="285" fill="#fff" font-size="23" text-anchor="middle" font-weight="650">A</text>
<rect x="475.0" y="254" width="54" height="46" rx="11" fill="#087a76" stroke="#087a76" stroke-width="2"/>
<text x="502" y="285" fill="#fff" font-size="23" text-anchor="middle" font-weight="650">B</text>
<line x1="240" y1="277" x2="133" y2="277" stroke="#2052ac" stroke-width="4" stroke-linecap="round" marker-end="url(#blue)"/>
<line x1="469" y1="277" x2="416" y2="277" stroke="#087a76" stroke-width="4" stroke-linecap="round" marker-end="url(#green)"/></g>
