<svg xmlns="http://www.w3.org/2000/svg" width="480" height="270" viewBox="0 0 480 270" role="img" aria-labelledby="title desc">
<title id="title">Forces on a trolley</title><desc id="desc">A trolley has thrust to the right, resistance to the left, weight down and the normal reaction upwards.</desc>
<rect width="480" height="270" rx="12" fill="#f8fafc"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="context-stroke"/></marker></defs>
<path d="M66 173H414" stroke="#94a3b8" stroke-width="2"/><circle cx="240" cy="137" r="8" fill="#1e293b"/>
<g font-family="system-ui,sans-serif" font-size="19" fill="#162b42"><path d="M240 137L374 137" stroke="#1d4ed8" stroke-width="3.5" marker-end="url(#arrow)" fill="none"/><text x="349" y="119" text-anchor="middle">Thrust</text><path d="M240 137L112 137" stroke="#9a3412" stroke-width="3.5" marker-end="url(#arrow)" fill="none"/><text x="130" y="117" text-anchor="middle">Resistance</text><path d="M240 137L240 56" stroke="#08765e" stroke-width="3.5" marker-end="url(#arrow)" fill="none"/><text x="286" y="70" text-anchor="middle">Reaction</text><path d="M240 137L240 227" stroke="#374151" stroke-width="3.5" marker-end="url(#arrow)" fill="none"/><text x="280" y="219" text-anchor="middle">Weight</text></g>
</svg>
