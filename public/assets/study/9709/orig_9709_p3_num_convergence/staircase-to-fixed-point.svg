<svg xmlns="http://www.w3.org/2000/svg" width="460" height="400" viewBox="0 0 460 400" role="img" aria-labelledby="title description">
  <title id="title">A staircase approaching the fixed point (2, 2)</title>
  <desc id="description">Starting at 0.8, the first two updates give 1.4 and 1.7. Each vertical arrow goes to the update graph and each horizontal arrow returns to y = x. The fixed point is (2, 2).</desc>
  <rect x="1" y="1" width="458" height="398" rx="15" fill="#f6faff" stroke="#cfdced"/>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 6 3.5 0 7Z" fill="#9a4c0e"/></marker>
  </defs>
  <g font-family="system-ui,sans-serif" font-size="18" fill="#213b57">
    <path d="M139.2 16.4V330M72 262.8H385.6" stroke="#d7e5f3"/>
    <text x="139.2" y="354" text-anchor="middle">1</text><text x="57" y="268.8" text-anchor="end">1</text>
    <path d="M251.2 16.4V330M72 150.8H385.6" stroke="#d7e5f3"/>
    <text x="251.2" y="354" text-anchor="middle">2</text><text x="57" y="156.8" text-anchor="end">2</text>
    <path d="M363.2 16.4V330M72 38.8H385.6" stroke="#d7e5f3"/>
    <text x="363.2" y="354" text-anchor="middle">3</text><text x="57" y="44.8" text-anchor="end">3</text>
    <path d="M72 16.4V330H385.6" fill="none" stroke="#64758a" stroke-width="1.6"/>
    <text x="64" y="29" text-anchor="end">y</text><text x="400" y="350">x</text>
    <path d="M72 330L385.6 16.4" fill="none" stroke="#56687c" stroke-width="2.5"/>
    <text x="387" y="35">y = x</text>
    <path d="M72 240.4L385.6 83.6" fill="none" stroke="#125589" stroke-width="3"/>
    <text x="320" y="163" fill="#125589">y = 1 + 0.5x</text>
    <g fill="none" stroke="#9a4c0e" stroke-width="2.05">
      <path d="M116.8 285.2L116.8 218" marker-end="url(#arrow)"/>
      <path d="M116.8 218L184 218" marker-end="url(#arrow)"/>
      <path d="M184 218L184 184.4" marker-end="url(#arrow)"/>
      <path d="M184 184.4L217.6 184.4" marker-end="url(#arrow)"/>
      <path d="M217.6 184.4L217.6 167.6" marker-end="url(#arrow)"/>
      <path d="M217.6 167.6L234.4 167.6" marker-end="url(#arrow)"/>
      <path d="M234.4 167.6L234.4 159.2" marker-end="url(#arrow)"/>
      <path d="M234.4 159.2L242.8 159.2" marker-end="url(#arrow)"/>
    </g>
    <circle cx="116.8" cy="285.2" r="3.6" fill="#824109"/><text x="129.8" y="306.2" text-anchor="start">x₀</text>
    <circle cx="184" cy="218" r="3.6" fill="#824109"/><text x="190" y="236" text-anchor="start">x₁</text>
    <circle cx="217.6" cy="184.4" r="3.6" fill="#824109"/><text x="223.6" y="202.4" text-anchor="start">x₂</text>
    <path d="M253 157L274 223" fill="none" stroke="#637b85" stroke-width="1.25"/>
    <circle cx="251.2" cy="150.8" r="4.6" fill="#08765e"/>
    <text x="279" y="232">(2, 2)</text>
    <text x="230" y="381" text-anchor="middle" font-weight="600">x₀ = 0.8 · x₁ = 1.4 · x₂ = 1.7</text>
  </g>
</svg>
