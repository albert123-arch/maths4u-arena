<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 155" role="img" aria-labelledby="title desc"><title id="title">Two rates on a percentage scale</title><desc id="desc">A number line runs from thirty to sixty percent. Marks at forty and fifty percent are connected with an arrow showing the direct gap.</desc><rect width="430" height="155" rx="14" fill="#eff6ff"/><line x1="43" y1="93" x2="387" y2="93" stroke="#2256a2" stroke-width="2.5" /><line x1="158" y1="81" x2="158" y2="102" stroke="#2256a2" stroke-width="2.5" /><line x1="272" y1="81" x2="272" y2="102" stroke="#2256a2" stroke-width="2.5" /><line x1="43" y1="86" x2="43" y2="100" stroke="#2256a2" stroke-width="2.5" /><line x1="387" y1="86" x2="387" y2="100" stroke="#2256a2" stroke-width="2.5" /><text x="43" y="125" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#162f50">30%</text><text x="158" y="125" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#162f50">40%</text><text x="272" y="125" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#162f50">50%</text><text x="387" y="125" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#162f50">60%</text><line x1="158" y1="67" x2="272" y2="67" stroke="#2256a2" stroke-width="2.5" /><line x1="158" y1="61" x2="158" y2="75" stroke="#2256a2" stroke-width="2.5" /><line x1="272" y1="61" x2="272" y2="75" stroke="#2256a2" stroke-width="2.5" /><text x="215" y="41" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#162f50">Gap on the scale</text></svg>
