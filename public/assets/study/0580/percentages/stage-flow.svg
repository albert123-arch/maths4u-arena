<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 155" role="img" aria-labelledby="title desc"><title id="title">The changing base in two successive stages</title><desc id="desc">Three boxes represent the starting amount, the updated amount after the first step, and the finish after the second step. The second arrow starts from the middle box.</desc><rect width="430" height="155" rx="14" fill="#eff6ff"/><rect x="17" y="66" width="89" height="46" rx="6" fill="#dbeafe" stroke="#6b90bc"/><rect x="169" y="66" width="92" height="46" rx="6" fill="#dbeafe" stroke="#6b90bc"/><rect x="324" y="66" width="89" height="46" rx="6" fill="#dbeafe" stroke="#6b90bc"/><text x="61" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#162f50">Start</text><text x="215" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#162f50">Updated</text><text x="369" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#162f50">Finish</text><line x1="107" y1="89" x2="160" y2="89" stroke="#2256a2" stroke-width="2.5" /><path d="M169 89l-12-7v14z" fill="#2256a2"/><line x1="262" y1="89" x2="315" y2="89" stroke="#2256a2" stroke-width="2.5" /><path d="M324 89l-12-7v14z" fill="#2256a2"/><text x="138" y="44" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#162f50">First change</text><text x="291" y="44" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#162f50">Second change</text></svg>
