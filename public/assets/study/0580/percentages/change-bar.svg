<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 155" role="img" aria-labelledby="title desc"><title id="title">Increase and decrease from the same starting value</title><desc id="desc">Three bars show one original length, one longer after an increase and one shorter after a decrease. All start from the same left edge.</desc><rect width="430" height="155" rx="14" fill="#eff6ff"/><text x="77" y="43" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#162f50">Original</text><text x="77" y="85" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#162f50">Increase</text><text x="77" y="127" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#162f50">Decrease</text><rect x="135" y="23" width="195" height="29" rx="4" fill="#dbeafe" stroke="#6b90bc"/><rect x="135" y="65" width="195" height="29" rx="4" fill="#dbeafe" stroke="#6b90bc"/><rect x="330" y="65" width="54" height="29" rx="4" fill="#a6c6f3" stroke="#6b90bc"/><rect x="135" y="107" width="141" height="29" rx="4" fill="#dbeafe" stroke="#6b90bc"/><rect x="276" y="107" width="54" height="29" rx="4" fill="none" stroke="#6b90bc" stroke-dasharray="4 4"/><line x1="330" y1="16" x2="330" y2="143" stroke="#7894b2" stroke-width="2.5" stroke-dasharray="4 4"/></svg>
