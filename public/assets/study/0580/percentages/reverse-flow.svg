<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 155" role="img" aria-labelledby="title desc"><title id="title">Reverse a forward change</title><desc id="desc">A top arrow from original to result represents multiplication. A lower arrow points back to original and represents division.</desc><rect width="430" height="155" rx="14" fill="#eff6ff"/><rect x="27" y="54" width="104" height="48" rx="6" fill="#dbeafe" stroke="#6b90bc"/><rect x="300" y="54" width="104" height="48" rx="6" fill="#dbeafe" stroke="#6b90bc"/><text x="79" y="84" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#162f50">Original</text><text x="352" y="84" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#162f50">Result</text><line x1="133" y1="67" x2="291" y2="67" stroke="#2256a2" stroke-width="2.5" /><path d="M300 67l-13-7v14z" fill="#2256a2"/><line x1="297" y1="89" x2="139" y2="89" stroke="#2256a2" stroke-width="2.5" /><path d="M130 89l13-7v14z" fill="#2256a2"/><text x="215" y="44" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#162f50">Multiply</text><text x="215" y="119" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#162f50">Divide</text></svg>
