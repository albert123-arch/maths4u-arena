<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 184" role="img" aria-labelledby="title desc"><title id="title">Two special right triangles</title><desc id="desc">A half-equilateral triangle has short leg 1, hypotenuse 2 and an angle of 30 degrees. A half-square has two unit legs and an angle of 45 degrees.</desc><style>text{font:600 15px system-ui,sans-serif;fill:#173757}.note{font-size:12px}.axis{fill:none;stroke:#335776;stroke-width:1.35}.edge{fill:none;stroke:#1766a6;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}.highlight{fill:none;stroke:#107463;stroke-width:2.6;stroke-linecap:round}.aim{fill:none;stroke:#946219;stroke-width:2.15}.thin{fill:none;stroke:#8ca4bb;stroke-width:1.35}.dash{fill:none;stroke:#597c99;stroke-width:1.55;stroke-dasharray:5 5}.shade{fill:#ddedfd;fill-opacity:.87;stroke:none}.plane{fill:#dceffa;stroke:none}.point{fill:#1766a6}</style><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="5.4" refY="3.5" orient="auto" viewBox="0 0 7 7"><path d="M0 0 L7 3.5 L0 7 Z" fill="#335776"/></marker></defs><rect width="460" height="184" rx="9" fill="#f8fbff"/><text x="123" y="36" text-anchor="middle" class="">Half equilateral</text><text x="329" y="26" text-anchor="middle" class="">Half square</text><path d="M63.00 147.00 L170.00 147.00 L170.00 85.00 Z" class="shade"/><path d="M63.00 147.00 L170.00 147.00 L170.00 85.00 Z" class="edge"/><path d="M159.00 147.00 L159.00 136.00 L170.00 136.00" class="axis"/><text x="115" y="99" text-anchor="middle" class="note">2</text><text x="187" y="120" text-anchor="middle" class="note">1</text><text x="104" y="141" text-anchor="middle" class="note">30°</text><text x="154" y="114" text-anchor="middle" class="note">60°</text><path d="M270.00 147.00 L374.00 147.00 L374.00 43.00 Z" class="shade"/><path d="M270.00 147.00 L374.00 147.00 L374.00 43.00 Z" class="edge"/><path d="M361.00 147.00 L361.00 134.00 L374.00 134.00" class="axis"/><text x="319" y="163" text-anchor="middle" class="note">1</text><text x="388" y="102" text-anchor="middle" class="note">1</text><text x="301" y="137" text-anchor="middle" class="note">45°</text></svg>
