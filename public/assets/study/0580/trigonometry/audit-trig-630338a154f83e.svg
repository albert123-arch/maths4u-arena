<svg xmlns="http://www.w3.org/2000/svg" width="420" height="230" viewBox="0 0 420 230" role="img" aria-labelledby="title"><title id="title">Sine-rule construction. AC has length 22 cm and the circle about C has radius 11 cm. There are 0 intersections on the ray.</title><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8z" fill="#516984"/></marker></defs><rect width="420" height="230" rx="14" fill="#f1f5fb"/><g font-family="system-ui,sans-serif" font-size="16" text-anchor="middle" paint-order="stroke" stroke="#f1f5fb" stroke-width="3" stroke-linejoin="round"><line x1="151.81" y1="174.00" x2="253.19" y2="174.00" stroke="#516984" stroke-width="2.2" marker-end="url(#arrow)"/><line x1="151.81" y1="174.00" x2="195.00" y2="99.19" stroke="#195795" stroke-width="2.2"/><text x="138.8" y="189.0" fill="#193455">A</text><circle cx="195.0" cy="99.2" r="43.2" fill="none" stroke="#087464" stroke-width="2"/><text x="204.0" y="87.2" fill="#193455">C</text><text x="210.0" y="26.0" fill="#087464">A = 60°  ·  AC = 22 cm  ·  radius 11 cm</text></g></svg>
