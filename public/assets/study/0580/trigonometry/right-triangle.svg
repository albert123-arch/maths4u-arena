<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 184" role="img" aria-labelledby="title desc"><title id="title">Identify the hypotenuse</title><desc id="desc">Triangle ABC is right-angled at B. The hypotenuse AC is opposite B.</desc><style>text{font:600 15px system-ui,sans-serif;fill:#173757}.note{font-size:12px}.axis{fill:none;stroke:#335776;stroke-width:1.35}.edge{fill:none;stroke:#1766a6;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}.highlight{fill:none;stroke:#107463;stroke-width:2.6;stroke-linecap:round}.aim{fill:none;stroke:#946219;stroke-width:2.15}.thin{fill:none;stroke:#8ca4bb;stroke-width:1.35}.dash{fill:none;stroke:#597c99;stroke-width:1.55;stroke-dasharray:5 5}.shade{fill:#ddedfd;fill-opacity:.87;stroke:none}.plane{fill:#dceffa;stroke:none}.point{fill:#1766a6}</style><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="5.4" refY="3.5" orient="auto" viewBox="0 0 7 7"><path d="M0 0 L7 3.5 L0 7 Z" fill="#335776"/></marker></defs><rect width="460" height="184" rx="9" fill="#f8fbff"/><path d="M72.00 145.00 L347.00 145.00 L347.00 36.00 Z" class="shade"/><path d="M72.00 145.00 L347.00 145.00 L347.00 36.00 Z" class="edge"/><path d="M335.00 145.00 L335.00 133.00 L347.00 133.00" class="axis"/><text x="63" y="162" text-anchor="middle" class="">A</text><text x="360" y="161" text-anchor="middle" class="">B</text><text x="363" y="38" text-anchor="middle" class="">C</text><text x="176" y="76" text-anchor="middle" class="">Hypotenuse</text><text x="210" y="164" text-anchor="middle" class="note">Leg</text><text x="383" y="94" text-anchor="middle" class="note">Leg</text></svg>
