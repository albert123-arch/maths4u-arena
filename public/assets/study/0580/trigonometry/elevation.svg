<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 184" role="img" aria-labelledby="title desc"><title id="title">Angles measured from a horizontal</title><desc id="desc">A is the lower observer. B is the upper point. The angle at A above the horizontal equals the angle at B below its horizontal.</desc><style>text{font:600 15px system-ui,sans-serif;fill:#173757}.note{font-size:12px}.axis{fill:none;stroke:#335776;stroke-width:1.35}.edge{fill:none;stroke:#1766a6;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}.highlight{fill:none;stroke:#107463;stroke-width:2.6;stroke-linecap:round}.aim{fill:none;stroke:#946219;stroke-width:2.15}.thin{fill:none;stroke:#8ca4bb;stroke-width:1.35}.dash{fill:none;stroke:#597c99;stroke-width:1.55;stroke-dasharray:5 5}.shade{fill:#ddedfd;fill-opacity:.87;stroke:none}.plane{fill:#dceffa;stroke:none}.point{fill:#1766a6}</style><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="5.4" refY="3.5" orient="auto" viewBox="0 0 7 7"><path d="M0 0 L7 3.5 L0 7 Z" fill="#335776"/></marker></defs><rect width="460" height="184" rx="9" fill="#f8fbff"/><path d="M54.00 143.00 L369.00 143.00" class="dash"/><path d="M91.00 44.00 L390.00 44.00" class="dash"/><path d="M352.00 44.00 L352.00 143.00" class="thin"/><path d="M65.00 143.00 L352.00 44.00" class="edge"/><path d="M111.32 127.02A49 49 0 0 1 114.00 143.00" class="aim"/><path d="M306.62 59.65A48 48 0 0 1 304.00 44.00" class="aim"/><text x="222" y="38" text-anchor="middle" class="note">Horizontal</text><text x="200" y="164" text-anchor="middle" class="note">Horizontal</text><text x="63" y="159" text-anchor="middle" class="">A</text><text x="368" y="34" text-anchor="middle" class="">B</text><text x="119" y="130" text-anchor="middle" class="">θ</text><text x="299" y="61" text-anchor="middle" class="">θ</text></svg>
