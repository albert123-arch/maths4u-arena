<svg xmlns="http://www.w3.org/2000/svg" width="420" height="230" viewBox="0 0 420 230" role="img" aria-labelledby="title"><title id="title">Sine-rule construction. AC has length 13 cm and the circle about C has radius 10 cm. There are 2 intersections on the ray.</title><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8z" fill="#516984"/></marker></defs><rect width="420" height="230" rx="14" fill="#f1f5fb"/><g font-family="system-ui,sans-serif" font-size="16" text-anchor="middle" paint-order="stroke" stroke="#f1f5fb" stroke-width="3" stroke-linejoin="round"><line x1="129.70" y1="142.49" x2="275.30" y2="142.49" stroke="#516984" stroke-width="2.2" marker-end="url(#arrow)"/><line x1="129.70" y1="142.49" x2="201.30" y2="115.00" stroke="#195795" stroke-width="2.2"/><text x="116.7" y="157.5" fill="#193455">A</text><circle cx="201.3" cy="115.0" r="59.0" fill="none" stroke="#087464" stroke-width="2"/><text x="210.3" y="103.0" fill="#193455">C</text><text x="210.0" y="26.0" fill="#087464">A = 21°  ·  AC = 13 cm  ·  radius 10 cm</text><line x1="201.30" y1="115.00" x2="149.10" y2="142.49" stroke="#195795" stroke-width="2.2"/><text x="141.1" y="162.5" fill="#193455">B1</text><line x1="201.30" y1="115.00" x2="253.51" y2="142.49" stroke="#195795" stroke-width="2.2"/><text x="263.5" y="162.5" fill="#193455">B2</text></g></svg>
