<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 184" role="img" aria-labelledby="title desc"><title id="title">Two triangles sharing an angle</title><desc id="desc">The same radius from C meets the horizontal ray in two positions, B1 and B2. Both triangles share angle A and side AC.</desc><style>text{font:600 15px system-ui,sans-serif;fill:#173757}.note{font-size:12px}.axis{fill:none;stroke:#335776;stroke-width:1.35}.edge{fill:none;stroke:#1766a6;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}.highlight{fill:none;stroke:#107463;stroke-width:2.6;stroke-linecap:round}.aim{fill:none;stroke:#946219;stroke-width:2.15}.thin{fill:none;stroke:#8ca4bb;stroke-width:1.35}.dash{fill:none;stroke:#597c99;stroke-width:1.55;stroke-dasharray:5 5}.shade{fill:#ddedfd;fill-opacity:.87;stroke:none}.plane{fill:#dceffa;stroke:none}.point{fill:#1766a6}</style><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="5.4" refY="3.5" orient="auto" viewBox="0 0 7 7"><path d="M0 0 L7 3.5 L0 7 Z" fill="#335776"/></marker></defs><rect width="460" height="184" rx="9" fill="#f8fbff"/><path d="M72.00 145.00 L406.00 145.00" class="axis" marker-end="url(#arrow)"/><path d="M72.00 145.00 L264.00 54.00" class="edge"/><path d="M264.00 54.00 L200.00 145.00" class="highlight"/><path d="M264.00 54.00 L328.00 145.00" class="highlight"/><path d="M328.00 145.00A111.25196627475849 111.25196627475849 0 0 1 200.00 145.00" class="dash"/><path d="M107.24 128.30A39 39 0 0 1 111.00 145.00" class="aim"/><circle cx="200" cy="145" r="3.8" class="point"/><circle cx="328" cy="145" r="3.8" class="point"/><text x="70" y="167" text-anchor="middle" class="">A</text><text x="200" y="165" text-anchor="middle" class="">B₁</text><text x="328" y="165" text-anchor="middle" class="">B₂</text><text x="264" y="40" text-anchor="middle" class="">C</text></svg>
