<svg xmlns="http://www.w3.org/2000/svg" width="400" height="250" viewBox="0 0 400 250" role="img" aria-label="A probability scale from zero, impossible, to one, certain, via one half, an even chance."><title>A probability scale from zero, impossible, to one, certain, via one half, an even chance.</title><g font-family="Inter, Arial, sans-serif"><line x1="40" y1="120" x2="360" y2="120" stroke="#163953" stroke-width="3"/><line x1="40" y1="107" x2="40" y2="133" stroke="#163953" stroke-width="2"/><line x1="72" y1="112" x2="72" y2="128" stroke="#163953" stroke-width="2"/><line x1="104" y1="112" x2="104" y2="128" stroke="#163953" stroke-width="2"/><line x1="136" y1="112" x2="136" y2="128" stroke="#163953" stroke-width="2"/><line x1="168" y1="112" x2="168" y2="128" stroke="#163953" stroke-width="2"/><line x1="200" y1="107" x2="200" y2="133" stroke="#163953" stroke-width="2"/><line x1="232" y1="112" x2="232" y2="128" stroke="#163953" stroke-width="2"/><line x1="264" y1="112" x2="264" y2="128" stroke="#163953" stroke-width="2"/><line x1="296" y1="112" x2="296" y2="128" stroke="#163953" stroke-width="2"/><line x1="328" y1="112" x2="328" y2="128" stroke="#163953" stroke-width="2"/><line x1="360" y1="107" x2="360" y2="133" stroke="#163953" stroke-width="2"/><text x="40" y="154" text-anchor="middle" font-size="19" fill="#035e64">0</text><text x="40" y="182" text-anchor="middle" font-size="14" fill="#163953">Impossible</text><text x="200" y="154" text-anchor="middle" font-size="19" fill="#035e64">0.5</text><text x="200" y="182" text-anchor="middle" font-size="14" fill="#163953">Even chance</text><text x="360" y="154" text-anchor="middle" font-size="19" fill="#035e64">1</text><text x="360" y="182" text-anchor="middle" font-size="14" fill="#163953">Certain</text></g></svg>