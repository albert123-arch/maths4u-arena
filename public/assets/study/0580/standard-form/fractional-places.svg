<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 154" role="img" aria-labelledby="title desc"><title id="title">Read the first non-zero decimal digit</title><desc id="desc">Decimal columns show zero units, zero tenths, zero hundredths and two thousandths.</desc><rect width="430" height="154" rx="14" fill="#eff6ff"/><rect x="10" y="68" width="94" height="50" rx="6" fill="#e0ebf9" stroke="#7296c5"/><rect x="114" y="68" width="94" height="50" rx="6" fill="#e0ebf9" stroke="#7296c5"/><rect x="217" y="68" width="94" height="50" rx="6" fill="#e0ebf9" stroke="#7296c5"/><rect x="321" y="68" width="94" height="50" rx="6" fill="#d4e5ff" stroke="#7296c5"/><text x="57" y="106" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#18324f" >Units</text><text x="161" y="106" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#18324f" >Tenths</text><text x="264" y="106" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#18324f" >Hundredths</text><text x="368" y="106" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#18324f" >Thousandths</text><text x="57" y="88" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#18324f" >0</text><text x="161" y="88" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#18324f" >0</text><text x="264" y="88" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#18324f" >0</text><text x="368" y="88" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#18324f" >2</text><circle cx="107" cy="84" r="2.5" fill="#18324f"/><path d="M368 34v21" fill="none" stroke="#2258a6" stroke-width="3" stroke-linecap="round"/><path d="M368 64l-7-12h14z" fill="#2258a6"/><text x="230" y="40" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#18324f" >First non-zero digit</text></svg>
