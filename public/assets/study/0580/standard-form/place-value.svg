<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 154" role="img" aria-labelledby="title desc"><title id="title">Move a leading digit three places</title><desc id="desc">The leading digit starts in the units column and reaches the thousands column by three leftward steps.</desc><rect width="430" height="154" rx="14" fill="#eff6ff"/><rect x="15" y="86" width="86" height="32" rx="6" fill="#dbeafe" stroke="#7296c5"/><rect x="119" y="86" width="86" height="32" rx="6" fill="#dbeafe" stroke="#7296c5"/><rect x="222" y="86" width="86" height="32" rx="6" fill="#dbeafe" stroke="#7296c5"/><rect x="326" y="86" width="86" height="32" rx="6" fill="#dbeafe" stroke="#7296c5"/><text x="58" y="109" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#18324f" >Thousands</text><text x="162" y="109" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#18324f" >Hundreds</text><text x="265" y="109" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#18324f" >Tens</text><text x="369" y="109" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#18324f" >Units</text><path d="M367 63 H64" fill="none" stroke="#2258a6" stroke-width="3" stroke-linecap="round"/><path d="M55 63l13 -8v16z" fill="#2258a6"/><path d="M162 59v8" stroke="#2258a6" stroke-width="2"/><path d="M265 59v8" stroke="#2258a6" stroke-width="2"/><circle cx="369" cy="63" r="15" fill="#d7e8ff" stroke="#2258a6" stroke-width="1.5"/><text x="369" y="69" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#18324f" >4</text><text x="215" y="38" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#18324f" >Three place-value steps</text></svg>
