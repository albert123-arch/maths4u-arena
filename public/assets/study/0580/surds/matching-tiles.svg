<svg xmlns="http://www.w3.org/2000/svg" width="456" height="166" viewBox="0 0 456 166" role="img" aria-labelledby="title desc">
  <title id="title">Count equal pieces together</title>
  <desc id="desc">Two matching teal square tiles are grouped as one type. A larger orange square is a different type.</desc>
  <rect x="1" y="1" width="454" height="164" rx="14" fill="#f1f6ff" stroke="#b8c9e1"/>
  <rect x="43" y="33" width="69" height="69" rx="5" fill="#cceeea" stroke="#007d71" stroke-width="2.5"/>
  <rect x="131" y="33" width="69" height="69" rx="5" fill="#cceeea" stroke="#007d71" stroke-width="2.5"/>
  <rect x="293" y="20" width="96" height="96" rx="5" fill="#fff0d3" stroke="#a3540b" stroke-width="2.5"/>
  <path d="M44 112v8h155v-8" fill="none" stroke="#007d71" stroke-width="2"/>
  <g font-family="Arial,sans-serif" text-anchor="middle" font-size="20" font-weight="700">
    <text x="121" y="147" fill="#085e56">Same size</text>
    <text x="341" y="147" fill="#7c430a">Different size</text>
  </g>
</svg>
