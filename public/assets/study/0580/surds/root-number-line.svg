<svg xmlns="http://www.w3.org/2000/svg" width="456" height="166" viewBox="0 0 456 166" role="img" aria-labelledby="title desc">
  <title id="title">Locating the square root of 14</title>
  <desc id="desc">The approximate point is about three quarters of the way from 3 to 4.</desc>
  <rect x="1" y="1" width="454" height="164" rx="14" fill="#f1f6ff" stroke="#b8c9e1"/>
  <path d="M48 106H409m-9-7 9 7-9 7" fill="none" stroke="#273e63" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M66 96V116m320-20v20" stroke="#273e63" stroke-width="2"/>
  <path d="M303 64v41" fill="none" stroke="#007d71" stroke-width="2"/>
  <circle cx="303" cy="106" r="5.5" fill="#007d71"/>
  <text x="303" y="48" text-anchor="middle" fill="#085e56" font-family="Arial, sans-serif" font-size="20" font-weight="700">Approximate location</text>
  <g fill="#273e63" font-family="Arial,sans-serif" font-size="21" text-anchor="middle">
    <text x="66" y="139">3</text>
    <text x="386" y="139">4</text>
  </g>
</svg>
