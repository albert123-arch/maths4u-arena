<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 107" role="img" aria-label="The calculation proceeds from taking a root to raising a power, then taking a reciprocal only if the index is negative."><rect width="380" height="107" rx="12" fill="#f8fafc"/><g fill="#173554" font-family="Arial, sans-serif"><rect x="17" y="26" width="100" height="57" rx="7" fill="#d8eaff" stroke="#496482" stroke-width="1.4"/><rect x="139" y="26" width="100" height="57" rx="7" fill="#ccece5" stroke="#496482" stroke-width="1.4"/><rect x="261" y="26" width="102" height="57" rx="7" fill="#fff0cd" stroke="#496482" stroke-width="1.4"/><text x="67" y="55" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600">Take the root</text><text x="189" y="55" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600">Raise the power</text><text x="312" y="47" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600">Reciprocal</text><text x="312" y="64" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600">if negative</text><path d="M119 55H137m-6 -4 6 4 -6 4" fill="none" stroke="#395676" stroke-width="1.7"/><path d="M241 55H259m-6 -4 6 4 -6 4" fill="none" stroke="#395676" stroke-width="1.7"/></g></svg>
