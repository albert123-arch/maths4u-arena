<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 168" role="img" aria-labelledby="title desc"><title id="title">Inputs and outputs for a restricted quadratic</title><desc id="desc">The vertex is (1, 2). Include the inputs from 0 to 3 and the outputs from 2 to 6.</desc><style>text{font:600 14px system-ui,sans-serif;fill:#193658}.note{font-size:12px}.axis{stroke:#294964;stroke-width:1.5}.edge{stroke:#1163a1;stroke-width:2.2;fill:none}.back{stroke:#11635a;stroke-width:2.2;fill:none}.dash{stroke:#617c94;stroke-width:1.4;stroke-dasharray:4 4;fill:none}.card{fill:#ebf6ff;stroke:#326d9d;stroke-width:1.4}.ok{fill:#e7f5ef;stroke:#277969;stroke-width:1.4}.warn{fill:#fff5df;stroke:#a46723;stroke-width:1.4}</style><defs><marker id="arrow" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1163a1"/></marker><marker id="undo" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#11635a"/></marker></defs><rect width="440" height="168" rx="11" fill="#f8fbff"/><path d="M91 146L319 146" class="axis" marker-end="url(#arrow)"/><path d="M125 150L125 16" class="axis" marker-end="url(#arrow)"/><path d="M125 110L178 110" class="dash"/><path d="M125 38L284 38" class="dash"/><path d="M284 38L284 146" class="dash"/><path d="M125 92 Q204.5 146 284 38" class="edge"/><circle cx="125" cy="92" r="4" fill="#1163a1"/><circle cx="178" cy="110" r="4" fill="#1163a1"/><circle cx="284" cy="38" r="4" fill="#1163a1"/><text x="334" y="152" text-anchor="middle" class="">x</text><text x="116" y="21" text-anchor="middle" class="">y</text><text x="125" y="163" text-anchor="middle" class="note">0</text><text x="284" y="163" text-anchor="middle" class="note">3</text><text x="114" y="113" text-anchor="middle" class="note">2</text><text x="114" y="43" text-anchor="middle" class="note">6</text><text x="198" y="131" text-anchor="middle" class="note">(1, 2)</text><text x="310" y="36" text-anchor="middle" class="note">(3, 6)</text></svg>
