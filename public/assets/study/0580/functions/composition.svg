<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 168" role="img" aria-labelledby="title desc"><title id="title">Apply one function then the other</title><desc id="desc">Start with 2. Function f produces 7. Function g then produces 9.</desc><style>text{font:600 14px system-ui,sans-serif;fill:#193658}.note{font-size:12px}.axis{stroke:#294964;stroke-width:1.5}.edge{stroke:#1163a1;stroke-width:2.2;fill:none}.back{stroke:#11635a;stroke-width:2.2;fill:none}.dash{stroke:#617c94;stroke-width:1.4;stroke-dasharray:4 4;fill:none}.card{fill:#ebf6ff;stroke:#326d9d;stroke-width:1.4}.ok{fill:#e7f5ef;stroke:#277969;stroke-width:1.4}.warn{fill:#fff5df;stroke:#a46723;stroke-width:1.4}</style><defs><marker id="arrow" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1163a1"/></marker><marker id="undo" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#11635a"/></marker></defs><rect width="440" height="168" rx="11" fill="#f8fbff"/><rect x="78" y="57" width="56" height="54" rx="7" class="card"/><rect x="306" y="57" width="56" height="54" rx="7" class="ok"/><text x="27" y="89" text-anchor="middle" class="">2</text><text x="106" y="89" text-anchor="middle" class="">f</text><text x="220" y="89" text-anchor="middle" class="">7</text><text x="334" y="89" text-anchor="middle" class="">g</text><text x="413" y="89" text-anchor="middle" class="">9</text><path d="M40 84L77 84" class="edge" marker-end="url(#arrow)"/><path d="M134 84L201 84" class="edge" marker-end="url(#arrow)"/><path d="M239 84L305 84" class="edge" marker-end="url(#arrow)"/><path d="M362 84L400 84" class="edge" marker-end="url(#arrow)"/><text x="27" y="43" text-anchor="middle" class="note">Input</text><text x="220" y="43" text-anchor="middle" class="note">First output</text><text x="413" y="43" text-anchor="middle" class="note">Result</text></svg>
