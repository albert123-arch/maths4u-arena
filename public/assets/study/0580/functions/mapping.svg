<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 168" role="img" aria-labelledby="title desc"><title id="title">Three input values and two outputs</title><desc id="desc">Inputs 1 and 3 both reach 5. Input 4 reaches 8.</desc><style>text{font:600 14px system-ui,sans-serif;fill:#193658}.note{font-size:12px}.axis{stroke:#294964;stroke-width:1.5}.edge{stroke:#1163a1;stroke-width:2.2;fill:none}.back{stroke:#11635a;stroke-width:2.2;fill:none}.dash{stroke:#617c94;stroke-width:1.4;stroke-dasharray:4 4;fill:none}.card{fill:#ebf6ff;stroke:#326d9d;stroke-width:1.4}.ok{fill:#e7f5ef;stroke:#277969;stroke-width:1.4}.warn{fill:#fff5df;stroke:#a46723;stroke-width:1.4}</style><defs><marker id="arrow" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1163a1"/></marker><marker id="undo" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#11635a"/></marker></defs><rect width="440" height="168" rx="11" fill="#f8fbff"/><text x="100" y="22" text-anchor="middle" class="">Inputs</text><text x="340" y="22" text-anchor="middle" class="">Outputs</text><ellipse cx="100" cy="94" rx="62" ry="57" class="card"/><ellipse cx="340" cy="94" rx="62" ry="57" class="card"/><text x="100" y="62" text-anchor="middle" class="">1</text><text x="100" y="99" text-anchor="middle" class="">3</text><text x="100" y="135" text-anchor="middle" class="">4</text><text x="340" y="74" text-anchor="middle" class="">5</text><text x="340" y="121" text-anchor="middle" class="">8</text><path d="M118 57L320 69" class="edge" marker-end="url(#arrow)"/><path d="M118 94L320 70" class="edge" marker-end="url(#arrow)"/><path d="M118 130L320 116" class="edge" marker-end="url(#arrow)"/></svg>
