<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 168" role="img" aria-labelledby="title desc"><title id="title">Check the input to the next rule</title><desc id="desc">The input flows through the first function. Check the intermediate value before the second function accepts it.</desc><style>text{font:600 14px system-ui,sans-serif;fill:#193658}.note{font-size:12px}.axis{stroke:#294964;stroke-width:1.5}.edge{stroke:#1163a1;stroke-width:2.2;fill:none}.back{stroke:#11635a;stroke-width:2.2;fill:none}.dash{stroke:#617c94;stroke-width:1.4;stroke-dasharray:4 4;fill:none}.card{fill:#ebf6ff;stroke:#326d9d;stroke-width:1.4}.ok{fill:#e7f5ef;stroke:#277969;stroke-width:1.4}.warn{fill:#fff5df;stroke:#a46723;stroke-width:1.4}</style><defs><marker id="arrow" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1163a1"/></marker><marker id="undo" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#11635a"/></marker></defs><rect width="440" height="168" rx="11" fill="#f8fbff"/><rect x="27" y="59" width="96" height="50" rx="7" class="card"/><rect x="157" y="59" width="126" height="50" rx="7" class="warn"/><rect x="317" y="59" width="96" height="50" rx="7" class="ok"/><text x="75" y="90" text-anchor="middle" class="">First rule</text><text x="220" y="89" text-anchor="middle" class="">Check output</text><text x="365" y="90" text-anchor="middle" class="">Second rule</text><path d="M123 84L156 84" class="edge" marker-end="url(#arrow)"/><path d="M283 84L316 84" class="edge" marker-end="url(#arrow)"/><path d="M220 111L220 135" class="back" marker-end="url(#undo)"/><text x="220" y="153" text-anchor="middle" class="note">Stop if forbidden</text></svg>
