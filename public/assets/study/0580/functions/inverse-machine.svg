<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 168" role="img" aria-labelledby="title desc"><title id="title">A function and its inverse</title><desc id="desc">The forward rule sends 2 to 11. The inverse sends 11 back to 2.</desc><style>text{font:600 14px system-ui,sans-serif;fill:#193658}.note{font-size:12px}.axis{stroke:#294964;stroke-width:1.5}.edge{stroke:#1163a1;stroke-width:2.2;fill:none}.back{stroke:#11635a;stroke-width:2.2;fill:none}.dash{stroke:#617c94;stroke-width:1.4;stroke-dasharray:4 4;fill:none}.card{fill:#ebf6ff;stroke:#326d9d;stroke-width:1.4}.ok{fill:#e7f5ef;stroke:#277969;stroke-width:1.4}.warn{fill:#fff5df;stroke:#a46723;stroke-width:1.4}</style><defs><marker id="arrow" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1163a1"/></marker><marker id="undo" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#11635a"/></marker></defs><rect width="440" height="168" rx="11" fill="#f8fbff"/><rect x="45" y="55" width="82" height="60" rx="7" class="card"/><rect x="313" y="55" width="82" height="60" rx="7" class="ok"/><text x="86" y="90" text-anchor="middle" class="">2</text><text x="354" y="90" text-anchor="middle" class="">11</text><path d="M127 69L312 69" class="edge" marker-end="url(#arrow)"/><path d="M313 103L128 103" class="back" marker-end="url(#undo)"/><text x="220" y="53" text-anchor="middle" class="">Forward rule</text><text x="220" y="130" text-anchor="middle" class="">Inverse rule</text></svg>
