<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 168" role="img" aria-labelledby="title desc"><title id="title">Select the right branch of a parabola</title><desc id="desc">The vertex is at input 2. The horizontal line meets the dashed left branch and the allowed solid right branch.</desc><style>text{font:600 14px system-ui,sans-serif;fill:#193658}.note{font-size:12px}.axis{stroke:#294964;stroke-width:1.5}.edge{stroke:#1163a1;stroke-width:2.2;fill:none}.back{stroke:#11635a;stroke-width:2.2;fill:none}.dash{stroke:#617c94;stroke-width:1.4;stroke-dasharray:4 4;fill:none}.card{fill:#ebf6ff;stroke:#326d9d;stroke-width:1.4}.ok{fill:#e7f5ef;stroke:#277969;stroke-width:1.4}.warn{fill:#fff5df;stroke:#a46723;stroke-width:1.4}</style><defs><marker id="arrow" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1163a1"/></marker><marker id="undo" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#11635a"/></marker></defs><rect width="440" height="168" rx="11" fill="#f8fbff"/><path d="M101 145L348 145" class="axis" marker-end="url(#arrow)"/><path d="M124 154L124 15" class="axis" marker-end="url(#arrow)"/><path d="M124 62 Q174 130 224 130" class="dash"/><path d="M224 130 Q274 130 324 62" class="edge"/><path d="M112 96L344 96" class="dash"/><circle cx="153.29" cy="96" r="4" fill="#617c94"/><circle cx="294.71" cy="96" r="4" fill="#1163a1"/><circle cx="224" cy="130" r="4" fill="#1163a1"/><text x="364" y="150" text-anchor="middle" class="">x</text><text x="115" y="22" text-anchor="middle" class="">y</text><text x="178" y="44" text-anchor="middle" class="note">Excluded</text><text x="276" y="44" text-anchor="middle" class="note">Allowed</text><text x="224" y="161" text-anchor="middle" class="note">2</text><path d="M224 133L224 145" class="dash"/></svg>
