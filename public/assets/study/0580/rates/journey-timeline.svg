<svg xmlns="http://www.w3.org/2000/svg" width="456" height="166" viewBox="0 0 456 166" role="img" aria-labelledby="title desc">
  <title id="title">A journey with a fifteen-minute stop</title>
  <desc id="desc">A ninety-minute timeline has a thirty-minute leg of eighteen kilometres, a fifteen-minute stop, and a forty-five-minute leg of twenty-seven kilometres.</desc>
  <rect x="1" y="1" width="454" height="164" rx="14" fill="#f4f8ff" stroke="#c9daed"/>
<rect x="32" y="51" width="128" height="44" rx="6" fill="#dceafd" stroke="#285a9e" stroke-width="2"/>
  <rect x="160" y="51" width="64" height="44" rx="6" fill="#f4e6cd" stroke="#9f611e" stroke-width="2"/>
  <rect x="224" y="51" width="192" height="44" rx="6" fill="#d8eee7" stroke="#207f71" stroke-width="2"/>
  <path d="M32 107H416M32 101V113M160 101V113M224 101V113M416 101V113" fill="none" stroke="#304a6a" stroke-width="2"/>
  <g fill="#193555" font-family="system-ui,sans-serif" font-size="17" text-anchor="middle">
    <text x="32" y="137">0</text><text x="160" y="137">30</text><text x="224" y="137">45</text><text x="416" y="137">90</text>
    <text x="96" y="79" font-weight="700">18 km</text><text x="192" y="79" font-weight="650" fill="#783f14">Stop</text>
    <text x="320" y="79" font-weight="700" fill="#06665c">27 km</text><text x="228" y="157" font-size="15">Minutes</text>
  </g>
</svg>
