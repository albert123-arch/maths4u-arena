<svg xmlns="http://www.w3.org/2000/svg" width="456" height="166" viewBox="0 0 456 166" role="img" aria-labelledby="title desc">
  <title id="title">Forty-five minutes is three quarters of an hour</title>
  <desc id="desc">A sixty-minute strip is split into four equal fifteen-minute blocks. The first three are shaded.</desc>
  <rect x="1" y="1" width="454" height="164" rx="14" fill="#f4f8ff" stroke="#c9daed"/>
<path d="M44 95H412" fill="none" stroke="#304a6a" stroke-width="2"/>
  <rect x="44" y="44" width="368" height="42" rx="6" fill="#edf5ff" stroke="#285a9e" stroke-width="2"/>
  <path d="M50 45H320V85H50Q45 85 45 80V50Q45 45 50 45Z" fill="#b8e4d8"/>
  <path d="M136 44V86M228 44V86M320 44V86" fill="none" stroke="#285a9e" stroke-width="2"/>
  <path d="M44 89V101M136 89V101M228 89V101M320 89V101M412 89V101" fill="none" stroke="#304a6a" stroke-width="2"/>
  <g fill="#193555" font-family="system-ui,sans-serif" font-size="18" text-anchor="middle">
    <text x="44" y="127">0</text><text x="136" y="127">15</text><text x="228" y="127">30</text>
    <text x="320" y="127" fill="#06665c" font-weight="700">45</text><text x="412" y="127">60</text>
    <text x="228" y="151" font-size="16">Minutes</text>
  </g>
</svg>
