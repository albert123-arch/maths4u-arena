<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 150" role="img" aria-labelledby="title"><title id="title">Four levels in order: bracket groups, powers and roots, multiplication or division, then addition or subtraction.</title><rect width="400" height="150" rx="12" fill="#fff"/><rect x="63" y="9" width="274" height="27" rx="5" fill="#e4edf9"/><text x="200" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#153356">Bracket groups</text><rect x="63" y="43" width="274" height="27" rx="5" fill="#e4edf9"/><text x="200" y="62" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#153356">Powers and roots</text><rect x="63" y="77" width="274" height="27" rx="5" fill="#e4edf9"/><text x="200" y="96" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#153356">Multiply or divide</text><rect x="63" y="111" width="274" height="27" rx="5" fill="#e4edf9"/><text x="200" y="130" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#153356">Add or subtract</text></svg>
