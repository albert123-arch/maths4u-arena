<svg xmlns="http://www.w3.org/2000/svg" width="456" height="166" viewBox="0 0 456 166" role="img" aria-labelledby="title desc">
  <title id="title">Rounding to a tenth</title>
  <desc id="desc">7.28 is after the halfway point 7.25 and is closer to 7.3 than to 7.2.</desc>
