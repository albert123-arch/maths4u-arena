  <path d="M35 107H422M412 99L422 107L412 115" fill="none" stroke="#304968" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M48 98V115M228 99V115M408 98V115" fill="none" stroke="#304968" stroke-width="2"/>
  <path d="M228 61V98" fill="none" stroke="#76869c" stroke-width="1.8" stroke-dasharray="4 4"/>
  <path d="M336 57V102" fill="none" stroke="#285a9e" stroke-width="1.8" stroke-dasharray="4 4"/>
  <circle cx="336" cy="107" r="5.8" fill="#285a9e"/>
  <circle cx="408" cy="107" r="5.6" fill="#06776a"/>
  <g font-family="system-ui,sans-serif" font-size="18" fill="#193555" text-anchor="middle">
    <text x="48" y="140">7.2</text>
    <text x="228" y="140">7.25</text>
