<svg xmlns="http://www.w3.org/2000/svg" width="456" height="166" viewBox="0 0 456 166" role="img" aria-labelledby="title desc">
  <title id="title">Locating a small decimal between two rounded values</title>
  <desc id="desc">0.00506 lies to the right of 0.00505, the halfway point. It rounds to 0.0051.</desc>
  <rect x="1" y="1" width="454" height="164" rx="14" fill="#f4f8ff" stroke="#c9daed"/>
  <path d="M35 107H422M412 99L422 107L412 115" fill="none" stroke="#304968" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M48 98V115M228 99V115M408 98V115" fill="none" stroke="#304968" stroke-width="2"/>
  <path d="M228 61V98" fill="none" stroke="#76869c" stroke-width="1.8" stroke-dasharray="4 4"/>
  <path d="M264 57V102" fill="none" stroke="#285a9e" stroke-width="1.8" stroke-dasharray="4 4"/>
  <circle cx="264" cy="107" r="5.8" fill="#285a9e"/>
  <circle cx="408" cy="107" r="5.6" fill="#06776a"/>
  <g font-family="system-ui,sans-serif" font-size="18" fill="#193555" text-anchor="middle">
    <text x="48" y="140">0.0050</text>
    <text x="228" y="140">0.00505</text>
    <text x="408" y="140" fill="#06685c" font-weight="700">0.0051</text>
    <text x="264" y="45" fill="#285a9e" font-size="19" font-weight="700">0.00506</text>
  </g>
</svg>
