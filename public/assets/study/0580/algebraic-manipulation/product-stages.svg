<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 432 162" role="img" aria-labelledby="title desc"><title id="title">Expand a product in stages</title><desc id="desc">An initial pair of brackets is expanded. The third bracket is then multiplied by the expanded result.</desc><rect width="432" height="162" rx="14" fill="#eff6ff"/><rect x="16" y="66" width="108" height="37" rx="6" fill="#dbeafe" stroke="#769ac6" stroke-width="1.5"/><rect x="161" y="66" width="108" height="37" rx="6" fill="#dbeafe" stroke="#769ac6" stroke-width="1.5"/><rect x="305" y="66" width="110" height="37" rx="6" fill="#dbeafe" stroke="#769ac6" stroke-width="1.5"/><text x="70" y="89" text-anchor="middle" fill="#17365d" font-size="14" font-family="system-ui,sans-serif">First two</text><text x="215" y="89" text-anchor="middle" fill="#17365d" font-size="14" font-family="system-ui,sans-serif">Their product</text><text x="360" y="89" text-anchor="middle" fill="#17365d" font-size="14" font-family="system-ui,sans-serif">With next factor</text><line x1="125" y1="84" x2="158" y2="84" stroke="#2259a1" stroke-width="2" /><path d="M158,84L148.8,90.0L148.8,78.0Z" fill="#2259a1"/><line x1="271" y1="84" x2="302" y2="84" stroke="#2259a1" stroke-width="2" /><path d="M302,84L292.8,90.0L292.8,78.0Z" fill="#2259a1"/><text x="215" y="132" text-anchor="middle" fill="#17365d" font-size="14" font-family="system-ui,sans-serif">Repeat until every factor has been used</text></svg>
