<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 432 162" role="img" aria-labelledby="title desc"><title id="title">Two rows and two columns give four products</title><desc id="desc">A rectangle is split into four pieces. Row and column divisions meet in the middle.</desc><rect width="432" height="162" rx="14" fill="#eff6ff"/><rect x="122" y="41" width="103" height="42" rx="0" fill="#9abff1" stroke="#769ac6" stroke-width="1.5"/><rect x="225" y="41" width="110" height="42" rx="0" fill="#dbeafe" stroke="#769ac6" stroke-width="1.5"/><rect x="122" y="83" width="103" height="55" rx="0" fill="#b8e0d4" stroke="#769ac6" stroke-width="1.5"/><rect x="225" y="83" width="110" height="55" rx="0" fill="#f4ddb4" stroke="#769ac6" stroke-width="1.5"/><text x="228" y="27" text-anchor="middle" fill="#17365d" font-size="14" font-family="system-ui,sans-serif">Two columns</text><text x="68" y="91" text-anchor="middle" fill="#17365d" font-size="14" font-family="system-ui,sans-serif">Two rows</text></svg>
