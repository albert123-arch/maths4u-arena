<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 432 162" role="img" aria-labelledby="title desc"><title id="title">Rearrange the difference of two square areas</title><desc id="desc">A smaller square is removed from the top-right corner. Two remaining rectangles fit side-by-side after rotating the taller narrow piece.</desc><rect width="432" height="162" rx="14" fill="#eff6ff"/><rect x="30" y="20" width="60" height="52" rx="0" fill="#b8e0d4" stroke="#769ac6" stroke-width="1.5"/><rect x="90" y="20" width="52" height="52" rx="0" fill="#eff6ff" stroke="#769ac6" stroke-width="1.5"/><rect x="30" y="72" width="112" height="60" rx="0" fill="#9abff1" stroke="#769ac6" stroke-width="1.5"/><rect x="90" y="20" width="52" height="52" fill="none" stroke="#7294bc" stroke-dasharray="4 3"/><line x1="166" y1="85" x2="218" y2="85" stroke="#2259a1" stroke-width="2" /><path d="M218,85L208.8,91.0L208.8,79.0Z" fill="#2259a1"/><rect x="244" y="53" width="112" height="60" rx="0" fill="#9abff1" stroke="#769ac6" stroke-width="1.5"/><rect x="356" y="53" width="52" height="60" rx="0" fill="#b8e0d4" stroke="#769ac6" stroke-width="1.5"/><text x="87" y="150" text-anchor="middle" fill="#17365d" font-size="14" font-family="system-ui,sans-serif">Corner removed</text><text x="324" y="135" text-anchor="middle" fill="#17365d" font-size="14" font-family="system-ui,sans-serif">Same remaining area</text></svg>
