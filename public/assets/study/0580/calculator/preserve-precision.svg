<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 122" role="img" aria-label="Three stages. Keep all digits after the first step. Use the stored value in the next step. Round the final answer if requested."><rect width="380" height="122" rx="12" fill="#f8fafc"/><g fill="#173554" font-family="Arial,sans-serif"><rect x="16" y="45" width="100" height="49" rx="8" fill="#d8eaff" stroke="#355474" stroke-width="1.4"/><text x="66" y="62" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600">First step</text><text x="66" y="80" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600">Keep all digits</text><rect x="140" y="45" width="100" height="49" rx="8" fill="#ccece5" stroke="#355474" stroke-width="1.4"/><text x="190" y="62" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600">Next step</text><text x="190" y="80" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600">Use stored value</text><rect x="264" y="45" width="100" height="49" rx="8" fill="#fff0cc" stroke="#355474" stroke-width="1.4"/><text x="314" y="62" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600">Final answer</text><text x="314" y="80" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600">Round if asked</text><path d="M118,69H138m-6,-4 6,4 -6,4" stroke="#355474" stroke-width="1.8" fill="none"/><path d="M242,69H262m-6,-4 6,4 -6,4" stroke="#355474" stroke-width="1.8" fill="none"/></g></svg>
