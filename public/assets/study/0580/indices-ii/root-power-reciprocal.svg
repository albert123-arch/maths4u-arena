<svg xmlns="http://www.w3.org/2000/svg" width="456" height="166" viewBox="0 0 456 166" role="img" aria-labelledby="title desc">
  <title id="title">Read the three parts of a negative fractional index</title>
  <desc id="desc">The denominator gives the root. The numerator gives the power. If the exponent is negative, take the reciprocal.</desc>
  <rect x="1" y="1" width="454" height="164" rx="14" fill="#f1f6ff" stroke="#b8c9e1"/>
  <rect x="17" y="59" width="125" height="56" rx="8" fill="#d5e9ff" stroke="#315887" stroke-width="1.5"/>
  <rect x="166" y="59" width="125" height="56" rx="8" fill="#cceeea" stroke="#007d71" stroke-width="1.5"/>
  <rect x="315" y="59" width="125" height="56" rx="8" fill="#fff0d3" stroke="#9c560d" stroke-width="1.5"/>
  <path d="M145 87h18m-6-5 6 5-6 5m137-5h18m-6-5 6 5-6 5" stroke="#315887" stroke-width="2" fill="none" stroke-linejoin="round"/>
  <g fill="#273e63" text-anchor="middle" font-family="Arial,sans-serif">
    <g font-size="17"><text x="79" y="43">Denominator</text><text x="228" y="43">Numerator</text><text x="377" y="43">If negative</text></g>
    <g font-size="18" font-weight="700">
      <text x="79" y="92">Take root</text>
      <text x="228" y="83">Raise to</text><text x="228" y="104">power</text>
      <text x="377" y="83">Take</text><text x="377" y="104">reciprocal</text>
    </g>
  </g>
</svg>
