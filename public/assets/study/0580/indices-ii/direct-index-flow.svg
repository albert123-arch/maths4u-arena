<svg xmlns="http://www.w3.org/2000/svg" width="456" height="166" viewBox="0 0 456 166" role="img" aria-labelledby="title desc">
  <title id="title">Three steps to finding a missing index</title>
  <desc id="desc">Recognise the base, compare the two indices and check the result in the original equation.</desc>
  <rect x="1" y="1" width="454" height="164" rx="14" fill="#f1f6ff" stroke="#b8c9e1"/>
  <rect x="17" y="51" width="125" height="63" rx="8" fill="#d5e9ff" stroke="#315887" stroke-width="1.5"/>
  <rect x="166" y="51" width="125" height="63" rx="8" fill="#cceeea" stroke="#007d71" stroke-width="1.5"/>
  <rect x="315" y="51" width="125" height="63" rx="8" fill="#fff0d3" stroke="#9c560d" stroke-width="1.5"/>
  <path d="M145 82h18m-6-5 6 5-6 5m137-5h18m-6-5 6 5-6 5" stroke="#315887" stroke-width="2" fill="none" stroke-linejoin="round"/>
  <g fill="#273e63" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700">
    <text x="79" y="79">Recognise</text><text x="79" y="101">the base</text>
    <text x="228" y="79">Compare</text><text x="228" y="101">the indices</text>
    <text x="377" y="79">Check</text><text x="377" y="101">the solution</text>
  </g>
</svg>
