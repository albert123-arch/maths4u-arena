<svg xmlns="http://www.w3.org/2000/svg" width="456" height="166" viewBox="0 0 456 166" role="img" aria-labelledby="title desc">
  <title id="title">Percentages and decimals at the same positions</title>
  <desc id="desc">On a number line, sixty percent is at zero point six, sixty-seven percent is at zero point six seven, and seventy-five percent is at zero point seven five.</desc>
  <rect x="1" y="1" width="454" height="164" rx="14" fill="#f4f8ff" stroke="#c9daed"/>
  <path d="M30 108H430M420 100L430 108L420 116" fill="none" stroke="#304968" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M38 100V116M114 100V116M190 100V116M266 100V116M342 100V116M418 100V116" fill="none" stroke="#304968" stroke-width="2"/>
  <path d="M114 64V103M220.4 64V103M342 64V103" fill="none" stroke="#285a9e" stroke-width="1.8" stroke-dasharray="4 4"/>
  <circle cx="114" cy="108" r="5.5" fill="#285a9e"/><circle cx="220.4" cy="108" r="5.5" fill="#06776a"/><circle cx="342" cy="108" r="5.5" fill="#285a9e"/>
  <g fill="#193555" font-family="system-ui,sans-serif" font-size="17" text-anchor="middle">
    <text x="38" y="139">0.55</text><text x="114" y="139">0.60</text><text x="190" y="139">0.65</text>
    <text x="266" y="139">0.70</text><text x="342" y="139">0.75</text><text x="418" y="139">0.80</text>
    <text x="114" y="51" fill="#285a9e" font-size="20" font-weight="700">60%</text>
    <text x="220.4" y="51" fill="#06776a" font-size="20" font-weight="700">67%</text>
    <text x="342" y="51" fill="#285a9e" font-size="20" font-weight="700">75%</text>
  </g>
</svg>
