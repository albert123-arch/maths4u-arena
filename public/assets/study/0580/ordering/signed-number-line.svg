<svg xmlns="http://www.w3.org/2000/svg" width="456" height="166" viewBox="0 0 456 166" role="img" aria-labelledby="title desc">
  <title id="title">Comparing signed values</title>
  <desc id="desc">Equal spaces represent two units. Negative six is to the left of negative two, so it is smaller.</desc>
  <rect x="1" y="1" width="454" height="164" rx="14" fill="#f4f8ff" stroke="#c9daed"/>
  <path d="M32 108H428M418 100L428 108L418 116" fill="none" stroke="#304968" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M42 101V115M104 100V116M166 101V115M228 100V116M290 100V116M352 101V115M414 101V115" fill="none" stroke="#304968" stroke-width="2"/>
  <path d="M104 61V104M228 61V104" fill="none" stroke="#285a9e" stroke-width="1.8" stroke-dasharray="4 4"/>
  <circle cx="104" cy="108" r="5.5" fill="#285a9e"/>
  <circle cx="228" cy="108" r="5.5" fill="#285a9e"/>
  <path d="M115 53H218M209 45L218 53L209 61" fill="none" stroke="#06776a" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
  <g fill="#193555" font-family="system-ui,sans-serif" font-size="17" text-anchor="middle">
    <text x="42" y="140">−8</text><text x="104" y="140">−6</text><text x="166" y="140">−4</text>
    <text x="228" y="140">−2</text><text x="290" y="140">0</text><text x="352" y="140">2</text><text x="414" y="140">4</text>
    <text x="166.5" y="38" fill="#065f57" font-size="19" font-weight="650">Increases</text>
  </g>
</svg>
