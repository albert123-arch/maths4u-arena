    <path d="M78 168L318 56" stroke="#176399" stroke-width="2.8"/>
    <g fill="#176399">
      <circle cx="78" cy="168" r="4.5"/>
      <circle cx="168" cy="126" r="4.5"/>
      <circle cx="318" cy="56" r="4.5"/>
    </g>
  </g>
