      <text x="78" y="232">1</text>
      <text x="168" y="232">4</text>
      <text x="318" y="232">9</text>
    </g>
    <g text-anchor="end">
      <text x="39" y="187">2</text>
      <text x="39" y="159">4</text>
      <text x="39" y="131">6</text>
      <text x="39" y="103">8</text>
      <text x="39" y="75">10</text>
      <text x="39" y="47">12</text>
    </g>
    <text x="360" y="215">X</text>
    <text x="43" y="25">Y</text>
  </g>
</svg>
