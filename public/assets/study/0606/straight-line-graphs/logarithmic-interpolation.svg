<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 392 250" role="img" aria-labelledby="title desc">
  <title id="title">Transformed straight-line readings</title>
  <desc id="desc">The measured points on Y equals X plus 2 are (1,3), (4,6) and (9,11).</desc>
  <rect width="392" height="250" rx="12" fill="#f8fafc"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78 210V38 M168 210V38 M318 210V38 M48 182H345 M48 154H345 M48 126H345 M48 98H345 M48 70H345 M48 42H345"
          stroke="#b0c1cf" stroke-dasharray="3 5"/>
    <path d="M48 35V210H348 M344 206L348 210L344 214 M44 39L48 35L52 39"
