<svg xmlns="http://www.w3.org/2000/svg" width="392" height="220" viewBox="0 0 392 220" role="img" aria-labelledby="title desc">
  <title id="title">Height outside the triangle</title>
  <desc id="desc">A at minus 3 comma 4 and B at 5 comma 4 form a horizontal base. C at 8 comma minus 2 is vertically below H at 8 comma 4, outside the base segment.</desc>
  <rect width="392" height="220" rx="12" fill="#f5f9ff"/>
  <path d="M34 130H346M106 198V24" fill="none" stroke="#6e819c" stroke-width="1.5"/>
  <path d="M346 130l-6 -4v8zM106 24l-4 6h8z" fill="#6e819c"/>
  <path d="M52 58H196L250 166Z" fill="#d3e5fc" stroke="#1e569c" stroke-width="2"/>
  <path d="M196 58H250V166" fill="none" stroke="#2b826e" stroke-width="2" stroke-dasharray="6 4"/>
  <path d="M239 58v11h11" fill="none" stroke="#2b826e" stroke-width="1.5"/>
  <g fill="#1e569c">
    <circle cx="52" cy="58" r="3"/><circle cx="196" cy="58" r="3"/><circle cx="250" cy="166" r="3"/>
  </g>
  <circle cx="250" cy="58" r="3" fill="#2b826e"/>
  <g font-family="system-ui, sans-serif" font-size="13" fill="#223750">
    <text x="42" y="43">A (−3, 4)</text>
    <text x="171" y="43">B (5, 4)</text>
    <text x="260" y="59">H (8, 4)</text>
    <text x="260" y="179">C (8, −2)</text>
    <text x="260" y="114" fill="#206454">perpendicular height</text>
    <text x="351" y="135">x</text><text x="115" y="28">y</text><text x="91" y="147">0</text>
  </g>
</svg>
