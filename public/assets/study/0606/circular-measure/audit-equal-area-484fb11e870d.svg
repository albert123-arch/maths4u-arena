<svg xmlns="http://www.w3.org/2000/svg" width="400" height="254" viewBox="0 0 400 254" role="img" aria-labelledby="t"><title id="t">Sectors on the same scale have equal areas. Their radii are 12 cm and 15 cm, and their angles are 7/6 and 56/75 times pi radians.</title><rect width="400" height="254" rx="12" fill="#f4f7fc"/><g font-family="system-ui, sans-serif" font-size="15" stroke-linecap="round" stroke-linejoin="round"><circle cx="100.0000" cy="105.0000" r="54.4000" fill="none" stroke="#526887" stroke-width="1.5"/><path d="M 100.0000 105.0000 L 85.9202 52.4536 A 54.4000 54.4000 0 1 1 85.9202 157.5464 Z" fill="#d8f0e7" stroke="#195795" stroke-width="2"/><path d="M 85.9202 52.4536 A 54.4000 54.4000 0 1 1 85.9202 157.5464" fill="none" stroke="#11745d" stroke-width="2"/><path d="M 96.3393 91.3379 A 14.1440 14.1440 0 1 1 96.3393 118.6621" fill="none" stroke="#11745d" stroke-width="2"/><circle cx="100.0000" cy="105.0000" r="2.4000" fill="#1d3455" stroke="#1d3455" stroke-width="1.5"/><circle cx="300.0000" cy="105.0000" r="68.0000" fill="none" stroke="#526887" stroke-width="1.5"/><path d="M 300.0000 105.0000 L 326.3511 42.3133 A 68.0000 68.0000 0 0 1 326.3511 167.6867 Z" fill="#d8f0e7" stroke="#195795" stroke-width="2"/><path d="M 326.3511 42.3133 A 68.0000 68.0000 0 0 1 326.3511 167.6867" fill="none" stroke="#11745d" stroke-width="2"/><path d="M 306.8513 88.7015 A 17.6800 17.6800 0 0 1 306.8513 121.2985" fill="none" stroke="#11745d" stroke-width="2"/><circle cx="300.0000" cy="105.0000" r="2.4000" fill="#1d3455" stroke="#1d3455" stroke-width="1.5"/><text x="16.0000" y="194.0000" text-anchor="start" fill="#1d3455">r₁ = 12 cm</text><text x="216.0000" y="194.0000" text-anchor="start" fill="#1d3455">r₂ = 15 cm</text><text x="16.0000" y="237.0000" text-anchor="start" fill="#1d3455">θ₁ = </text><text x="66.0000" y="227.0000" text-anchor="middle" fill="#1d3455">7</text><path d="M 60.0000 232.0000 L 72.0000 232.0000" fill="none" stroke="#1d3455" stroke-width="2"/><text x="66.0000" y="249.0000" text-anchor="middle" fill="#1d3455">6</text><text x="79.0000" y="237.0000" text-anchor="start" fill="#1d3455">π rad</text><text x="216.0000" y="237.0000" text-anchor="start" fill="#1d3455">θ₂ = </text><text x="271.0000" y="227.0000" text-anchor="middle" fill="#1d3455">56</text><path d="M 260.0000 232.0000 L 282.0000 232.0000" fill="none" stroke="#1d3455" stroke-width="2"/><text x="271.0000" y="249.0000" text-anchor="middle" fill="#1d3455">75</text><text x="289.0000" y="237.0000" text-anchor="start" fill="#1d3455">π rad</text></g></svg>
