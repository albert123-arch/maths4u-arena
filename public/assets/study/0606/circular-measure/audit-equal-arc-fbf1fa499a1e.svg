<svg xmlns="http://www.w3.org/2000/svg" width="400" height="254" viewBox="0 0 400 254" role="img" aria-labelledby="t"><title id="t">Sectors on the same scale have equal arcs. Their radii are 18 cm and 22 cm, and their angles are 5/6 and 15/22 times pi radians.</title><rect width="400" height="254" rx="12" fill="#f4f7fc"/><g font-family="system-ui, sans-serif" font-size="15" stroke-linecap="round" stroke-linejoin="round"><circle cx="100.0000" cy="105.0000" r="55.6364" fill="none" stroke="#526887" stroke-width="1.5"/><path d="M 100.0000 105.0000 L 114.3998 51.2594 A 55.6364 55.6364 0 0 1 114.3998 158.7406 Z" fill="none" stroke="#195795" stroke-width="2"/><path d="M 114.3998 51.2594 A 55.6364 55.6364 0 0 1 114.3998 158.7406" fill="none" stroke="#11745d" stroke-width="2"/><path d="M 103.7439 91.0274 A 14.4655 14.4655 0 0 1 103.7439 118.9726" fill="none" stroke="#11745d" stroke-width="2"/><circle cx="100.0000" cy="105.0000" r="2.4000" fill="#1d3455" stroke="#1d3455" stroke-width="1.5"/><circle cx="300.0000" cy="105.0000" r="68.0000" fill="none" stroke="#526887" stroke-width="1.5"/><path d="M 300.0000 105.0000 L 332.5889 45.3178 A 68.0000 68.0000 0 0 1 332.5889 164.6822 Z" fill="none" stroke="#195795" stroke-width="2"/><path d="M 332.5889 45.3178 A 68.0000 68.0000 0 0 1 332.5889 164.6822" fill="none" stroke="#11745d" stroke-width="2"/><path d="M 308.4731 89.4826 A 17.6800 17.6800 0 0 1 308.4731 120.5174" fill="none" stroke="#11745d" stroke-width="2"/><circle cx="300.0000" cy="105.0000" r="2.4000" fill="#1d3455" stroke="#1d3455" stroke-width="1.5"/><text x="16.0000" y="194.0000" text-anchor="start" fill="#1d3455">r₁ = 18 cm</text><text x="216.0000" y="194.0000" text-anchor="start" fill="#1d3455">r₂ = 22 cm</text><text x="16.0000" y="237.0000" text-anchor="start" fill="#1d3455">θ₁ = </text><text x="66.0000" y="227.0000" text-anchor="middle" fill="#1d3455">5</text><path d="M 60.0000 232.0000 L 72.0000 232.0000" fill="none" stroke="#1d3455" stroke-width="2"/><text x="66.0000"