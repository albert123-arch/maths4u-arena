<svg xmlns="http://www.w3.org/2000/svg" width="400" height="254" viewBox="0 0 400 254" role="img" aria-labelledby="t"><title id="t">Sectors on the same scale have equal arcs. Their radii are 13 cm and 17 cm, and their angles are 1/2 and 13/34 times pi radians.</title><rect width="400" height="254" rx="12" fill="#f4f7fc"/><g font-family="system-ui, sans-serif" font-size="15" stroke-linecap="round" stroke-linejoin="round"><circle cx="100.0000" cy="105.0000" r="52.0000" fill="none" stroke="#526887" stroke-width="1.5"/><path d="M 100.0000 105.0000 L 136.7696 68.2304 A 52.0000 52.0000 0 0 1 136.7696 141.7696 Z" fill="none" stroke="#195795" stroke-width="2"/><path d="M 136.7696 68.2304 A 52.0000 52.0000 0 0 1 136.7696 141.7696" fill="none" stroke="#11745d" stroke-width="2"/><path d="M 109.5601 95.4399 A 13.5200 13.5200 0 0 1 109.5601 114.5601" fill="none" stroke="#11745d" stroke-width="2"/><circle cx="100.0000" cy="105.0000" r="2.4000" fill="#1d3455" stroke="#1d3455" stroke-width="1.5"/><circle cx="300.0000" cy="105.0000" r="68.0000" fill="none" stroke="#526887" stroke-width="1.5"/><path d="M 300.0000 105.0000 L 356.0998 66.5707 A 68.0000 68.0000 0 0 1 356.0998 143.4293 Z" fill="none" stroke="#195795" stroke-width="2"/><path d="M 356.0998 66.5707 A 68.0000 68.0000 0 0 1 356.0998 143.4293" fill="none" stroke="#11745d" stroke-width="2"/><path d="M 314.5860 95.0084 A 17.6800 17.6800 0 0 1 314.5860 114.9916" fill="none" stroke="#11745d" stroke-width="2"/><circle cx="300.0000" cy="105.0000" r="2.4000" fill="#1d3455" stroke="#1d3455" stroke-width="1.5"/><text x="16.0000" y="194.0000" text-anchor="start" fill="#1d3455">r₁ = 13 cm</text><text x="216.0000" y="194.0000" text-anchor="start" fill="#1d3455">r₂ = 17 cm</text><text x="16.0000" y="237.0000" text-anchor="start" fill="#1d3455">θ₁ = </text><text x="66.0000" y="227.0000" text-anchor="middle" fill="#1d3455">1</text><path d="M 60.0000 232.0000 L 72.0000 232.0000" fill="none" stroke="#1d3455" stroke-width="2"/><text x="66.0000" y="249.0000" text-anchor="middle" fill="#1d3455">2</text><text x="79.0000" y="237.0000" text-anchor="start" fill="#1d3455">π rad</text><text x="216.0000" y="237.0000" text-anchor="start" fill="#1d3455">θ₂ = </text><text x="271.0000" y="227.0000" text-anchor="middle" fill="#1d3455">13</text><path d="M 260.0000 232.0000 L 282.0000 232.0000" fill="none" stroke="#1d3455" stroke-width="2"/><text x="271.0000" y="249.0000" text-anchor="middle" fill="#1d3455">34</text><text x="289.0000" y="237.0000" text-anchor="start" fill="#1d3455">π rad</text></g></svg>
