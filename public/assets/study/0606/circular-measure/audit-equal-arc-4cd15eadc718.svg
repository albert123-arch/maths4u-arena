<svg xmlns="http://www.w3.org/2000/svg" width="400" height="254" viewBox="0 0 400 254" role="img" aria-labelledby="t"><title id="t">Sectors on the same scale have equal arcs. Their radii are 13 cm and 16 cm, and their angles are 2/3 and 13/24 times pi radians.</title><rect width="400" height="254" rx="12" fill="#f4f7fc"/><g font-family="system-ui, sans-serif" font-size="15" stroke-linecap="round" stroke-linejoin="round"><circle cx="100.0000" cy="105.0000" r="55.2500" fill="none" stroke="#526887" stroke-width="1.5"/><path d="M 100.0000 105.0000 L 127.6250 57.1521 A 55.2500 55.2500 0 0 1 127.6250 152.8479 Z" fill="none" stroke="#195795" stroke-width="2"/><path d="M 127.6250 57.1521 A 55.2500 55.2500 0 0 1 127.6250 152.8479" fill="none" stroke="#11745d" stroke-width="2"/><path d="M 107.1825 92.5595 A 14.3650 14.3650 0 0 1 107.1825 117.4405" fill="none" stroke="#11745d" stroke-width="2"/><circle cx="100.0000" cy="105.0000" r="2.4000" fill="#1d3455" stroke="#1d3455" stroke-width="1.5"/><circle cx="300.0000" cy="105.0000" r="68.0000" fill="none" stroke="#526887" stroke-width="1.5"/><path d="M 300.0000 105.0000 L 344.8355 53.8749 A 68.0000 68.0000 0 0 1 344.8355 156.1251 Z" fill="none" stroke="#195795" stroke-width="2"/><path d="M 344.8355 53.8749 A 68.0000 68.0000 0 0 1 344.8355 156.1251" fill="none" stroke="#11745d" stroke-width="2"/><path d="M 311.6572 91.7075 A 17.6800 17.6800 0 0 1 311.6572 118.2925" fill="none" stroke="#11745d" stroke-width="2"/><circle cx="300.0000" cy="105.0000" r="2.4000" fill="#1d3455" stroke="#1d3455" stroke-width="1.5"/><text x="16.0000" y="194.0000" text-anchor="start" fill="#1d3455">r₁ = 13 cm</text><text x="216.0000" y="194.0000" text-anchor="start" fill="#1d3455">r₂ = 16 cm</text><text x="16.0000" y="237.0000" text-anchor="start" fill="#1d3455">θ₁ = </text><text x="66.0000" y="227.0000" text-anchor="middle" fill="#1d3455">2</text><path d="M 60.0000 232.0000 L 72.0000 232.0000" fill="none" stroke="#1d3455" stroke-width="2"/><text x="66.0000" y="249.0000" text-anchor="middle" fill="#1d3455">3</text><text x="79.0000" y="237.0000" text-anchor="start" fill="#1d3455">π rad</text><text x="216.0000" y="237.0000" text-anchor="start" fill="#1d3455">θ₂ = </text><text x="271.0000" y="227.0000" text-anchor="middle" fill="#1d3455">13</text><path d="M 260.0000 232.0000 L 282.0000 232.0000" fill="none" stroke="#1d3455" stroke-width="2"/><text x="271.0000" y="249.0000" text-anchor="middle" fill="#1d3455">24</text><text x="289.0000" y="237.0000" text-anchor="start" fill="#1d3455">π rad</text></g></svg>
