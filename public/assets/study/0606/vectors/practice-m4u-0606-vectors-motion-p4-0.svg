<svg xmlns="http://www.w3.org/2000/svg" width="440" height="280" viewBox="0 0 440 280" role="img" aria-labelledby="title">
<title id="title">Blue route starts at A and green route starts at B at t = 0. They reach C at 5 and 5 seconds respectively.</title>
<rect width="440" height="280" rx="12" fill="#f4f8fd"/>
<defs>
<marker id="blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#176d91"/></marker>
<marker id="green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#26754b"/></marker>
</defs>
<g font-family="system-ui,sans-serif" font-weight="600">
<path d="M170.40 71.00L269.60 170.20" fill="none" stroke="#176d91" stroke-width="3" marker-end="url(#blue)"/>
<path d="M197.07 231.00L263.20 131.80" fill="none" stroke="#26754b" stroke-width="3" marker-end="url(#green)"/>
<circle cx="170.40" cy="71.00" r="4.6" fill="#176d91"/>
<text x="170.40" y="93.00" text-anchor="middle" fill="#176d91" font-size="17">A</text>
<circle cx="197.07" cy="231.00" r="4.6" fill="#26754b"/>
<text x="197.07" y="253.00" text-anchor="middle" fill="#26754b" font-size="17">B</text>
<circle cx="250.40" cy="151.00" r="4.6" fill="#aa412d"/>
<text x="257.40" y="139.00" text-anchor="middle" fill="#aa412d" font-size="17">C</text>
<text x="220.00" y="24.00" text-anchor="middle" fill="#15283c" font-size="18">Crossing and collision</text>
<text x="220.00" y="49.00" text-anchor="middle" fill="#15283c" font-size="16">At C: A at 5 s · B at 5 s</text>
<text x="220.00" y="261.00" text-anchor="middle" fill="#15283c" font-size="16">A: (3, −3) m/s · B: (2, 3) m/s</text>
</g>
</svg>
