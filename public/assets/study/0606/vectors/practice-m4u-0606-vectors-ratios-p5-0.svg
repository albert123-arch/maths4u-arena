<svg xmlns="http://www.w3.org/2000/svg" width="440" height="280" viewBox="0 0 440 280" role="img" aria-labelledby="title">
<title id="title">Collinear points A, B and D. The blue and green arrows share their start at A.</title>
<rect width="440" height="280" rx="12" fill="#f4f8fd"/>
<defs>
<marker id="blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#176d91"/></marker>
<marker id="green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#26754b"/></marker>
</defs>
<g font-family="system-ui,sans-serif" font-weight="600">
<path d="M126.67 71.00L188.89 124.33" fill="none" stroke="#176d91" stroke-width="3"/>
<path d="M126.67 71.00L313.33 231.00" fill="none" stroke="#26754b" stroke-width="3" marker-end="url(#green)"/>
<circle cx="126.67" cy="71.00" r="4.6" fill="#176d91"/>
<text x="126.67" y="93.00" text-anchor="middle" fill="#176d91" font-size="17">A</text>
<circle cx="188.89" cy="124.33" r="4.6" fill="#176d91"/>
<text x="188.89" y="146.33" text-anchor="middle" fill="#176d91" font-size="17">B</text>
<circle cx="313.33" cy="231.00" r="4.6" fill="#26754b"/>
<text x="313.33" y="218.00" text-anchor="middle" fill="#26754b" font-size="17">D</text>
<text x="220.00" y="29.00" text-anchor="middle" fill="#15283c" font-size="18">A common starting point</text>
</g>
</svg>
