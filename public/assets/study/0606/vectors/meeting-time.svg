<svg xmlns="http://www.w3.org/2000/svg" width="440" height="280" viewBox="0 0 440 280" role="img" aria-labelledby="title">
<title id="title">Blue route starts at A and green route starts at B at t = 0. They reach C at 2 and 2 seconds respectively.</title>
<rect width="440" height="280" rx="12" fill="#f4f8fd"/>
<defs>
<marker id="blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#176d91"/></marker>
<marker id="green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#26754b"/></marker>
</defs>
<g font-family="system-ui,sans-serif" font-weight="600">
<path d="M58.00 203.65L268.60 98.35" fill="none" stroke="#176d91" stroke-width="3" marker-end="url(#blue)"/>
<path d="M382.00 203.65L171.40 98.35" fill="none" stroke="#26754b" stroke-width="3" marker-end="url(#green)"/>
<circle cx="58.00" cy="203.65" r="4.6" fill="#176d91"/>
<text x="58.00" y="225.65" text-anchor="middle" fill="#176d91" font-size="17">A</text>
<circle cx="382.00" cy="203.65" r="4.6" fill="#26754b"/>
<text x="382.00" y="225.65" text-anchor="middle" fill="#26754b" font-size="17">B</text>
<circle cx="220.00" cy="122.65" r="4.6" fill="#aa412d"/>
<text x="227.00" y="110.65" text-anchor="middle" fill="#aa412d" font-size="17">C</text>
<text x="220.00" y="24.00" text-anchor="middle" fill="#15283c" font-size="18">Crossing and collision</text>
<text x="220.00" y="49.00" text-anchor="middle" fill="#15283c" font-size="16">At C: A at 2 s · B at 2 s</text>
<text x="220.00" y="261.00" text-anchor="middle" fill="#15283c" font-size="16">A: (2, 1) m/s · B: (−2, 1) m/s</text>
</g>
</svg>
