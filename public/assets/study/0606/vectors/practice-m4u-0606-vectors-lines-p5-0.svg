<marker id="green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#26754b"/></marker>
</defs>
<g font-family="system-ui,sans-serif" font-weight="600">
<path d="M58.00 79.00L382.00 223.00" fill="none" stroke="#176d91" stroke-width="3" marker-end="url(#blue)"/>
<path d="M309.79 216.14L322.64 184.00" fill="none" stroke="#26754b" stroke-width="3" marker-end="url(#green)"/>
