<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 228" role="img" aria-labelledby="title"><title id="title">A starting bar of 100 percent and an increased bar of 120 percent</title><rect width="360" height="228" rx="10" fill="#f8fbff"/><g stroke-linecap="round" stroke-linejoin="round"><rect x="48" y="47" width="204" height="43" rx="5" fill="#79badd"/><rect x="48" y="124" width="204" height="43" rx="5" fill="#79badd"/><rect x="252" y="124" width="41" height="43" rx="5" fill="#f3aa76"/><text x="150.00" y="74.00" fill="#233e5c" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">start 100%</text><text x="150.00" y="152.00" fill="#233e5c" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">old amount</text><text x="273.00" y="152.00" fill="#233e5c" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">20%</text><text x="169.00" y="197.00" fill="#233e5c" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">new amount = 120% of start</text></g></svg>
