<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 226" role="img" aria-labelledby="title desc">
  <title id="title">Temperature over unequal intervals</title>
  <desc id="desc">The three readings at zero, five and fifteen minutes are twelve, eighteen and twenty-four degrees Celsius. The first segment is steeper.</desc>
  <rect width="360" height="226" rx="10" fill="#f8fbff"/>
  <path d="M56 54h240 M56 87h240 M56 120h240 M136 54v132 M216 54v132 M296 54v132" fill="none" stroke="#d8e3ee"/>
  <path d="M56 42v144h257 M51 54h10 M51 87h10 M51 120h10 M136 182v8 M216 182v8 M296 182v8" fill="none" stroke="#314963" stroke-width="1.7"/>
  <path d="M56 120 136 87" fill="none" stroke="#236a9e" stroke-width="3.5"/>
  <path d="M136 87 296 54" fill="none" stroke="#a44a24" stroke-width="3.5"/>
  <g fill="#236a9e"><circle cx="56" cy="120" r="4"/><circle cx="136" cy="87" r="4"/></g>
  <circle cx="296" cy="54" r="4" fill="#a44a24"/>
  <g fill="#243d56" font-family="system-ui,sans-serif" font-size="14">
    <text x="17" y="27" font-weight="600">Temperature (°C)</text>
    <g text-anchor="end"><text x="46" y="59">24</text><text x="46" y="92">18</text><text x="46" y="125">12</text><text x="46" y="190">0</text></g>
    <g text-anchor="middle"><text x="56" y="202">0</text><text x="136" y="202">5</text><text x="216" y="202">10</text><text x="296" y="202">15</text><text x="184" y="220" font-weight="600">Time (min)</text></g>
  </g>
</svg>
