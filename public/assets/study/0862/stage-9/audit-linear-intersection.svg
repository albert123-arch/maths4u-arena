<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 238" role="img" aria-labelledby="title desc">
  <title id="title">Intersection of two straight lines</title>
  <desc id="desc">The rising line y equals x plus one and the falling line y equals seven minus x cross at three, four.</desc>
  <rect width="360" height="238" rx="10" fill="#f8fbff"/>
  <path d="M54 56h216 M54 116h216 M54 176h216 M90 56v140 M162 56v140 M270 56v140" fill="none" stroke="#d8e3ee"/>
  <path d="M54 38v158h258 M50 56h8 M50 116h8 M50 176h8 M90 192v8 M162 192v8 M270 192v8" fill="none" stroke="#314963" stroke-width="1.7"/>
  <path d="M54 176 270 56" fill="none" stroke="#236a9e" stroke-width="3"/>
  <path d="M54 56 270 176" fill="none" stroke="#a44a24" stroke-width="3"/>
  <path d="M54 116h108v80" fill="none" stroke="#227858" stroke-dasharray="5 4" stroke-width="1.7"/>
  <circle cx="162" cy="116" r="4.5" fill="#227858" stroke="#f8fbff" stroke-width="1.5"/>
  <g fill="#243d56" font-family="system-ui,sans-serif" font-size="14">
    <text x="48" y="27">y</text>
    <text x="320" y="201">x</text>
    <g text-anchor="end"><text x="43" y="61">7</text><text x="43" y="121">4</text><text x="43" y="181">1</text></g>
    <g text-anchor="middle"><text x="54" y="217">0</text><text x="90" y="217">1</text><text x="162" y="217">3</text><text x="270" y="217">6</text></g>
  </g>
  <g font-family="system-ui,sans-serif" font-size="14" font-weight="600">
    <text x="276" y="52" fill="#195a87">y = x + 1</text>
    <text x="276" y="176" fill="#963f1d">y = 7 − x</text>
    <text x="161" y="94" text-anchor="middle" fill="#146348">(3, 4)</text>
  </g>
</svg>
