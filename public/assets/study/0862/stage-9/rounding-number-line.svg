<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 228" role="img" aria-labelledby="title"><title id="title">A number line has a filled point at 45 and an open point at 55, with 50 in the middle</title><rect width="360" height="228" rx="10" fill="#f8fbff"/><g stroke-linecap="round" stroke-linejoin="round"><path d="M43.00 127.00 L312.00 127.00" fill="none" stroke="#516275" stroke-width="1.7"/><path d="M80.00 127.00 L276.00 127.00" fill="none" stroke="#17775a" stroke-width="4"/><circle cx="80" cy="127" r="6" fill="#17775a"/><circle cx="276" cy="127" r="6" fill="#f8fbff" stroke="#17775a" stroke-width="2"/><path d="M178.00 117.00 L178.00 137.00" fill="none" stroke="#314966" stroke-width="1.5"/><text x="80.00" y="154.00" fill="#233e5c" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">45</text><text x="178.00" y="154.00" fill="#233e5c" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">50</text><text x="276.00" y="154.00" fill="#233e5c" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">55</text><text x="178.00" y="66.00" fill="#233e5c" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle">values that round to 50</text><text x="178.00" y="208.00" fill="#233e5c" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">nearest 10</text></g></svg>
