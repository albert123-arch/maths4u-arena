<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 226" role="img" aria-labelledby="title desc">
  <title id="title">Scatter graph of walking distance and time</title>
  <desc id="desc">Points at one, two, four and five kilometres form a rising pattern. The observation of 18 minutes at three kilometres lies below it.</desc>
  <rect width="360" height="226" rx="10" fill="#f8fbff"/>
  <path d="M55 46h255 M55 80h255 M55 114h255 M55 148h255 M106 46v136 M157 46v136 M208 46v136 M259 46v136 M310 46v136" fill="none" stroke="#d8e3ee"/>
  <path d="M55 42v140h264 M50 46h10 M50 80h10 M50 114h10 M50 148h10 M106 178v8 M157 178v8 M208 178v8 M259 178v8 M310 178v8" fill="none" stroke="#314963" stroke-width="1.7"/>
  <g fill="#236a9e"><circle cx="106" cy="158.2" r="4"/><circle cx="157" cy="132.7" r="4"/><circle cx="259" cy="85.1" r="4"/><circle cx="310" cy="61.3" r="4"/></g>
  <circle cx="208" cy="151.4" r="5" fill="#f8fbff" stroke="#a44a24" stroke-width="2.4"/>
  <g fill="#243d56" font-family="system-ui,sans-serif" font-size="14">
    <text x="17" y="25" font-weight="600">Walking time (min)</text>
    <text x="221" y="156" fill="#963f1d">Outlier</text>
    <g text-anchor="end"><text x="44" y="51">80</text><text x="44" y="85">60</text><text x="44" y="119">40</text><text x="44" y="153">20</text><text x="44" y="186">0</text></g>
    <g text-anchor="middle"><text x="55" y="201">0</text><text x="106" y="201">1</text><text x="157" y="201">2</text><text x="208" y="201">3</text><text x="259" y="201">4</text><text x="310" y="201">5</text><text x="182" y="220" font-weight="600">Distance (km)</text></g>
  </g>
</svg>
