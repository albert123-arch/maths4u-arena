<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 226" role="img" aria-labelledby="title desc">
  <title id="title">Frequency polygon at class midpoints</title>
  <desc id="desc">The midpoint at fifteen minutes has frequency four, twenty-five minutes has frequency nine, and thirty-five minutes has frequency six.</desc>
  <rect width="360" height="226" rx="10" fill="#f8fbff"/>
  <path d="M53 66h260 M53 105h260 M53 131h260 M151 58v125 M216 58v125 M281 58v125" fill="none" stroke="#d8e3ee"/>
  <path d="M53 44v139h266 M48 66h10 M48 105h10 M48 131h10 M151 179v8 M216 179v8 M281 179v8" fill="none" stroke="#314963" stroke-width="1.7"/>
  <path d="M151 131 216 66 281 105" fill="none" stroke="#236a9e" stroke-width="3.5" stroke-linejoin="round"/>
  <g fill="#236a9e"><circle cx="151" cy="131" r="4"/><circle cx="216" cy="66" r="4"/><circle cx="281" cy="105" r="4"/></g>
  <g fill="#243d56" font-family="system-ui,sans-serif" font-size="14">
    <text x="17" y="27" font-weight="600">Frequency</text>
    <g text-anchor="end"><text x="42" y="71">9</text><text x="42" y="110">6</text><text x="42" y="136">4</text><text x="42" y="187">0</text></g>
    <g text-anchor="middle"><text x="53" y="201">0</text><text x="151" y="201">15</text><text x="216" y="201">25</text><text x="281" y="201">35</text><text x="186" y="221" font-weight="600">Walking time (min)</text></g>
  </g>
</svg>
