<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 228" role="img" aria-labelledby="title"><title id="title">Balanced beam: x and eight on the left, twenty on the right. Removing eight from both sides leaves twelve.</title><rect width="360" height="228" rx="10" fill="#f8fbff"/><g font-family="system-ui, sans-serif" stroke-linecap="round" stroke-linejoin="round"><line x1="60" y1="56" x2="300" y2="56" stroke="#172b49" stroke-width="4"/><polygon points="159,186 201,186 180,58" fill="#e8f5ee" stroke="#172b49" stroke-width="2"/><line x1="80" y1="57" x2="80" y2="120" stroke="#172b49" stroke-width="2"/><line x1="280" y1="57" x2="280" y2="120" stroke="#172b49" stroke-width="2"/><line x1="28" y1="121" x2="133" y2="121" stroke="#2563eb" stroke-width="3"/><line x1="227" y1="121" x2="331" y2="121" stroke="#2563eb" stroke-width="3"/><rect x="37" y="87" width="44" height="33" fill="#dbeafe" stroke="#172b49" stroke-width="1.6"/><rect x="84" y="93" width="36" height="27" fill="#ffebc9" stroke="#172b49" stroke-width="1.6"/><rect x="243" y="85" width="66" height="35" fill="#e8f5ee" stroke="#172b49" stroke-width="1.6"/><text x="59" y="109" text-anchor="middle" font-size="15" fill="#172b49">x</text><text x="102" y="112" text-anchor="middle" font-size="15" fill="#172b49">8</text><text x="276" y="109" text-anchor="middle" font-size="15" fill="#172b49">20</text><text x="180" y="211" text-anchor="middle" font-size="15" fill="#172b49">Remove 8 from both pans.</text></g></svg>
