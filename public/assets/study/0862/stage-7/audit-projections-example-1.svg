<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 340" role="img" aria-labelledby="title"><title id="title">Cuboid 6 cm wide, 2 cm deep and 5 cm high. Arrows show the views from above, in front and from the right. Plan 6 by 2, front 6 by 5, right side 2 by 5.</title><rect width="360" height="340" rx="10" fill="#f8fbff"/><g font-family="system-ui, sans-serif" stroke-linecap="round" stroke-linejoin="round"><polygon points="112,68 202,68 222.1,47.9 132.1,47.9" fill="#e8f6f1" stroke="#172b49" stroke-width="2"/><polygon points="202,68 222.1,47.9 222.1,122.9 202,143" fill="#bce3d5" stroke="#172b49" stroke-width="2"/><rect x="112" y="68" width="90" height="75" fill="#dbeafe" stroke="#172b49" stroke-width="1.6"/><text x="157" y="163" text-anchor="middle" font-size="15" fill="#172b49">6 cm</text><text x="103" y="109.5" text-anchor="end" font-size="15" fill="#172b49">5 cm</text><text x="228.1" y="40.9" text-anchor="start" font-size="15" fill="#172b49">2 cm</text><text x="58" y="28" text-anchor="middle" font-size="15" fill="#2563eb">Plan</text><line x1="80" y1="29" x2="141.1" y2="56.9" stroke="#2563eb" stroke-width="2"/><polygon points="141.1,56.9 132.1,56.9148 135.217,50.0891" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><text x="51" y="144" text-anchor="middle" font-size="15" fill="#2563eb">Front</text><line x1="68" y1="128" x2="108" y2="130" stroke="#2563eb" stroke-width="2"/><polygon points="108,130 99.6422,133.339 100.017,125.844" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><text x="318" y="177" text-anchor="middle" font-size="15" fill="#2563eb">Right side</text><line x1="313" y1="155" x2="227.1" y2="117.9" stroke="#2563eb" stroke-width="2"/><polygon points="227.1,117.9 236.098,117.699 233.123,124.588" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><text x="61" y="211" text-anchor="middle" font-size="15" fill="#172b49">Plan</text><rect x="23.5" y="230" width="75" height="25" fill="#dbeafe" stroke="#172b49" stroke-width="1.6"/><text x="61" y="322" text-anchor="middle" font-size="15" fill="#172b49">6 × 2 cm</text><text x="180" y="211" text-anchor="middle" font-size="15" fill="#172b49">Front</text><rect x="142.5" y="230" width="75" height="62.5" fill="#dbeafe" stroke="#172b49" stroke-width="1.6"/><text x="180" y="322" text-anchor="middle" font-size="15" fill="#172b49">6 × 5 cm</text><text x="299" y="211" text-anchor="middle" font-size="15" fill="#172b49">Right side</text><rect x="286.5" y="230" width="25" height="62.5" fill="#dbeafe" stroke="#172b49" stroke-width="1.6"/><text x="299" y="322" text-anchor="middle" font-size="15" fill="#172b49">2 × 5 cm</text></g></svg>
