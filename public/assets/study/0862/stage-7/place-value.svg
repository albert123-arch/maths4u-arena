<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 228" role="img" aria-labelledby="title"><title id="title">Place value of 2.5. Zero tens, two ones and five tenths.</title><rect width="360" height="228" rx="10" fill="#f8fbff"/><g font-family="system-ui, sans-serif" stroke-linecap="round" stroke-linejoin="round"><rect x="20" y="44" width="320" height="118" fill="#ffffff" stroke="#172b49" stroke-width="1.6"/><line x1="125" y1="44" x2="125" y2="162" stroke="#172b49" stroke-width="2"/><line x1="235" y1="44" x2="235" y2="162" stroke="#172b49" stroke-width="2"/><line x1="20" y1="93" x2="340" y2="93" stroke="#172b49" stroke-width="2"/><text x="73" y="76" text-anchor="middle" font-size="15" fill="#172b49">Tens</text><text x="178" y="76" text-anchor="middle" font-size="15" fill="#172b49">Ones</text><text x="288" y="76" text-anchor="middle" font-size="15" fill="#172b49">Tenths</text><text x="73" y="137" text-anchor="middle" font-size="23" fill="#172b49">0</text><text x="178" y="137" text-anchor="middle" font-size="23" fill="#172b49">2</text><text x="288" y="137" text-anchor="middle" font-size="23" fill="#172b49">5</text><text x="230" y="143" text-anchor="middle" font-size="26" fill="#172b49">.</text><text x="180" y="197" text-anchor="middle" font-size="15" fill="#172b49">2.5 = 2 ones + 5 tenths</text></g></svg>
