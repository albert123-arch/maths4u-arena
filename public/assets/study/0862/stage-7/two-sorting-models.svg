<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 218" role="img" aria-labelledby="title"><title id="title">Venn diagram for 14 shapes. Blue only 5, both 3, triangle only 4, neither 2.</title><rect width="360" height="218" rx="10" fill="#f8fbff"/><g font-family="system-ui, sans-serif" stroke-linecap="round" stroke-linejoin="round"><rect x="14" y="35" width="332" height="171" fill="#ffffff" stroke="#172b49" stroke-width="1.6"/><text x="180" y="26" text-anchor="middle" font-size="15" fill="#172b49">All shapes</text><circle cx="139" cy="115" r="69" fill="#dbeafe" fill-opacity=".8" stroke="#2563eb" stroke-width="2"/><circle cx="224" cy="115" r="69" fill="#d4f0e2" fill-opacity=".7" stroke="#14745d" stroke-width="2"/><text x="107" y="81" text-anchor="middle" font-size="15" fill="#2563eb">Blue</text><text x="259" y="81" text-anchor="middle" font-size="15" fill="#14745d">Triangle</text><text x="105" y="124" text-anchor="middle" font-size="15" fill="#172b49">5</text><text x="181" y="122" text-anchor="middle" font-size="15" fill="#172b49">3</text><text x="258" y="124" text-anchor="middle" font-size="15" fill="#172b49">4</text><text x="318" y="186" text-anchor="middle" font-size="15" fill="#172b49">2</text></g></svg>
