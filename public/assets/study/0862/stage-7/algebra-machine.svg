<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 151" role="img" aria-labelledby="title"><title id="title">Input r, multiply by four, subtract two. Result 4r minus 2.</title><rect width="360" height="151" rx="10" fill="#f8fbff"/><g font-family="system-ui, sans-serif" stroke-linecap="round" stroke-linejoin="round"><rect x="16" y="65" width="67" height="54" fill="#dbeafe" stroke="#172b49" stroke-width="1.6"/><text x="49.5" y="51" text-anchor="middle" font-size="14" fill="#172b49">Input</text><text x="49.5" y="99" text-anchor="middle" font-size="19" fill="#172b49">r</text><line x1="86" y1="92" x2="100" y2="92" stroke="#2563eb" stroke-width="2"/><polygon points="100,92 91.8193,95.7518 91.8193,88.2482" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><rect x="103" y="65" width="67" height="54" fill="#dbeafe" stroke="#172b49" stroke-width="1.6"/><text x="136.5" y="51" text-anchor="middle" font-size="14" fill="#172b49">Multiply</text><text x="136.5" y="99" text-anchor="middle" font-size="19" fill="#172b49">× 4</text><line x1="173" y1="92" x2="187" y2="92" stroke="#2563eb" stroke-width="2"/><polygon points="187,92 178.819,95.7518 178.819,88.2482" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><rect x="190" y="65" width="67" height="54" fill="#dbeafe" stroke="#172b49" stroke-width="1.6"/><text x="223.5" y="51" text-anchor="middle" font-size="14" fill="#172b49">Subtract</text><text x="223.5" y="99" text-anchor="middle" font-size="19" fill="#172b49">− 2</text><line x1="260" y1="92" x2="274" y2="92" stroke="#2563eb" stroke-width="2"/><polygon points="274,92 265.819,95.7518 265.819,88.2482" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><rect x="277" y="65" width="67" height="54" fill="#dbeafe" stroke="#172b49" stroke-width="1.6"/><text x="310.5" y="51" text-anchor="middle" font-size="14" fill="#172b49">Output</text><text x="310.5" y="99" text-anchor="middle" font-size="19" fill="#172b49">4r − 2</text></g></svg>
