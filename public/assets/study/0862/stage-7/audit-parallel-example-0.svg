<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 213" role="img" aria-labelledby="title"><title id="title">Upper-right angle 56 degrees. At the lower crossing, a is above the line to the right and b is above it to the left.</title><rect width="360" height="213" rx="10" fill="#f8fbff"/><g font-family="system-ui, sans-serif" stroke-linecap="round" stroke-linejoin="round"><line x1="32" y1="55" x2="330" y2="55" stroke="#172b49" stroke-width="2"/><line x1="32" y1="137" x2="330" y2="137" stroke="#172b49" stroke-width="2"/><line x1="128.13" y1="166" x2="225.259" y2="22" stroke="#2563eb" stroke-width="2.5"/><text x="243" y="43" text-anchor="middle" font-size="15" fill="#2563eb">56°</text><text x="185.69" y="127" text-anchor="middle" font-size="15" fill="#172b49">a°</text><text x="112.69" y="126" text-anchor="middle" font-size="15" fill="#172b49">b°</text><text x="179" y="194" text-anchor="middle" font-size="15" fill="#172b49">The two horizontal lines are parallel.</text></g></svg>
