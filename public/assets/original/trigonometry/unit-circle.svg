<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" role="img" aria-labelledby="title desc"><title id="title">Unit-circle signs</title><desc id="desc">At angle 2π/3, cosine is negative and sine positive. The point is (cos θ, sin θ).</desc><rect width="520" height="440" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#172c43;font-size:16px;paint-order:stroke;stroke:white;stroke-width:3px;stroke-linejoin:round}.small{font-size:13px}</style><text x="260.0000" y="419.0000" text-anchor="middle" class="">Unit-circle signs</text><circle cx="260" cy="215" r="140" fill="none" stroke="#007c78" stroke-width="2.5"/><line x1="100.0000" y1="215.0000" x2="420.0000" y2="215.0000" stroke="#647a91" stroke-width="1.6"/><line x1="260.0000" y1="55.0000" x2="260.0000" y2="375.0000" stroke="#647a91" stroke-width="1.6"/><text x="427.0000" y="221.0000" text-anchor="start" class="">x</text><text x="268.0000" y="51.0000" text-anchor="start" class="">y</text><text x="400.0000" y="237.0000" text-anchor="middle" class="small">1</text><text x="120.0000" y="237.0000" text-anchor="middle" class="small">−1</text><text x="251.0000" y="80.0000" text-anchor="end" class="small">1</text><text x="251.0000" y="359.0000" text-anchor="end" class="small">−1</text><line x1="260.0000" y1="215.0000" x2="190.0000" y2="93.7564" stroke="#174e90" stroke-width="2.8"/><line x1="190.0000" y1="93.7564" x2="190.0000" y2="215.0000" stroke="#8c9bad" stroke-width="1.5" stroke-dasharray="5 4"/><circle cx="260.0000" cy="215.0000" r="4" fill="#007c78" data-role="O"/><circle cx="190.0000" cy="93.7564" r="4" fill="#007c78" data-role="P"/><path d="M 297,215 A 37,37 0 0 0 241.5000,182.9571" fill="none" stroke="#9d3a58" stroke-width="1.5" /><text x="138.0000" y="68.0000" text-anchor="start" class="">P = (cos θ, sin θ)</text><text x="287.0000" y="180.0000" text-anchor="start" class="">θ = 2π/3</text><text x="207.0000" y="240.0000" text-anchor="middle" class="small">cos θ &lt; 0</text></svg>
