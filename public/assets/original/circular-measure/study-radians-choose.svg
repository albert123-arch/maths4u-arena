<svg aria-labelledby="figure-2-radians-minor-reflex-title figure-2-radians-minor-reflex-desc" font-family="Inter, Arial, sans-serif" height="360" role="img" viewBox="0 0 560 360" width="560" xmlns="http://www.w3.org/2000/svg">
 <title id="figure-2-radians-minor-reflex-title">
  Minor and reflex central angles
 </title>
 <desc id="figure-2-radians-minor-reflex-desc">
  The minor angle is five pi over six radians and the reflex angle is seven pi over six radians. Their sum is two pi.
 </desc>
