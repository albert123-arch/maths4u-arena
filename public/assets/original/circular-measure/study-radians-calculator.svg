<svg aria-labelledby="figure-3-radians-right-triangle-title figure-3-radians-right-triangle-desc" font-family="Inter, Arial, sans-serif" height="360" role="img" viewBox="0 0 560 360" width="560" xmlns="http://www.w3.org/2000/svg">
 <title id="figure-3-radians-right-triangle-title">
  Opposite and adjacent sides for inverse tangent
 </title>
 <desc id="figure-3-radians-right-triangle-desc">
  A right triangle has an adjacent side of 8 centimetres and opposite side of 5 centimetres relative to alpha. The side ratio in the drawing is exactly five to eight.
 </desc>
 <defs>
  <marker id="figure-3-radians-right-triangle-arrow" markerHeight="8" markerWidth="8" orient="auto" refX="7" refY="4">
   <path d="M 0 0 L 8 4 L 0 8 Z" fill="#2854c5">
   </path>
  </marker>
 </defs>
