<svg aria-labelledby="figure-6-arc-rolling-wheel-title figure-6-arc-rolling-wheel-desc" font-family="Inter, Arial, sans-serif" height="360" role="img" viewBox="0 0 560 360" width="560" xmlns="http://www.w3.org/2000/svg">
 <title id="figure-6-arc-rolling-wheel-title">
  A wheel travels one circumference per revolution
 </title>
 <desc id="figure-6-arc-rolling-wheel-desc">
  The wheel radius is drawn as 50 units and the separation of the two centre positions is exactly 100 pi units, corresponding to one circumference. Both contact marks have the same orientation after a full turn.
 </desc>
