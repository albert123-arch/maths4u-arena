<svg aria-labelledby="figure-8-title figure-8-desc" font-family="Inter, Arial, sans-serif" height="340" role="img" viewBox="0 0 560 340" width="560" xmlns="http://www.w3.org/2000/svg">
 <title id="figure-8-title">
  Area scales with the square of the radius
 </title>
 <desc id="figure-8-desc">
  Two sectors have the same 1.2-radian angle and are drawn at the same scale. Their radii are 8 and 10, a ratio of 1.25. The second arc is 1.25 times as long and the second area is 1.5625 times as large.
 </desc>
