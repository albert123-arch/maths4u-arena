<svg xmlns="http://www.w3.org/2000/svg" width="640" height="450" viewBox="0 0 640 450" role="img" aria-labelledby="title desc">
  <title id="title">Equal circles with centres one radius apart</title>
  <desc id="desc">The shared lens consists of two minor circular segments. P and Q are the centres, A and B the common points, and PQ equals each radius. The drawing is schematic.</desc>
  <rect width="640" height="450" fill="white"/>
  <path d="M320 86.435935 A160 160 0 0 1 320 363.564065 A160 160 0 0 1 320 86.435935 Z" fill="#d9f0ea"/>
  <circle cx="240" cy="225" r="160" fill="none" stroke="#2457a8" stroke-width="2.5"/>
  <circle cx="400" cy="225" r="160" fill="none" stroke="#2457a8" stroke-width="2.5"/>
  <path d="M240 225 L400 225 M320 86.435935 L320 363.564065" fill="none" stroke="#6d7f94" stroke-width="1.5" stroke-dasharray="7 6"/>
  <path d="M240 225 L320 86.435935 L400 225" fill="none" stroke="#6d7f94" stroke-width="1.5"/>
  <g fill="#173454" font-family="Arial,sans-serif" font-size="24" text-anchor="middle">
    <circle cx="240" cy="225" r="3"/><circle cx="400" cy="225" r="3"/>
    <circle cx="320" cy="86.435935" r="3"/><circle cx="320" cy="363.564065" r="3"/>
    <text x="223" y="250">P</text><text x="417" y="250">Q</text>
    <text x="338" y="79">A</text><text x="338" y="385">B</text>
    <text x="320" y="252">r</text><text x="265" y="145">r</text><text x="375" y="145">r</text>
    <text x="320" y="428" font-size="18">Two minor segments form the overlap</text>
  </g>
</svg>
