<svg aria-labelledby="figure-9-title figure-9-desc" font-family="Inter, Arial, sans-serif" height="350" role="img" viewBox="0 0 560 350" width="560" xmlns="http://www.w3.org/2000/svg">
 <title id="figure-9-title">
  A minor sector and a reflex sector with equal area and perimeter
 </title>
 <desc id="figure-9-desc">
  Two sectors are drawn using the same length scale. The first radius is 6 cm and angle is 4 radians, so its arc is 24 cm. The second radius is 12 cm and angle is 1 radian, so its arc is 12 cm. Both have area 72 square centimetres and perimeter 36 cm.
 </desc>
 <rect fill="#f5f8ff" height="348" rx="16" stroke="#dce4f1" stroke-width="2" width="558" x="1" y="1">
 </rect>
