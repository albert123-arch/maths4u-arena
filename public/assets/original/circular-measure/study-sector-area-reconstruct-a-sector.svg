   Two different sectors
  </text>
  <text fill="#17243b" font-size="21" font-weight="normal" text-anchor="middle" x="280" y="62">
   Both: area 72 cm², perimeter 36 cm
  </text>
  <path d="M115.000 210.000 L175.000 210.000 A60.000 60.000 0 1 0 75.781 255.408 Z" fill="#dbeafe" stroke="#2854c5" stroke-linejoin="round" stroke-width="3">
