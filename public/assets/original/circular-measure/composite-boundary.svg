<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" role="img" aria-labelledby="title desc"><title id="title">Rectangle + semicircle</title><desc id="desc">A width-6 rectangle of height 4 has a semicircle of radius 3 on top. The dashed shared diameter is not an outside edge.</desc><rect width="520" height="440" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#172c43;font-size:17px;paint-order:stroke;stroke:white;stroke-width:3px;stroke-linejoin:round}.small{font-size:14px}</style><text x="260.0000" y="418.0000" text-anchor="middle" class="">Rectangle + semicircle</text><path d="M 140,360 L 380,360 L 380,200 A 120,120 0 0 0 140,200 Z" fill="#d4f0e8" stroke="#174e90" stroke-width="2.5"/><line x1="140.0000" y1="200.0000" x2="380.0000" y2="200.0000" stroke="#8393a7" stroke-width="1.5" stroke-dasharray="6 5"/><circle cx="260.0000" cy="200.0000" r="3.5" fill="#007c78"/><text x="245.0000" y="188.0000" text-anchor="start" class="">O</text><text x="298.0000" y="188.0000" text-anchor="start" class="">r = 3</text><text x="260.0000" y="226.0000" text-anchor="middle" class="small">internal join</text><text x="397.0000" y="288.0000" text-anchor="start" class="">h = 4</text><text x="260.0000" y="388.0000" text-anchor="middle" class="">width = 2r</text></svg>
