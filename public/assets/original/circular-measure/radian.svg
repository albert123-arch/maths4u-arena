<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" role="img" aria-labelledby="title desc"><title id="title">One radian</title><desc id="desc">An arc whose length equals the radius subtends one radian at O.</desc><rect width="520" height="440" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#172c43;font-size:17px;paint-order:stroke;stroke:white;stroke-width:3px;stroke-linejoin:round}.small{font-size:14px}</style><text x="260.0000" y="418.0000" text-anchor="middle" class="">One radian</text><path d="M 120.0000,310.0000 L 380.0000,310.0000 A 260.0000,260.0000 0 0 0 260.4786,91.2175 Z" fill="#f0f7fb" stroke="#174e90" stroke-width="2.5"/><circle cx="120.0000" cy="310.0000" r="3.5" fill="#007c78"/><text x="100.0000" y="328.0000" text-anchor="start" class="">O</text><circle cx="380.0000" cy="310.0000" r="3.5" fill="#007c78"/><text x="388.0000" y="328.0000" text-anchor="start" class="">A</text><circle cx="260.4786" cy="91.2175" r="3.5" fill="#007c78"/><text x="268.4786" y="83.2175" text-anchor="start" class="">B</text><path d="M 162.0000,310.0000 A 42.0000,42.0000 0 0 0 142.6927,274.6582" fill="none" stroke="#9d3a58" stroke-width="1.8"/><path d="M 380.0000,310.0000 A 260.0000,260.0000 0 0 0 260.4786,91.2175" fill="none" stroke="#007c78" stroke-width="4"/><text x="235.0000" y="334.0000" text-anchor="start" class="">r</text><text x="370.0000" y="165.0000" text-anchor="middle" class="">arc length = r</text><text x="170.0000" y="283.0000" text-anchor="start" class="">1 rad</text></svg>
