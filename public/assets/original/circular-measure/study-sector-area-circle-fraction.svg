   </text>
   <line stroke="#17243b" stroke-width="1.4" x1="356.42" x2="381.90" y1="154.50" y2="154.50">
   </line>
   <text fill="#17243b" font-size="17.16" font-weight="normal" text-anchor="middle" x="369.16" y="170.12">
