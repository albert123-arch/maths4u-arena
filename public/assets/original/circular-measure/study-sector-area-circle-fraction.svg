  </text>
  <text fill="#17243b" font-size="21" font-weight="normal" text-anchor="start" x="322" y="188">
   A
  </text>
  <text fill="#17243b" font-size="21" font-weight="normal" text-anchor="start" x="63" y="115">
   B
  </text>
  <text fill="#17243b" font-size="21" font-weight="normal" text-anchor="start" x="235" y="207">
   8 cm
  </text>
  <text fill="#17243b" font-size="22" font-weight="bold" text-anchor="start" x="355" y="123">
