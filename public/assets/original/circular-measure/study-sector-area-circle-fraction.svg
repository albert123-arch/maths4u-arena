<svg aria-labelledby="figure-7-title figure-7-desc" font-family="Inter, Arial, sans-serif" height="340" role="img" viewBox="0 0 560 340" width="560" xmlns="http://www.w3.org/2000/svg">
 <title id="figure-7-title">
  The fraction occupied by a sector
 </title>
 <desc id="figure-7-desc">
  A circle of radius 8 cm contains a shaded 150-degree sector. The angle is 5π/6 radians and the shaded region is five twelfths of the disk, with area 80π/3 square centimetres.
 </desc>
 <rect fill="#f5f8ff" height="338" rx="16" stroke="#dce4f1" stroke-width="2" width="558" x="1" y="1">
 </rect>
