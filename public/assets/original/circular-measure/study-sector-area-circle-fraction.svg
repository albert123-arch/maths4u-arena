  <text fill="#17243b" font-size="24" font-weight="bold" text-anchor="middle" x="280" y="34">
   A sector is a fraction of its circle
  </text>
  <circle cx="190" cy="180" fill="#ffffff" r="120" stroke="#c9d4e7" stroke-width="2.5">
  </circle>
  <path d="M190.000 180.000 L310.000 180.000 A120.000 120.000 0 0 0 86.077 120.000 Z" fill="#dbeafe" stroke="#2854c5" stroke-linejoin="round" stroke-width="3">
  </path>
  <path d="M226.000 180.000 A36.000 36.000 0 0 0 158.823 162.000" fill="none" stroke="#2854c5" stroke-width="2.5">
  </path>
  <g aria-label="5π/6">
