   </text>
   <text fill="#17243b" font-size="22.00" font-weight="normal" text-anchor="start" x="383.32" y="160.00">
    of the
   </text>
  </g>
  <text fill="#17243b" font-size="22" font-weight="normal" text-anchor="start" x="355" y="190">
   circle area
  </text>
  <g aria-label="80π/3 cm²">
