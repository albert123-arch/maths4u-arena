<title id="title">Accumulate a signed rate</title><desc id="desc">Rate q(t)=4−t is positive up to t=4 and negative afterwards on [0,6]. Its signed pieces are +8 and −2. From initial amount 10, final amount is 16 and the maximum amount is 18 at t=4.</desc>
