<svg xmlns="http://www.w3.org/2000/svg" width="520" height="440" viewBox="0 0 520 440" role="img" aria-labelledby="title desc">
<title id="title">Pascal coefficients: rows 0 to 5</title><desc id="desc">The first six Pascal rows. Row n has n+1 entries. Each interior number is the sum of the two above it.</desc>
<rect width="520" height="440" rx="14" fill="#f5f9ff"/><g font-family="Arial, sans-serif">
<text x="24" y="35" font-size="20" text-anchor="start" fill="#243b53">Pascal coefficients: rows 0 to 5</text><text x="26" y="76" font-size="15" text-anchor="start" fill="#243b53">n</text><text x="290" y="76" font-size="16" text-anchor="middle" fill="#243b53">Coefficients of (1 + x)ⁿ</text><text x="26" y="112" font-size="16" text-anchor="start" fill="#243b53">0</text><text data-n="0" data-r="0" data-coefficient="1" x="290.0" y="112" text-anchor="middle" font-size="21" fill="#1961ac">1</text><text x="26" y="160" font-size="16" text-anchor="start" fill="#243b53">1</text><text data-n="1" data-r="0" data-coefficient="1" x="264.0" y="160" text-anchor="middle" font-size="21" fill="#1961ac">1</text><text data-n="1" data-r="1" data-coefficient="1" x="316.0" y="160" text-anchor="middle" font-size="21" fill="#1961ac">1</text><text x="26" y="208" font-size="16" text-anchor="start" fill="#243b53">2</text><text data-n="2" data-r="0" data-coefficient="1" x="238.0" y="208" text-anchor="middle" font-size="21" fill="#1961ac">1</text><text data-n="2" data-r="1" data-coefficient="2" x="290.0" y="208" text-anchor="middle" font-size="21" fill="#1961ac">2</text><text data-n="2" data-r="2" data-coefficient="1" x="342.0" y="208" text-anchor="middle" font-size="21" fill="#1961ac">1</text><text x="26" y="256" font-size="16" text-anchor="start" fill="#243b53">3</text><text data-n="3" data-r="0" data-coefficient="1" x="212.0" y="256" text-anchor="middle" font-size="21" fill="#1961ac">1</text><text data-n="3" data-r="1" data-coefficient="3" x="264.0" y="256" text-anchor="middle" font-size="21" fill="#1961ac">3</text><text data-n="3" data-r="2" data-coefficient="3" x="316.0" y="256" text-anchor="middle" font-size="21" fill="#1961ac">3</text><text data-n="3" data-r="3" data-coefficient="1" x="368.0" y="256" text-anchor="middle" font-size="21" fill="#1961ac">1</text><text x="26" y="304" font-size="16" text-anchor="start" fill="#243b53">4</text><text data-n="4" data-r="0" data-coefficient="1" x="186.0" y="304" text-anchor="middle" font-size="21" fill="#1961ac">1</text><text data-n="4" data-r="1" data-coefficient="4" x="238.0" y="304" text-anchor="middle" font-size="21" fill="#1961ac">4</text><text data-n="4" data-r="2" data-coefficient="6" x="290.0" y="304" text-anchor="middle" font-size="21" fill="#1961ac">6</text><text data-n="4" data-r="3" data-coefficient="4" x="342.0" y="304" text-anchor="middle" font-size="21" fill="#1961ac">4</text><text data-n="4" data-r="4" data-coefficient="1" x="394.0" y="304" text-anchor="middle" font-size="21" fill="#1961ac">1</text><text x="26" y="352" font-size="16" text-anchor="start" fill="#243b53">5</text><text data-n="5" data-r="0" data-coefficient="1" x="160.0" y="352" text-anchor="middle" font-size="21" fill="#1961ac">1</text><text data-n="5" data-r="1" data-coefficient="5" x="212.0" y="352" text-anchor="middle" font-size="21" fill="#1961ac">5</text><text data-n="5" data-r="2" data-coefficient="10" x="264.0" y="352" text-anchor="middle" font-size="21" fill="#1961ac">10</text><text data-n="5" data-r="3" data-coefficient="10" x="316.0" y="352" text-anchor="middle" font-size="21" fill="#1961ac">10</text><text data-n="5" data-r="4" data-coefficient="5" x="368.0" y="352" text-anchor="middle" font-size="21" fill="#1961ac">5</text><text data-n="5" data-r="5" data-coefficient="1" x="420.0" y="352" text-anchor="middle" font-size="21" fill="#1961ac">1</text><text x="24" y="410" font-size="14" text-anchor="start" fill="#243b53">These are choice counts; signs come from the terms.</text></g></svg>
