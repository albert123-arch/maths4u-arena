<svg xmlns="http://www.w3.org/2000/svg" width="520" height="440" viewBox="0 0 520 440" role="img" aria-labelledby="title desc">
<title id="title">Collect every power pair</title><desc id="desc">Three contributions to x² are 9,24,6, totalling 39. Powers in each pair add to 2.</desc>
<rect width="520" height="440" rx="14" fill="#f5f9ff"/><g font-family="Arial, sans-serif">
<text x="24" y="35" font-size="20" text-anchor="start" fill="#243b53">Collect every power pair</text><text x="260" y="74" font-size="18" text-anchor="middle" fill="#243b53">Coefficient of x² in (1 + x)⁴(1 + 3x)²</text><text x="115" y="124" font-size="15" text-anchor="middle" fill="#243b53">Power pair</text><text x="280" y="124" font-size="15" text-anchor="middle" fill="#243b53">Contribution</text><text x="425" y="124" font-size="15" text-anchor="middle" fill="#243b53">Value</text><line x1="42.00000" y1="192.00000" x2="478.00000" y2="192.00000" stroke="#d9e3ef" stroke-width="1.5"/><text x="115" y="180" font-size="18" text-anchor="middle" fill="#243b53">0 + 2</text><text x="280" y="180" font-size="18" text-anchor="middle" fill="#243b53">1 × 9</text><text x="425" y="180" font-size="18" text-anchor="middle" fill="#243b53">9</text><line x1="42.00000" y1="248.00000" x2="478.00000" y2="248.00000" stroke="#d9e3ef" stroke-width="1.5"/><text x="115" y="236" font-size="18" text-anchor="middle" fill="#243b53">1 + 1</text><text x="280" y="236" font-size="18" text-anchor="middle" fill="#243b53">4 × 6</text><text x="425" y="236" font-size="18" text-anchor="middle" fill="#243b53">24</text><line x1="42.00000" y1="304.00000" x2="478.00000" y2="304.00000" stroke="#d9e3ef" stroke-width="1.5"/><text x="115" y="292" font-size="18" text-anchor="middle" fill="#243b53">2 + 0</text><text x="280" y="292" font-size="18" text-anchor="middle" fill="#243b53">6 × 1</text><text x="425" y="292" font-size="18" text-anchor="middle" fill="#243b53">6</text><text x="260" y="343" font-size="25" text-anchor="middle" fill="#1961ac">9 + 24 + 6 = 39</text><text x="24" y="410" font-size="14" text-anchor="start" fill="#243b53">Include the mixed pair (1, 1).</text></g></svg>
