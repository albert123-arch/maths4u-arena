<svg xmlns="http://www.w3.org/2000/svg" width="520" height="440" viewBox="0 0 520 440" role="img" aria-labelledby="title desc">
<title id="title">Even powers leave two branches</title><desc id="desc">An x² coefficient of 60 in (1+kx)^6 gives k=±2. The corresponding x³ coefficients are −160 and 160.</desc>
<rect width="520" height="440" rx="14" fill="#f5f9ff"/><g font-family="Arial, sans-serif">
<text x="24" y="35" font-size="20" text-anchor="start" fill="#243b53">Even powers leave two branches</text><text x="260" y="83" font-size="21" text-anchor="middle" fill="#243b53">In (1 + kx)⁶:  15k² = 60</text><text x="260" y="126" font-size="24" text-anchor="middle" fill="#243b53">k² = 4</text><line x1="260.00000" y1="143.00000" x2="144.00000" y2="185.00000" stroke="#1961ac" stroke-width="1.5"/><line x1="260.00000" y1="143.00000" x2="376.00000" y2="185.00000" stroke="#1961ac" stroke-width="1.5"/><rect x="57" y="191" width="174" height="107" rx="10" fill="#dbeafe"/><text x="144" y="226" font-size="23" text-anchor="middle" fill="#243b53">k = -2</text><text x="144" y="269" font-size="16" text-anchor="middle" fill="#243b53">x³ coefficient: -160</text><rect x="289" y="191" width="174" height="107" rx="10" fill="#dbeafe"/><text x="376" y="226" font-size="23" text-anchor="middle" fill="#243b53">k = 2</text><text x="376" y="269" font-size="16" text-anchor="middle" fill="#243b53">x³ coefficient: 160</text><text x="260" y="344" font-size="17" text-anchor="middle" fill="#243b53">Both signs satisfy the x² information.</text><text x="260" y="374" font-size="16" text-anchor="middle" fill="#243b53">A negative x³ coefficient selects k = −2.</text><text x="24" y="410" font-size="14" text-anchor="start" fill="#243b53">Extra sign information can choose one branch.</text></g></svg>
