<svg xmlns="http://www.w3.org/2000/svg" width="520" height="440" viewBox="0 0 520 440" role="img" aria-labelledby="title desc">
<title id="title">Find a zero exponent</title><desc id="desc">The seven successive powers are 12,9,6,3,0,−3,−6; index r=4 gives the constant fifth term.</desc>
<rect width="520" height="440" rx="14" fill="#f5f9ff"/><g font-family="Arial, sans-serif">
<text x="24" y="35" font-size="20" text-anchor="start" fill="#243b53">Find a zero exponent</text><text x="260" y="73" font-size="19" text-anchor="middle" fill="#243b53">(x² + x⁻¹)⁶,  with x ≠ 0</text><text x="110" y="107" font-size="15" text-anchor="middle" fill="#243b53">Index r</text><text x="270" y="107" font-size="15" text-anchor="middle" fill="#243b53">Power 12 − 3r</text><text x="422" y="107" font-size="15" text-anchor="middle" fill="#243b53">Term number</text><line x1="42.00000" y1="153.00000" x2="478.00000" y2="153.00000" stroke="#d9e3ef" stroke-width="1.5"/><text x="110" y="141" font-size="18" text-anchor="middle" fill="#243b53">0</text><text x="270" y="141" font-size="18" text-anchor="middle" fill="#243b53">12</text><text x="422" y="141" font-size="18" text-anchor="middle" fill="#243b53">1</text><line x1="42.00000" y1="187.00000" x2="478.00000" y2="187.00000" stroke="#d9e3ef" stroke-width="1.5"/><text x="110" y="175" font-size="18" text-anchor="middle" fill="#243b53">1</text><text x="270" y="175" font-size="18" text-anchor="middle" fill="#243b53">9</text><text x="422" y="175" font-size="18" text-anchor="middle" fill="#243b53">2</text><line x1="42.00000" y1="221.00000" x2="478.00000" y2="221.00000" stroke="#d9e3ef" stroke-width="1.5"/><text x="110" y="209" font-size="18" text-anchor="middle" fill="#243b53">2</text><text x="270" y="209" font-size="18" text-anchor="middle" fill="#243b53">6</text><text x="422" y="209" font-size="18" text-anchor="middle" fill="#243b53">3</text><line x1="42.00000" y1="255.00000" x2="478.00000" y2="255.00000" stroke="#d9e3ef" stroke-width="1.5"/><text x="110" y="243" font-size="18" text-anchor="middle" fill="#243b53">3</text><text x="270" y="243" font-size="18" text-anchor="middle" fill="#243b53">3</text><text x="422" y="243" font-size="18" text-anchor="middle" fill="#243b53">4</text><rect x="42" y="252" width="436" height="34" rx="7" fill="#dbeafe"/><line x1="42.00000" y1="289.00000" x2="478.00000" y2="289.00000" stroke="#d9e3ef" stroke-width="1.5"/><text x="110" y="277" font-size="18" text-anchor="middle" fill="#243b53">4</text><text x="270" y="277" font-size="18" text-anchor="middle" fill="#243b53">0</text><text x="422" y="277" font-size="18" text-anchor="middle" fill="#243b53">5</text><line x1="42.00000" y1="323.00000" x2="478.00000" y2="323.00000" stroke="#d9e3ef" stroke-width="1.5"/><text x="110" y="311" font-size="18" text-anchor="middle" fill="#243b53">5</text><text x="270" y="311" font-size="18" text-anchor="middle" fill="#243b53">-3</text><text x="422" y="311" font-size="18" text-anchor="middle" fill="#243b53">6</text><line x1="42.00000" y1="357.00000" x2="478.00000" y2="357.00000" stroke="#d9e3ef" stroke-width="1.5"/><text x="110" y="345" font-size="18" text-anchor="middle" fill="#243b53">6</text><text x="270" y="345" font-size="18" text-anchor="middle" fill="#243b53">-6</text><text x="422" y="345" font-size="18" text-anchor="middle" fill="#243b53">7</text><text x="260" y="382" font-size="17" text-anchor="middle" fill="#1961ac">Constant term: r = 4, fifth term</text><text x="24" y="410" font-size="14" text-anchor="start" fill="#243b53">Zero exponent does not mean substituting x = 0.</text></g></svg>
