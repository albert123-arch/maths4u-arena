<svg xmlns="http://www.w3.org/2000/svg" width="520" height="440" viewBox="0 0 520 440" role="img" aria-labelledby="title desc">
<title id="title">Index and term number differ</title><desc id="desc">For (a+bx)^5, r=0 to 5 corresponds to term numbers 1 to 6 and x powers 0 to 5.</desc>
<rect width="520" height="440" rx="14" fill="#f5f9ff"/><g font-family="Arial, sans-serif">
<text x="24" y="35" font-size="20" text-anchor="start" fill="#243b53">Index and term number differ</text><text x="260" y="72" font-size="18" text-anchor="middle" fill="#243b53">General term of (a + bx)⁵</text><text x="110" y="104" font-size="15" text-anchor="middle" fill="#243b53">Term number</text><text x="260" y="104" font-size="15" text-anchor="middle" fill="#243b53">Index r</text><text x="410" y="104" font-size="15" text-anchor="middle" fill="#243b53">Power of x</text><line x1="42.00000" y1="153.00000" x2="478.00000" y2="153.00000" stroke="#d9e3ef" stroke-width="1.5"/><text x="110" y="141" font-size="18" text-anchor="middle" fill="#243b53">1</text><text x="260" y="141" font-size="18" text-anchor="middle" fill="#243b53">0</text><text x="410" y="141" font-size="18" text-anchor="middle" fill="#243b53">0</text><line x1="42.00000" y1="190.00000" x2="478.00000" y2="190.00000" stroke="#d9e3ef" stroke-width="1.5"/><text x="110" y="178" font-size="18" text-anchor="middle" fill="#243b53">2</text><text x="260" y="178" font-size="18" text-anchor="middle" fill="#243b53">1</text><text x="410" y="178" font-size="18" text-anchor="middle" fill="#243b53">1</text><line x1="42.00000" y1="227.00000" x2="478.00000" y2="227.00000" stroke="#d9e3ef" stroke-width="1.5"/><text x="110" y="215" font-size="18" text-anchor="middle" fill="#243b53">3</text><text x="260" y="215" font-size="18" text-anchor="middle" fill="#243b53">2</text><text x="410" y="215" font-size="18" text-anchor="middle" fill="#243b53">2</text><line x1="42.00000" y1="264.00000" x2="478.00000" y2="264.00000" stroke="#d9e3ef" stroke-width="1.5"/><text x="110" y="252" font-size="18" text-anchor="middle" fill="#243b53">4</text><text x="260" y="252" font-size="18" text-anchor="middle" fill="#243b53">3</text><text x="410" y="252" font-size="18" text-anchor="middle" fill="#243b53">3</text><line x1="42.00000" y1="301.00000" x2="478.00000" y2="301.00000" stroke="#d9e3ef" stroke-width="1.5"/><text x="110" y="289" font-size="18" text-anchor="middle" fill="#243b53">5</text><text x="260" y="289" font-size="18" text-anchor="middle" fill="#243b53">4</text><text x="410" y="289" font-size="18" text-anchor="middle" fill="#243b53">4</text><line x1="42.00000" y1="338.00000" x2="478.00000" y2="338.00000" stroke="#d9e3ef" stroke-width="1.5"/><text x="110" y="326" font-size="18" text-anchor="middle" fill="#243b53">6</text><text x="260" y="326" font-size="18" text-anchor="middle" fill="#243b53">5</text><text x="410" y="326" font-size="18" text-anchor="middle" fill="#243b53">5</text><text x="260" y="376" font-size="17" text-anchor="middle" fill="#243b53">Tᵣ₊₁ uses r copies of bx.</text><text x="24" y="410" font-size="14" text-anchor="start" fill="#243b53">The fourth term uses r = 3, not r = 4.</text></g></svg>
