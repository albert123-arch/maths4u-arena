<svg xmlns="http://www.w3.org/2000/svg" width="640" height="350" viewBox="0 0 640 350" role="img" aria-labelledby="title desc"><title id="title">Group sizes 4 and 6 weight means 10 and 20 to a combined mean of 16.</title><desc id="desc">Group sizes 4 and 6 weight means 10 and 20 to a combined mean of 16.</desc><rect width="640" height="350" fill="white"/><g font-family="Arial, sans-serif" font-size="16" fill="#172033"><line x1="60" y1="250" x2="580" y2="250" stroke="#172033" stroke-width="2"/><text x="320" y="325" text-anchor="middle">Observed-value scale</text><line x1="60" y1="245" x2="60" y2="255" stroke="#172033" stroke-width="2"/><text x="60" y="285" text-anchor="middle">0</text><line x1="160" y1="245" x2="160" y2="255" stroke="#172033" stroke-width="2"/><text x="160" y="285" text-anchor="middle">5</text><line x1="260" y1="245" x2="260" y2="255" stroke="#172033" stroke-width="2"/><text x="260" y="285" text-anchor="middle">10</text><line x1="360" y1="245" x2="360" y2="255" stroke="#172033" stroke-width="2"/><text x="360" y="285" text-anchor="middle">15</text><line x1="460" y1="245" x2="460" y2="255" stroke="#172033" stroke-width="2"/><text x="460" y="285" text-anchor="middle">20</text><line x1="560" y1="245" x2="560" y2="255" stroke="#172033" stroke-width="2"/><text x="560" y="285" text-anchor="middle">25</text><line x1="260" y1="100" x2="260" y2="240" stroke="#2457d6" stroke-width="2"/><text x="260" y="90" text-anchor="middle">Group A: mean 10, n = 4</text><line x1="460" y1="150" x2="460" y2="240" stroke="#2457d6" stroke-width="2"/><text x="460" y="140" text-anchor="middle">Group B: mean 20, n = 6</text><line x1="380" y1="205" x2="380" y2="240" stroke="#2457d6" stroke-width="2"/><text x="380" y="195" text-anchor="middle">Combined mean 16</text></g></svg>