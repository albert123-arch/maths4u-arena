<svg xmlns="http://www.w3.org/2000/svg" width="520" height="440" viewBox="0 0 520 440" role="img" aria-labelledby="title desc">
<title id="title">Geometry rate × input rate</title><desc id="desc">A schematic sphere illustrates the radius. Volume derivative with respect to radius is 4πr². Multiplying by dr/dt gives the volume time rate. At r=2 cm and dr/dt=0.1 cm/s it is 1.6π cm³/s.</desc>
<rect width="520" height="440" rx="14" fill="#f5f9ff"/><g font-family="Arial, sans-serif">
<text x="24" y="35" font-size="20" text-anchor="start" fill="#243b53">Geometry rate × input rate</text><circle cx="168" cy="188" r="78" fill="#dbeafe" stroke="#1961ac" stroke-width="2"/><ellipse cx="168" cy="188" rx="78" ry="23" fill="none" stroke="#1961ac" stroke-dasharray="5 4"/><line x1="168.000000" y1="188.000000" x2="246.000000" y2="188.000000" stroke="#1961ac" stroke-width="1.5"/><line x1="237.000000" y1="182.000000" x2="246.000000" y2="188.000000" stroke="#1961ac" stroke-width="1.5"/><line x1="237.000000" y1="194.000000" x2="246.000000" y2="188.000000" stroke="#1961ac" stroke-width="1.5"/><text x="205" y="176" font-size="21" text-anchor="middle" fill="#243b53">r</text><text x="282" y="131" font-size="19" text-anchor="start" fill="#243b53">V = 4πr³ / 3</text><text x="282" y="177" font-size="18" text-anchor="start" fill="#243b53">dV/dr = 4πr²</text><text x="282" y="224" font-size="18" text-anchor="start" fill="#243b53">dV/dt =</text><text x="282" y="251" font-size="18" text-anchor="start" fill="#243b53">4πr² × dr/dt</text><text x="260" y="314" font-size="18" text-anchor="middle" fill="#243b53">At r = 2 cm, dr/dt = 0.1 cm/s:</text><text x="260" y="355" font-size="22" text-anchor="middle" fill="#1961ac">dV/dt = 1.6π cm³/s</text><text x="24" y="410" font-size="14" text-anchor="start" fill="#243b53">Track the quantity and its units at each step.</text></g></svg>
