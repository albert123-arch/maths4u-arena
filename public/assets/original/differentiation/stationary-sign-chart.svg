<svg xmlns="http://www.w3.org/2000/svg" width="520" height="440" viewBox="0 0 520 440" role="img" aria-labelledby="title desc">
<title id="title">Derivative signs classify turning points</title><desc id="desc">For f=x³−3x, derivative signs are positive before −1, negative between −1 and 1, and positive after 1. There is a local maximum at (−1,2) and local minimum at (1,−2).</desc>
<rect width="520" height="440" rx="14" fill="#f5f9ff"/><g font-family="Arial, sans-serif">
<text x="24" y="35" font-size="20" text-anchor="start" fill="#243b53">Derivative signs classify turning points</text><text x="260" y="79" font-size="21" text-anchor="middle" fill="#243b53">f(x) = x³ − 3x</text><text x="260" y="114" font-size="18" text-anchor="middle" fill="#243b53">f′(x) = 3(x + 1)(x − 1)</text><line x1="86.000000" y1="160.000000" x2="470.000000" y2="160.000000" stroke="#8799ad" stroke-width="1.5"/><line x1="190.000000" y1="151.000000" x2="190.000000" y2="168.000000" stroke="#1961ac" stroke-width="1.5"/><text x="190" y="191" font-size="17" text-anchor="middle" fill="#243b53">−1</text><line x1="350.000000" y1="151.000000" x2="350.000000" y2="168.000000" stroke="#1961ac" stroke-width="1.5"/><text x="350" y="191" font-size="17" text-anchor="middle" fill="#243b53">1</text><text x="24" y="230" font-size="19" text-anchor="start" fill="#243b53">f′:</text><text x="24" y="282" font-size="19" text-anchor="start" fill="#243b53">f:</text><text x="135" y="230" font-size="28" text-anchor="middle" fill="#243b53">+</text><text x="135" y="285" font-size="36" text-anchor="middle" fill="#1961ac">↗</text><text x="270" y="230" font-size="28" text-anchor="middle" fill="#243b53">−</text><text x="270" y="285" font-size="36" text-anchor="middle" fill="#1961ac">↘</text><text x="416" y="230" font-size="28" text-anchor="middle" fill="#243b53">+</text><text x="416" y="285" font-size="36" text-anchor="middle" fill="#1961ac">↗</text><text x="152" y="339" font-size="17" text-anchor="middle" fill="#243b53">Local maximum</text><text x="152" y="372" font-size="20" text-anchor="middle" fill="#1961ac">(−1, 2)</text><text x="366" y="339" font-size="17" text-anchor="middle" fill="#243b53">Local minimum</text><text x="366" y="372" font-size="20" text-anchor="middle" fill="#1961ac">(1, −2)</text><text x="24" y="410" font-size="14" text-anchor="start" fill="#243b53">A sign change matters; f′ = 0 alone is insufficient.</text></g></svg>
