<svg xmlns="http://www.w3.org/2000/svg" width="520" height="440" viewBox="0 0 520 440" role="img" aria-labelledby="title desc">
<title id="title">From a secant to a tangent</title><desc id="desc">On y=x², the secant through P(1,1) and Q(2,4) has slope 3. The tangent at P has slope 2. These are distinct lines; the tangent slope is the limit as the second point approaches P.</desc>
