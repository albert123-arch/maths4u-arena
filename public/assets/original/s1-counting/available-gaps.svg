<svg xmlns="http://www.w3.org/2000/svg" width="640" height="350" viewBox="0 0 640 350" role="img" aria-labelledby="title desc"><title id="title">Four ordered distinct objects create five gaps, including both ends. Two identical reds must choose two distinct gaps to stay separated.</title><desc id="desc">Four ordered distinct objects create five gaps, including both ends. Two identical reds must choose two distinct gaps to stay separated.</desc><rect width="640" height="350" fill="white"/><g font-family="Arial, sans-serif" fill="#172033"><text x="320" y="35" text-anchor="middle" font-size="20">Four distinct objects leave five gaps</text><rect x="135" y="135" width="65" height="55" rx="6" fill="#dbeafe" stroke="#172033" stroke-width="2"/><text x="167.5" y="170" text-anchor="middle" font-size="24">1</text><rect x="245" y="135" width="65" height="55" rx="6" fill="#dbeafe" stroke="#172033" stroke-width="2"/><text x="277.5" y="170" text-anchor="middle" font-size="24">2</text><rect x="355" y="135" width="65" height="55" rx="6" fill="#dbeafe" stroke="#172033" stroke-width="2"/><text x="387.5" y="170" text-anchor="middle" font-size="24">3</text><rect x="465" y="135" width="65" height="55" rx="6" fill="#dbeafe" stroke="#172033" stroke-width="2"/><text x="497.5" y="170" text-anchor="middle" font-size="24">4</text><text x="105" y="95" text-anchor="middle" font-size="16">Gap 1</text><circle cx="105" cy="165" r="7" fill="#a1540b"/><text x="222" y="95" text-anchor="middle" font-size="16">Gap 2</text><circle cx="222" cy="165" r="7" fill="#a1540b"/><text x="332" y="95" text-anchor="middle" font-size="16">Gap 3</text><circle cx="332" cy="165" r="7" fill="#a1540b"/><text x="442" y="95" text-anchor="middle" font-size="16">Gap 4</text><circle cx="442" cy="165" r="7" fill="#a1540b"/><text x="545" y="95" text-anchor="middle" font-size="16">Gap 5</text><circle cx="545" cy="165" r="7" fill="#a1540b"/><text x="320" y="255" text-anchor="middle" font-size="20">Choose two different gaps for two identical reds</text><text x="320" y="305" text-anchor="middle" font-size="20">4! × C(5, 2) = 240 separated arrangements</text></g></svg>