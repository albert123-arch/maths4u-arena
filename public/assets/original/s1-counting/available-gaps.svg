<svg xmlns="http://www.w3.org/2000/svg" width="620" height="130" viewBox="0 0 620 130" role="img" aria-labelledby="title desc">
<title id="title">Five gaps around four objects</title>
<desc id="desc">One gap is before the first counter, three are between neighbouring counters and one is after the final counter.</desc>
<rect width="620" height="130" rx="14" fill="#f6f9fc"/>
<g font-family="Arial,sans-serif">
<circle cx="55" cy="77" r="6" fill="#b26b16"/>
<text x="55" y="42" fill="#233750" font-size="19" text-anchor="middle">Gap 1</text>
<circle cx="183" cy="77" r="6" fill="#b26b16"/>
<text x="183" y="42" fill="#233750" font-size="19" text-anchor="middle">Gap 2</text>
<circle cx="311" cy="77" r="6" fill="#b26b16"/>
<text x="311" y="42" fill="#233750" font-size="19" text-anchor="middle">Gap 3</text>
<circle cx="439" cy="77" r="6" fill="#b26b16"/>
<text x="439" y="42" fill="#233750" font-size="19" text-anchor="middle">Gap 4</text>
<circle cx="567" cy="77" r="6" fill="#b26b16"/>
<text x="567" y="42" fill="#233750" font-size="19" text-anchor="middle">Gap 5</text>
<rect x="90" y="52" width="58" height="50" rx="6" fill="#2459ac" fill-opacity=".13" stroke="#2459ac" stroke-width="2"/>
<text x="119" y="85" fill="#233750" font-size="22" text-anchor="middle">1</text>
<rect x="218" y="52" width="58" height="50" rx="6" fill="#2459ac" fill-opacity=".13" stroke="#2459ac" stroke-width="2"/>
<text x="247" y="85" fill="#233750" font-size="22" text-anchor="middle">2</text>
<rect x="346" y="52" width="58" height="50" rx="6" fill="#2459ac" fill-opacity=".13" stroke="#2459ac" stroke-width="2"/>
<text x="375" y="85" fill="#233750" font-size="22" text-anchor="middle">3</text>
<rect x="474" y="52" width="58" height="50" rx="6" fill="#2459ac" fill-opacity=".13" stroke="#2459ac" stroke-width="2"/>
<text x="503" y="85" fill="#233750" font-size="22" text-anchor="middle">4</text>
</g>
</svg>
