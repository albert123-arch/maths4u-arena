<svg xmlns="http://www.w3.org/2000/svg" width="640" height="350" viewBox="0 0 640 350" role="img" aria-labelledby="title desc"><title id="title">The two triples ABC and DEF form the same unnamed division when their display order is swapped. Named teams would distinguish the two orders.</title><desc id="desc">The two triples ABC and DEF form the same unnamed division when their display order is swapped. Named teams would distinguish the two orders.</desc><rect width="640" height="350" fill="white"/><g font-family="Arial, sans-serif" fill="#172033"><text x="320" y="35" text-anchor="middle" font-size="20">Swapping unnamed teams gives the same division</text><rect x="95" y="90" width="180" height="55" rx="6" fill="#dbeafe" stroke="#172033" stroke-width="2"/><text x="185.0" y="125" text-anchor="middle" font-size="24">A B C</text><rect x="365" y="90" width="180" height="55" rx="6" fill="#ffedd5" stroke="#172033" stroke-width="2"/><text x="455.0" y="125" text-anchor="middle" font-size="24">D E F</text><rect x="95" y="215" width="180" height="55" rx="6" fill="#ffedd5" stroke="#172033" stroke-width="2"/><text x="185.0" y="250" text-anchor="middle" font-size="24">D E F</text><rect x="365" y="215" width="180" height="55" rx="6" fill="#dbeafe" stroke="#172033" stroke-width="2"/><text x="455.0" y="250" text-anchor="middle" font-size="24">A B C</text><text x="320" y="190" text-anchor="middle" font-size="20">Same memberships</text><text x="320" y="325" text-anchor="middle" font-size="20">20 named allocations ÷ 2! = 10 unnamed divisions</text></g></svg>