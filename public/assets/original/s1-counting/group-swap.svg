<svg xmlns="http://www.w3.org/2000/svg" width="620" height="158" viewBox="0 0 620 158" role="img" aria-labelledby="title desc">
<title id="title">Exchanging the display order of two teams</title>
<desc id="desc">Blue always contains A, B and C. Orange always contains D, E and F. Changing which is drawn first does not change membership.</desc>
<rect width="620" height="158" rx="14" fill="#f6f9fc"/>
<g font-family="Arial,sans-serif">
<rect x="100" y="28" width="155" height="42" rx="6" fill="#2459ac" fill-opacity=".13" stroke="#2459ac" stroke-width="2"/>
<text x="177" y="55" fill="#233750" font-size="22" text-anchor="middle">A B C</text>
<rect x="375" y="28" width="155" height="42" rx="6" fill="#b26b16" fill-opacity=".13" stroke="#b26b16" stroke-width="2"/>
<text x="452" y="55" fill="#233750" font-size="22" text-anchor="middle">D E F</text>
<rect x="100" y="92" width="155" height="42" rx="6" fill="#b26b16" fill-opacity=".13" stroke="#b26b16" stroke-width="2"/>
<text x="177" y="119" fill="#233750" font-size="22" text-anchor="middle">D E F</text>
<rect x="375" y="92" width="155" height="42" rx="6" fill="#2459ac" fill-opacity=".13" stroke="#2459ac" stroke-width="2"/>
<text x="452" y="119" fill="#233750" font-size="22" text-anchor="middle">A B C</text>
</g>
</svg>
