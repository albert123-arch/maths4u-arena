eight="55" rx="6" fill="#ffffff" stroke="#172033" stroke-width="2"/><text x="407.5" y="235" text-anchor="middle" font-size="24">E</text><rect x="455" y="200" width="65" height="55" rx="6" fill="#ffffff" stroke="#172033" stroke-width="2"/><text x="487.5" y="235" text-anchor="middle" font-size="24">F</text><text x="320" y="315" text-anchor="middle" font-size="20">Adjacent A and B: 2 × 5! = 240</text></g></svg>