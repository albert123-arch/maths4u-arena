<svg xmlns="http://www.w3.org/2000/svg" width="640" height="350" viewBox="0 0 640 350" role="img" aria-labelledby="title desc"><title id="title">The unit-width strip for the count X=40 runs from Y=39.5 to Y=40.5 in the continuous approximation.</title><desc id="desc">The unit-width strip for the count X=40 runs from Y=39.5 to Y=40.5 in the continuous approximation.</desc><rect width="640" height="350" fill="white"/><g font-family="Arial, sans-serif" fill="#172033"><text x="320" y="32" text-anchor="middle" font-size="19">A count of 40 becomes a continuous strip</text><path d="M55,200 H590" stroke="#172033" stroke-width="2"/><path d="M120,191 V209" stroke="#172033" stroke-width="2"/><text x="120" y="239" text-anchor="middle" font-size="20">38</text><path d="M220,191 V209" stroke="#172033" stroke-width="2"/><text x="220" y="239" text-anchor="middle" font-size="20">39</text><path d="M320,191 V209" stroke="#172033" stroke-width="2"/><text x="320" y="239" text-anchor="middle" font-size="20">40</text><path d="M420,191 V209" stroke="#172033" stroke-width="2"/><text x="420" y="239" text-anchor="middle" font-size="20">41</text><path d="M520,191 V209" stroke="#172033" stroke-width="2"/><text x="520" y="239" text-anchor="middle" font-size="20">42</text><rect x="270" y="95" width="100" height="105" fill="#dbeafe" stroke="#173b70" stroke-width="2"/><text x="270" y="278" text-anchor="middle" font-size="18">39.5</text><text x="370" y="278" text-anchor="middle" font-size="18">40.5</text><text x="320" y="327" text-anchor="middle" font-size="17">P(X = 40) is approximated by P(39.5 &lt; Y &lt; 40.5)</text></g></svg>