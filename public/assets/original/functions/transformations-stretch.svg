<svg xmlns="http://www.w3.org/2000/svg" width="480" height="289" viewBox="0 0 480 289" role="img" aria-labelledby="title description">
  <title id="title">The horizontal stretch from f(x) to f(2x)</title>
  <desc id="description">Every x-coordinate is halved, with no change to its y-coordinate. The vertex at (1, 1) moves to (one half, 1).</desc>
  <rect x="1" y="1" width="478" height="287" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <g font-family="Inter, system-ui, sans-serif" font-size="19" fill="#334155">
    <path d="M34 248H423m-8-5 8 5-8 5M195 271V56m-5 8 5-8 5 8" fill="none" stroke="#475569" stroke-width="1.8"/>
    <text x="434" y="254">x</text>
    <text x="178" y="59">y</text>
    <path d="M125 78Q230 282 335 180" fill="none" stroke="#1d4ed8" stroke-width="4"/>
    <path d="M160 78Q212.5 282 265 180" fill="none" stroke="#16726b" stroke-width="4"/>
    <circle cx="125" cy="78" r="5.5" fill="#1d4ed8"/>
    <circle cx="335" cy="180" r="5.5" fill="#f8fafc" stroke="#1d4ed8" stroke-width="3"/>
    <circle cx="160" cy="78" r="5.5" fill="#16726b"/>
    <circle cx="265" cy="180" r="5.5" fill="#f8fafc" stroke="#16726b" stroke-width="3"/>
    <path d="M265 214H230" fill="none" stroke="#7c879b" stroke-width="1.5" stroke-dasharray="4 3"/>
    <circle cx="265" cy="214" r="5.5" fill="#1d4ed8"/>
    <circle cx="230" cy="214" r="5.5" fill="#16726b"/>
    <text x="115" y="78" fill="#1d4ed8" text-anchor="end">(−1, 5)</text>
    <path d="M168 78L199 74" fill="none" stroke="#7c879b" stroke-width="1.5"/>
    <text x="207" y="78" fill="#16726b">(−½, 5)</text>
    <text x="231" y="236" fill="#16726b" text-anchor="middle">(½, 1)</text>
    <text x="273" y="235" fill="#1d4ed8">(1, 1)</text>
    <path d="M123 22h22" fill="none" stroke="#1d4ed8" stroke-width="4"/>
    <text x="153" y="28" fill="#1d4ed8" font-weight="650">f(x)</text>
    <path d="M251 22h22" fill="none" stroke="#16726b" stroke-width="4"/>
    <text x="281" y="28" fill="#16726b" font-weight="650">f(2x)</text>
  </g>
</svg>
