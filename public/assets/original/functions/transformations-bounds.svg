<svg xmlns="http://www.w3.org/2000/svg" width="480" height="362" viewBox="0 0 480 362" role="img" aria-labelledby="title description">
  <title id="title">A restricted parabola after both coordinates are reversed</title>
  <desc id="description">The original included end (−1, 5) becomes (2, −3). The excluded end (2, 2) becomes (−1, 3). The maximum is attained at (0, 5).</desc>
  <rect x="1" y="1" width="478" height="360" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <g font-family="Inter, system-ui, sans-serif" font-size="19" fill="#334155">
    <path d="M39 212H423m-8-5 8 5-8 5M191 328V35m-5 8 5-8 5 8" fill="none" stroke="#475569" stroke-width="1.8"/>
    <text x="434" y="218">x</text>
    <text x="174" y="38">y</text>
    <path d="M259 314Q208 -94 157 110" fill="none" stroke="#16726b" stroke-width="4"/>
    <circle cx="259" cy="314" r="5.5" fill="#16726b"/>
    <circle cx="157" cy="110" r="5.5" fill="#f8fafc" stroke="#16726b" stroke-width="3"/>
    <circle cx="191" cy="42" r="5.5" fill="#16726b"/>
    <text x="149" y="105" text-anchor="end">(−1, 3)</text>
    <text x="206" y="45">(0, 5)</text>
    <text x="269" y="319">(2, −3)</text>
    <path d="M278 55h22" fill="none" stroke="#16726b" stroke-width="4"/>
    <text x="308" y="61" fill="#16726b" font-weight="650">y = 5 − 2x²</text>
  </g>
</svg>
