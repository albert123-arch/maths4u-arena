<svg xmlns="http://www.w3.org/2000/svg" width="480" height="280" viewBox="0 0 480 280" role="img" aria-labelledby="title description">
  <title id="title">The range of a restricted left branch</title>
  <desc id="description">For y equals x minus one squared plus two, the restricted branch has a filled point at minus two, eleven and an open point at zero, three. The vertex at one, two belongs to the discarded part.</desc>
  <rect x="1" y="1" width="478" height="278" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <g font-family="Inter, system-ui, sans-serif" font-size="19" fill="#334155">
    <text x="244" y="29" text-anchor="middle" font-size="22" font-weight="650">y = (x − 1)² + 2</text>
    <path d="M48 228H432m-8-5 8 5-8 5M230 245V43m-5 8 5-8 5 8" stroke="#475569" stroke-width="1.8" fill="none"/>
    <text x="443" y="234">x</text><text x="210" y="45">y</text>
    <path d="M104 228V52H230" fill="none" stroke="#738397" stroke-width="1.5" stroke-dasharray="5 4"/>
    <path d="M230 180Q261.5 196 293 196Q356 196 419 132" fill="none" stroke="#67788b" stroke-width="3" stroke-dasharray="6 5"/>
    <path d="M104 52Q167 148 230 180" fill="none" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round"/>
    <circle cx="104" cy="52" r="5.5" fill="#1d4ed8"/>
    <circle cx="230" cy="180" r="5.5" fill="#f8fafc" stroke="#1d4ed8" stroke-width="3"/>
    <circle cx="293" cy="196" r="4" fill="#67788b"/>
    <text x="94" y="56" text-anchor="end">(−2, 11)</text>
    <text x="242" y="57">11</text>
    <text x="245" y="176">(0, 3)</text>
    <text x="302" y="214" fill="#475569">(1, 2)</text>
    <text x="104" y="253" text-anchor="middle">−2</text>
    <text x="241" y="252">0</text>
  </g>
</svg>
