<svg xmlns="http://www.w3.org/2000/svg" width="480" height="150" viewBox="0 0 480 150" role="img" aria-labelledby="title description">
  <title id="title">Following a function and then its inverse</title>
  <desc id="description">The top arrow maps 2 to 1 under f. The bottom arrow maps 1 to 2 under f inverse.</desc>
  <rect x="1" y="1" width="478" height="148" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="42" y="43" width="85" height="65" rx="13" fill="#dbeafe" stroke="#93b5ee"/>
  <rect x="353" y="43" width="85" height="65" rx="13" fill="#d9f2ef" stroke="#7eb9b2"/>
  <path d="M 145 62 H 333 m -10 -6 10 6 -10 6" fill="none" stroke="#1d4ed8" stroke-width="3" stroke-linejoin="round"/>
  <path d="M 333 89 H 145 m 10 -6 -10 6 10 6" fill="none" stroke="#16726b" stroke-width="3" stroke-linejoin="round"/>
  <g font-family="Inter, system-ui, sans-serif" font-size="27" font-weight="650" text-anchor="middle">
    <text x="84.5" y="85" fill="#1e3a5c">2</text>
    <text x="395.5" y="85" fill="#145a54">1</text>
    <text x="240" y="46" fill="#1d4ed8">f</text>
    <text x="240" y="123" fill="#145a54">f⁻¹</text>
  </g>
</svg>
