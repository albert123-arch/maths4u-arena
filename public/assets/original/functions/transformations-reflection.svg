<svg xmlns="http://www.w3.org/2000/svg" width="480" height="367" viewBox="0 0 480 367" role="img" aria-labelledby="title description">
  <title id="title">Reflecting the same parabola in each axis</title>
  <desc id="description">The vertex (1, 1) reflects to (1, −1) in the x-axis and to (−1, 1) in the y-axis. A hollow endpoint stays hollow after reflection.</desc>
  <rect x="1" y="1" width="478" height="365" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <g font-family="Inter, system-ui, sans-serif" font-size="19" fill="#334155">
    <path d="M44 188H422m-8-5 8 5-8 5M240 334V47m-5 8 5-8 5 8" fill="none" stroke="#475569" stroke-width="1.8"/>
    <text x="433" y="194">x</text>
    <text x="223" y="50">y</text>
    <path d="M194 162H286V214" fill="none" stroke="#7c879b" stroke-width="1.6" stroke-dasharray="5 5"/>
    <path d="M194 58Q263 214 332 136" fill="none" stroke="#1d4ed8" stroke-width="4"/>
    <path d="M194 318Q263 162 332 240" fill="none" stroke="#16726b" stroke-width="4"/>
    <path d="M286 58Q217 214 148 136" fill="none" stroke="#69429a" stroke-width="4"/>
    <circle cx="194" cy="58" r="5.5" fill="#1d4ed8"/>
    <circle cx="332" cy="136" r="5.5" fill="#f8fafc" stroke="#1d4ed8" stroke-width="3"/>
    <circle cx="194" cy="318" r="5.5" fill="#16726b"/>
    <circle cx="332" cy="240" r="5.5" fill="#f8fafc" stroke="#16726b" stroke-width="3"/>
    <circle cx="286" cy="58" r="5.5" fill="#69429a"/>
    <circle cx="148" cy="136" r="5.5" fill="#f8fafc" stroke="#69429a" stroke-width="3"/>
    <circle cx="286" cy="162" r="5.5" fill="#1d4ed8"/>
    <circle cx="286" cy="214" r="5.5" fill="#16726b"/>
    <circle cx="194" cy="162" r="5.5" fill="#69429a"/>
    <text x="190" y="182" fill="#69429a" text-anchor="end">(−1, 1)</text>
    <text x="307" y="179" fill="#1d4ed8">(1, 1)</text>
    <text x="301" y="210" fill="#16726b">(1, −1)</text>
    <path d="M70 22h22" fill="none" stroke="#1d4ed8" stroke-width="4"/>
    <text x="100" y="28" fill="#1d4ed8" font-weight="650">f(x)</text>
    <path d="M193 22h22" fill="none" stroke="#16726b" stroke-width="4"/>
    <text x="223" y="28" fill="#16726b" font-weight="650">−f(x)</text>
    <path d="M319 22h22" fill="none" stroke="#69429a" stroke-width="4"/>
    <text x="349" y="28" fill="#69429a" font-weight="650">f(−x)</text>
  </g>
</svg>
