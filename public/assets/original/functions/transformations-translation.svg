<svg xmlns="http://www.w3.org/2000/svg" width="480" height="330" viewBox="0 0 480 330" role="img" aria-labelledby="title description">
  <title id="title">Moving a parabola right and down</title>
  <desc id="description">The graph of f moves two units right and three down. Its vertex moves from (1, 1) to (3, −2). The closed and open endpoints move by the same vector.</desc>
  <rect x="1" y="1" width="478" height="328" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <g font-family="Inter, system-ui, sans-serif" font-size="19" fill="#334155">
    <path d="M30 211H424m-8-5 8 5-8 5M156 305V51m-5 8 5-8 5 8" fill="none" stroke="#475569" stroke-width="1.8"/>
    <text x="435" y="217">x</text>
    <text x="139" y="54">y</text>
    <path d="M186 181H246V271m-5-9 5 9 5-9" fill="none" stroke="#7c879b" stroke-width="1.8" stroke-dasharray="5 5"/>
    <path d="M126 61Q171 241 216 151" fill="none" stroke="#1d4ed8" stroke-width="4"/>
    <path d="M186 151Q231 331 276 241" fill="none" stroke="#16726b" stroke-width="4"/>
    <circle cx="126" cy="61" r="5.5" fill="#1d4ed8"/>
    <circle cx="216" cy="151" r="5.5" fill="#f8fafc" stroke="#1d4ed8" stroke-width="3"/>
    <circle cx="186" cy="151" r="5.5" fill="#16726b"/>
    <circle cx="276" cy="241" r="5.5" fill="#f8fafc" stroke="#16726b" stroke-width="3"/>
    <circle cx="186" cy="181" r="5.5" fill="#1d4ed8"/>
    <circle cx="246" cy="271" r="5.5" fill="#16726b"/>
    <text x="115" y="57" text-anchor="end">(−1, 5)</text>
    <text x="227" y="146">(2, 2)</text>
    <text x="179" y="134" fill="#16726b">(1, 2)</text>
    <text x="175" y="202" fill="#1d4ed8">(1, 1)</text>
    <text x="234" y="295" fill="#16726b">(3, −2)</text>
    <text x="288" y="243">(4, −1)</text>
    <text x="265" y="176">right 2</text>
    <text x="261" y="199">down 3</text>
    <path d="M130 21h22" fill="none" stroke="#1d4ed8" stroke-width="4"/>
    <text x="160" y="27" fill="#1d4ed8" font-weight="650">f(x)</text>
    <path d="M252 21h22" fill="none" stroke="#16726b" stroke-width="4"/>
    <text x="282" y="27" fill="#16726b" font-weight="650">f(x − 2) − 3</text>
  </g>
</svg>
