<svg xmlns="http://www.w3.org/2000/svg" width="480" height="324" viewBox="0 0 480 324" role="img" aria-labelledby="title description">
  <title id="title">Translation and horizontal stretch in two orders</title>
  <desc id="description">Translating right by one and then stretching by factor two moves the vertex to (4, 1). Stretching first and translating right by one moves it to (3, 1).</desc>
  <rect x="1" y="1" width="478" height="322" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <g font-family="Inter, system-ui, sans-serif" font-size="19" fill="#334155">
    <path d="M35 279H428m-8-5 8 5-8 5M99 304V53m-5 8 5-8 5 8" fill="none" stroke="#475569" stroke-width="1.8"/>
    <text x="439" y="285">x</text>
    <text x="82" y="56">y</text>
    <path d="M99 74Q201 320 303 197" fill="none" stroke="#1d4ed8" stroke-width="4"/>
    <path d="M65 74Q167 320 269 197" fill="none" stroke="#16726b" stroke-width="4"/>
    <circle cx="99" cy="74" r="5.5" fill="#1d4ed8"/>
    <circle cx="303" cy="197" r="5.5" fill="#f8fafc" stroke="#1d4ed8" stroke-width="3"/>
    <circle cx="65" cy="74" r="5.5" fill="#16726b"/>
    <circle cx="269" cy="197" r="5.5" fill="#f8fafc" stroke="#16726b" stroke-width="3"/>
    <circle cx="235" cy="238" r="5.5" fill="#1d4ed8"/>
    <circle cx="201" cy="238" r="5.5" fill="#16726b"/>
    <text x="193" y="260" fill="#16726b" text-anchor="end">(3, 1)</text>
    <text x="245" y="260" fill="#1d4ed8">(4, 1)</text>
    <path d="M199 26h22" fill="none" stroke="#1d4ed8" stroke-width="4"/>
    <text x="229" y="32" fill="#1d4ed8" font-weight="650">Translate, then stretch</text>
    <path d="M199 56h22" fill="none" stroke="#16726b" stroke-width="4"/>
    <text x="229" y="62" fill="#16726b" font-weight="650">Stretch, then translate</text>
  </g>
</svg>
