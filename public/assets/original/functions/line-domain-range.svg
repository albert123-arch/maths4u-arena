<svg xmlns="http://www.w3.org/2000/svg" width="480" height="280" viewBox="0 0 480 280" role="img" aria-labelledby="title description">
  <title id="title">Domain and range of a restricted decreasing line</title>
  <desc id="description">The included point at x = minus 2 gives y = 9. The excluded point at x = 3 would give y = minus 1.</desc>
  <rect x="1" y="1" width="478" height="278" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <g font-family="Inter, system-ui, sans-serif" font-size="19" fill="#334155">
    <text x="246" y="30" text-anchor="middle" font-size="22" font-weight="650">y = 5 − 2x</text>
    <path d="M 41 208 H 432 l -9 -5 m 9 5 l -9 5 M 215 250 V 43 l -5 9 m 5 -9 l 5 9" fill="none" stroke="#475569" stroke-width="1.8"/>
    <text x="443" y="214">x</text>
    <text x="195" y="48">y</text>
    <path d="M131 208 V64 H215 M215 224 H341 V208" fill="none" stroke="#738397" stroke-width="1.5" stroke-dasharray="5 4"/>
    <path d="M131 64 L341 224" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round"/>
    <circle cx="131" cy="64" r="6" fill="#1d4ed8"/>
    <circle cx="341" cy="224" r="6" fill="#f8fafc" stroke="#1d4ed8" stroke-width="3"/>
    <text x="120" y="63" text-anchor="end">(−2, 9)</text>
    <text x="354" y="239">(3, −1)</text>
    <text x="228" y="70" font-weight="650">9</text>
    <text x="202" y="238" text-anchor="end" font-weight="650">−1</text>
    <text x="131" y="233" text-anchor="middle">−2</text>
    <text x="341" y="197" text-anchor="middle">3</text>
  </g>
</svg>
