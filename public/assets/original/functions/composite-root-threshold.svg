<svg xmlns="http://www.w3.org/2000/svg" width="480" height="280" viewBox="0 0 480 280" role="img" aria-labelledby="title description">
  <title id="title">The outputs at or above seven come from two branches</title>
  <desc id="description">The two solid blue branches of y equals x squared plus three lie above the threshold y equals seven. The left interval is closed from minus four to minus two. The right interval starts at two and excludes the point at three.</desc>
  <rect x="1" y="1" width="478" height="278" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <g font-family="Inter, system-ui, sans-serif" font-size="20" fill="#334155">
    <text x="246" y="29" text-anchor="middle" font-size="22" font-weight="650">y = x² + 3</text>
    <path d="M42 231H438m-8-5 8 5-8 5M245 248V47m-5 8 5-8 5 8" stroke="#475569" stroke-width="1.8" fill="none"/>
    <text x="448" y="237">x</text><text x="225" y="52">y</text>
    <path d="M44 168H436" stroke="#94601d" stroke-width="1.9" stroke-dasharray="6 4"/>
    <text x="381" y="157" fill="#805315">y = 7</text>
    <path d="M77 60V231M161 168V231M329 168V231M371 123V231" stroke="#738397" stroke-width="1.3" stroke-dasharray="4 4"/>
    <path d="M77 231H161M329 231H371" stroke="#1d4ed8" stroke-width="4"/>
    <path d="M161 168Q245 240 329 168" fill="none" stroke="#67788b" stroke-width="3" stroke-dasharray="6 5"/>
    <path d="M77 60Q119 132 161 168M329 168Q350 150 371 123" fill="none" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round"/>
    <g fill="#1d4ed8">
      <circle cx="77" cy="60" r="5.5"/><circle cx="161" cy="168" r="5.5"/><circle cx="329" cy="168" r="5.5"/>
      <circle cx="77" cy="231" r="4"/><circle cx="161" cy="231" r="4"/><circle cx="329" cy="231" r="4"/>
    </g>
    <g fill="#f8fafc" stroke="#1d4ed8" stroke-width="2.7">
      <circle cx="371" cy="123" r="5.5"/><circle cx="371" cy="231" r="4.5"/>
    </g>
    <g text-anchor="middle" font-weight="600">
      <text x="77" y="260">−4</text><text x="161" y="260">−2</text>
      <text x="329" y="260">2</text><text x="371" y="260">3</text>
    </g>
  </g>
</svg>
