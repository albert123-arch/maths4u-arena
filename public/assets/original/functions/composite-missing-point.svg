<svg xmlns="http://www.w3.org/2000/svg" width="480" height="245" viewBox="0 0 480 245" role="img" aria-labelledby="title description">
  <title id="title">The line for the composite has a missing point</title>
  <desc id="description">The plot of y equals x minus three has a hollow marker at x equals three, y equals zero. This input was excluded from the original inner function.</desc>
  <rect x="1" y="1" width="478" height="243" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <g font-family="Inter, system-ui, sans-serif" font-size="20" fill="#334155">
    <text x="246" y="30" text-anchor="middle" font-size="22" font-weight="650">y = x − 3</text>
    <path d="M43 134H438m-8-5 8 5-8 5M126 232V42m-5 8 5-8 5 8" stroke="#475569" stroke-width="1.8" fill="none"/>
    <text x="447" y="139">x</text><text x="106" y="47">y</text>
    <path d="M118 236.4L366 38" fill="none" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round"/>
    <circle cx="246" cy="134" r="6.8" fill="#f8fafc" stroke="#1d4ed8" stroke-width="3"/>
    <text x="257" y="163">(3, 0) excluded</text>
    <path d="M123 230H129" stroke="#475569" stroke-width="1.8"/>
    <text x="113" y="230" text-anchor="end">−3</text>
  </g>
</svg>
