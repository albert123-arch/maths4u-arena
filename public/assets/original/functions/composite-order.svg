<svg xmlns="http://www.w3.org/2000/svg" width="480" height="200" viewBox="0 0 480 200" role="img" aria-labelledby="title description">
  <title id="title">The order of the two functions</title>
  <desc id="description">In the first row, g takes 1 to 2 and f takes 2 to 1. In the second row, f takes 1 to 3 and g takes 3 to 4.</desc>
  <rect x="1" y="1" width="478" height="198" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <path d="M20 100H460" stroke="#cbd5e1"/>
  <g fill="#eff6ff" stroke="#91b3e8">
    <rect x="92" y="42" width="48" height="39" rx="9"/>
    <rect x="238" y="42" width="48" height="39" rx="9"/>
    <rect x="384" y="42" width="48" height="39" rx="9"/>
    <rect x="92" y="135" width="48" height="39" rx="9"/>
    <rect x="238" y="135" width="48" height="39" rx="9"/>
    <rect x="384" y="135" width="48" height="39" rx="9"/>
  </g>
  <g fill="none" stroke-width="2.8" stroke-linejoin="round">
    <path d="M151 62H228m-8-5 8 5-8 5M297 155H374m-8-5 8 5-8 5" stroke="#16726b"/>
    <path d="M297 62H374m-8-5 8 5-8 5M151 155H228m-8-5 8 5-8 5" stroke="#1d4ed8"/>
  </g>
  <g font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="650" text-anchor="middle" fill="#1e3a5c">
    <text x="53" y="70">fg(1)</text>
    <text x="53" y="163">gf(1)</text>
    <text x="116" y="70">1</text><text x="262" y="70">2</text><text x="408" y="70">1</text>
    <text x="116" y="163">1</text><text x="262" y="163">3</text><text x="408" y="163">4</text>
    <text x="189" y="50" fill="#145a54">g</text><text x="336" y="50" fill="#1d4ed8">f</text>
    <text x="189" y="143" fill="#1d4ed8">f</text><text x="336" y="143" fill="#145a54">g</text>
  </g>
</svg>
