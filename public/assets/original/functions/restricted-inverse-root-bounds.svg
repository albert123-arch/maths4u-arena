<svg xmlns="http://www.w3.org/2000/svg" width="480" height="260" viewBox="0 0 480 260" role="img" aria-labelledby="title description">
  <title id="title">Open and closed endpoints of a decreasing square-root function</title>
  <desc id="description">The curve y equals five minus the square root of x plus one has an open point at minus one, five and a closed point at eight, two.</desc>
  <rect x="1" y="1" width="478" height="258" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <g font-family="Inter, system-ui, sans-serif" font-size="19" fill="#334155">
    <text x="246" y="30" text-anchor="middle" font-size="22" font-weight="650">y = 5 − √(x + 1)</text>
    <path d="M41 228H434m-8-5 8 5-8 5M115 242V44m-5 8 5-8 5 8" stroke="#475569" stroke-width="1.8" fill="none"/>
    <text x="445" y="234">x</text><text x="96" y="48">y</text>
    <path d="M83 228V68H115M115 164H371V228" stroke="#738397" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/>
    <path d="M83 68Q83 116 371 164" fill="none" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round"/>
    <circle cx="83" cy="68" r="5.5" fill="#f8fafc" stroke="#1d4ed8" stroke-width="3"/>
    <circle cx="371" cy="164" r="5.5" fill="#1d4ed8"/>
    <text x="70" y="63" text-anchor="end">(−1, 5)</text>
    <text x="382" y="168">(8, 2)</text>
    <text x="127" y="74">5</text>
    <text x="102" y="169" text-anchor="end">2</text>
    <text x="83" y="251" text-anchor="middle">−1</text>
    <text x="371" y="251" text-anchor="middle">8</text>
  </g>
</svg>
