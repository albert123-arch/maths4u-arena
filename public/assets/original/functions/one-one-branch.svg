<svg xmlns="http://www.w3.org/2000/svg" width="480" height="280" viewBox="0 0 480 280" role="img" aria-labelledby="title description">
  <title id="title">Horizontal line test on the full parabola and its right branch</title>
  <desc id="description">Both branches meet y = 6. On x at least 1, the solid right branch gives a single point on each attained horizontal level.</desc>
  <rect x="1" y="1" width="478" height="278" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <g font-family="Inter, system-ui, sans-serif" font-size="19" fill="#334155">
    <text x="247" y="29" text-anchor="middle" font-size="22" font-weight="650">y = (x − 1)² + 2</text>
    <path d="M 45 251 H 433 l -9 -5 m 9 5 l -9 5 M 206 264 V 44 l -5 9 m 5 -9 l 5 9" fill="none" stroke="#475569" stroke-width="1.8"/>
    <text x="444" y="257">x</text>
    <text x="187" y="51">y</text>
    <path d="M45 101 H435" stroke="#94601d" stroke-width="1.8" stroke-dasharray="7 5"/>
    <text x="49" y="91" fill="#805315">y = 6</text>
    <path d="M254 201 V251" stroke="#738397" stroke-width="1.7" stroke-dasharray="5 4"/>
    <path d="M134 44.75 Q194 201 254 201" fill="none" stroke="#67788b" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="7 6"/>
    <path d="M254 201 Q314 201 374 44.75" fill="none" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round"/>
    <circle cx="158" cy="101" r="5.5" fill="#67788b"/>
    <circle cx="350" cy="101" r="6" fill="#1d4ed8"/>
    <circle cx="254" cy="201" r="5.5" fill="#1d4ed8"/>
    <text x="144" y="125" text-anchor="end">(−1, 6)</text>
    <text x="362" y="125">(3, 6)</text>
    <text x="254" y="225" text-anchor="middle">(1, 2)</text>
    <text x="395" y="160" text-anchor="middle" font-weight="650" fill="#1d4ed8">x ≥ 1</text>
  </g>
</svg>
