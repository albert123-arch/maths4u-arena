<svg xmlns="http://www.w3.org/2000/svg" width="480" height="220" viewBox="0 0 480 220" role="img" aria-labelledby="title description">
  <title id="title">Adding one to the allowed inputs gives the interval accepted by f</title>
  <desc id="description">The first number line marks x from closed minus 3 to open 2. The second marks g of x from closed minus 2 to open 3.</desc>
  <rect x="1" y="1" width="478" height="218" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <g font-family="Inter, system-ui, sans-serif" font-size="20" fill="#334155">
    <text x="24" y="34" font-weight="650">Inputs x that work</text>
    <text x="24" y="140" font-weight="650">Outputs g(x) = x + 1 that f accepts</text>
    <path d="M48 70H439m-8-5 8 5-8 5M48 176H439m-8-5 8 5-8 5" stroke="#64748b" stroke-width="1.8" fill="none"/>
    <path d="M101 70H341" stroke="#1d4ed8" stroke-width="4"/>
    <path d="M149 176H389" stroke="#16726b" stroke-width="4"/>
    <circle cx="101" cy="70" r="6" fill="#1d4ed8"/>
    <circle cx="341" cy="70" r="6" fill="#f8fafc" stroke="#1d4ed8" stroke-width="3"/>
    <circle cx="149" cy="176" r="6" fill="#16726b"/>
    <circle cx="389" cy="176" r="6" fill="#f8fafc" stroke="#16726b" stroke-width="3"/>
    <g text-anchor="middle">
      <text x="101" y="98">−3</text><text x="341" y="98">2</text>
      <text x="149" y="204">−2</text><text x="389" y="204">3</text>
    </g>
  </g>
</svg>
