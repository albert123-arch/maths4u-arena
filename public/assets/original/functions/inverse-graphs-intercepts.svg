<svg xmlns="http://www.w3.org/2000/svg" width="480" height="380" viewBox="0 0 480 380" role="img" aria-labelledby="title description">
  <title id="title">An included x-intercept becomes a y-intercept</title>
  <desc id="description">The line p is restricted to x at least one. Its point three, zero becomes zero, three on p inverse. The inverse ray lies above the x-axis.</desc>
  <rect x="1" y="1" width="478" height="378" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <g font-family="Inter, system-ui, sans-serif" font-size="19" fill="#334155">
    <path d="M43 208H433m-8-5 8 5-8 5M224 351V45m-5 8 5-8 5 8" fill="none" stroke="#475569" stroke-width="1.8"/>
    <text x="446" y="214">x</text><text x="203" y="49">y</text>
    <path d="M81 351L389 43" fill="none" stroke="#635383" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="395" y="44" fill="#5b4b79">y = x</text>
    <path d="M246 296L367 54m-9 6 9-6 1 11" fill="none" stroke="#1d4ed8" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M136 186L378 65m-11 1 11-1-5 10" fill="none" stroke="#16726b" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#1d4ed8"><circle cx="246" cy="296" r="5.5"/><circle cx="290" cy="208" r="5.5"/></g>
    <g fill="#16726b"><circle cx="136" cy="186" r="5.5"/><circle cx="224" cy="142" r="5.5"/></g>
    <text x="303" y="231">(3, 0)</text>
    <text x="212" y="134" text-anchor="end">(0, 3)</text>
    <text x="257" y="315">(1, −4)</text>
    <text x="125" y="190" text-anchor="end">(−4, 1)</text>
    <path d="M153 349h21" fill="none" stroke="#1d4ed8" stroke-width="4"/>
    <text x="182" y="355" fill="#1d4ed8" font-weight="650">p</text>
    <path d="M289 349h21" fill="none" stroke="#16726b" stroke-width="4"/>
    <text x="318" y="355" fill="#145a54" font-weight="650">p⁻¹</text>
  </g>
</svg>
