<svg xmlns="http://www.w3.org/2000/svg" width="480" height="300" viewBox="0 0 480 300" role="img" aria-labelledby="title description">
  <title id="title">A decreasing graph that coincides with its inverse</title>
  <desc id="description">On the line segment y equals eight minus x, the points two, six and six, two reflect to one another. Four, four lies on the mirror.</desc>
  <rect x="1" y="1" width="478" height="298" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <g font-family="Inter, system-ui, sans-serif" font-size="19" fill="#334155">
    <path d="M42 256H434m-8-5 8 5-8 5M108 279V43m-5 8 5-8 5 8" fill="none" stroke="#475569" stroke-width="1.8"/>
    <text x="445" y="263">x</text><text x="88" y="47">y</text>
    <path d="M108 256L327 37" fill="none" stroke="#635383" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="337" y="42" fill="#5b4b79">y = x</text>
    <path d="M135 67L297 229" fill="none" stroke="#1d4ed8" stroke-width="4"/>
    <g fill="#1d4ed8">
      <circle cx="135" cy="67" r="5"/><circle cx="162" cy="94" r="5.6"/><circle cx="270" cy="202" r="5.6"/><circle cx="297" cy="229" r="5"/>
    </g>
    <circle cx="216" cy="148" r="5.6" fill="#5b4b79"/>
    <text x="142" y="61">(1, 7)</text>
    <text x="177" y="92">(2, 6)</text>
    <text x="229" y="160" fill="#5b4b79">(4, 4)</text>
    <text x="258" y="222" text-anchor="end">(6, 2)</text>
    <text x="308" y="239">(7, 1)</text>
    <text x="354" y="130" text-anchor="middle" fill="#1d4ed8" font-weight="650">h and h⁻¹</text>
    <text x="354" y="156" text-anchor="middle" fill="#1d4ed8">y = 8 − x</text>
  </g>
</svg>
