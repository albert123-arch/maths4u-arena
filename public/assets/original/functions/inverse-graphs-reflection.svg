<svg xmlns="http://www.w3.org/2000/svg" width="480" height="400" viewBox="0 0 480 400" role="img" aria-labelledby="title description">
  <title id="title">Reflection of a restricted parabola and its endpoints</title>
  <desc id="description">The mirror is y equals x. Minus one, six on q reflects to six, minus one on q inverse. The filled and hollow endpoints keep their status.</desc>
  <rect x="1" y="1" width="478" height="398" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <g font-family="Inter, system-ui, sans-serif" font-size="19" fill="#334155">
    <path d="M30 322H434m-8-5 8 5-8 5M103 380V53m-5 8 5-8 5 8" fill="none" stroke="#475569" stroke-width="1.8"/>
    <text x="446" y="328">x</text><text x="84" y="57">y</text>
    <path d="M48 377L367 58" fill="none" stroke="#635383" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="375" y="60" fill="#5b4b79">y = x</text>
    <path d="M81 190L235 344" fill="none" stroke="#738397" stroke-width="1.6" stroke-dasharray="4 5"/>
    <path d="M59 80Q81 212 103 256" fill="none" stroke="#1d4ed8" stroke-width="4"/>
    <path d="M169 322Q213 344 345 366" fill="none" stroke="#16726b" stroke-width="4"/>
    <g fill="#1d4ed8"><circle cx="59" cy="80" r="5.5"/><circle cx="81" cy="190" r="5.5"/></g>
    <g fill="#16726b"><circle cx="235" cy="344" r="5.5"/><circle cx="345" cy="366" r="5.5"/></g>
    <circle cx="103" cy="256" r="5.5" fill="#f8fafc" stroke="#1d4ed8" stroke-width="3"/>
    <circle cx="169" cy="322" r="5.5" fill="#f8fafc" stroke="#16726b" stroke-width="3"/>
    <text x="70" y="78">(−2, 11)</text>
    <text x="73" y="186" text-anchor="end">(−1, 6)</text>
    <text x="92" y="272" text-anchor="end">(0, 3)</text>
    <text x="175" y="310">(3, 0)</text>
    <text x="227" y="369" text-anchor="end">(6, −1)</text>
    <text x="355" y="371">(11, −2)</text>
    <path d="M166 25h21" fill="none" stroke="#1d4ed8" stroke-width="4"/>
    <text x="195" y="31" fill="#1d4ed8" font-weight="650">q</text>
    <path d="M268 25h21" fill="none" stroke="#16726b" stroke-width="4"/>
    <text x="298" y="31" fill="#145a54" font-weight="650">q⁻¹</text>
  </g>
</svg>
