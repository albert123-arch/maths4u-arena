<svg xmlns="http://www.w3.org/2000/svg" width="640" height="350" viewBox="0 0 640 350" role="img" aria-labelledby="title desc"><title id="title">Group A has mean 8 and group B mean 13. Their weighted mean is 11, so between-group separation contributes to pooled variance.</title><desc id="desc">Group A has mean 8 and group B mean 13. Their weighted mean is 11, so between-group separation contributes to pooled variance.</desc><rect width="640" height="350" fill="white"/><g font-family="Arial, sans-serif" font-size="18" fill="#172033"><text x="320" y="28" text-anchor="middle">Pooling includes differences of centres</text><line x1="80" y1="275" x2="580" y2="275" stroke="#172033" stroke-width="2"/><text x="320" y="334" text-anchor="middle">Observed-value scale</text><line x1="80" y1="270" x2="80" y2="280" stroke="#172033" stroke-width="2"/><text x="80" y="308" text-anchor="middle">5</text><line x1="130" y1="270" x2="130" y2="280" stroke="#172033" stroke-width="2"/><text x="130" y="308" text-anchor="middle">6</text><line x1="180" y1="270" x2="180" y2="280" stroke="#172033" stroke-width="2"/><text x="180" y="308" text-anchor="middle">7</text><line x1="230" y1="270" x2="230" y2="280" stroke="#172033" stroke-width="2"/><text x="230" y="308" text-anchor="middle">8</text><line x1="280" y1="270" x2="280" y2="280" stroke="#172033" stroke-width="2"/><text x="280" y="308" text-anchor="middle">9</text><line x1="330" y1="270" x2="330" y2="280" stroke="#172033" stroke-width="2"/><text x="330" y="308" text-anchor="middle">10</text><line x1="380" y1="270" x2="380" y2="280" stroke="#172033" stroke-width="2"/><text x="380" y="308" text-anchor="middle">11</text><line x1="430" y1="270" x2="430" y2="280" stroke="#172033" stroke-width="2"/><text x="430" y="308" text-anchor="middle">12</text><line x1="480" y1="270" x2="480" y2="280" stroke="#172033" stroke-width="2"/><text x="480" y="308" text-anchor="middle">13</text><line x1="530" y1="270" x2="530" y2="280" stroke="#172033" stroke-width="2"/><text x="530" y="308" text-anchor="middle">14</text><line x1="580" y1="270" x2="580" y2="280" stroke="#172033" stroke-width="2"/><text x="580" y="308" text-anchor="middle">15</text><line x1="230" y1="105" x2="230" y2="270" stroke="#2457d6" stroke-width="2"/><text x="230" y="95" text-anchor="middle">Group A: mean 8, n = 4</text><line x1="480" y1="170" x2="480" y2="270" stroke="#a1540b" stroke-width="2"/><text x="480" y="160" text-anchor="middle">Group B: mean 13, n = 6</text><line x1="380" y1="230" x2="380" y2="270" stroke="#172033" stroke-width="2"/><text x="380" y="220" text-anchor="middle">Combined mean 11</text></g></svg>