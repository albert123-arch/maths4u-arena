<svg xmlns="http://www.w3.org/2000/svg" width="640" height="350" viewBox="0 0 640 350" role="img" aria-labelledby="title desc"><title id="title">Probabilities at values −2, 0, 1, 4 are 1/10, 3/10, 2/5, 1/5, respectively. Separate bars represent discrete masses.</title><desc id="desc">Probabilities at values −2, 0, 1, 4 are 1/10, 3/10, 2/5, 1/5, respectively. Separate bars represent discrete masses.</desc><rect width="640" height="350" fill="white"/><g font-family="Arial, sans-serif" fill="#172033"><text x="320" y="32" text-anchor="middle" font-size="19">A finite discrete distribution</text><text x="320" y="332" text-anchor="middle" font-size="17">Separate bars; probabilities sum to 1</text><path d="M70 65V265H595" fill="none" stroke="#172033" stroke-width="2"/><rect x="103.0" y="232.0" width="44" height="33.0" fill="#2857a5"/><text x="125.0" y="292" text-anchor="middle" font-size="19">-2</text><text x="125.0" y="217.0" text-anchor="middle" font-size="17">1/10</text><rect x="243.0" y="166.0" width="44" height="99.0" fill="#2857a5"/><text x="265.0" y="292" text-anchor="middle" font-size="19">0</text><text x="265.0" y="151.0" text-anchor="middle" font-size="17">3/10</text><rect x="313.0" y="133.0" width="44" height="132.0" fill="#2857a5"/><text x="335.0" y="292" text-anchor="middle" font-size="19">1</text><text x="335.0" y="118.0" text-anchor="middle" font-size="17">2/5</text><rect x="523.0" y="199.0" width="44" height="66.0" fill="#2857a5"/><text x="545.0" y="292" text-anchor="middle" font-size="19">4</text><text x="545.0" y="184.0" text-anchor="middle" font-size="17">1/5</text></g></svg>