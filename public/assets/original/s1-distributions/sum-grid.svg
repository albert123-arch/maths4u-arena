<svg xmlns="http://www.w3.org/2000/svg" width="640" height="350" viewBox="0 0 640 350" role="img" aria-labelledby="title desc"><title id="title">Independent spins with labels 0,1,3 produce nine equally likely ordered pairs. Sum 3 has probability 2/9 and sum 2 has probability 1/9.</title><desc id="desc">Independent spins with labels 0,1,3 produce nine equally likely ordered pairs. Sum 3 has probability 2/9 and sum 2 has probability 1/9.</desc><rect width="640" height="350" fill="white"/><g font-family="Arial, sans-serif" fill="#172033"><text x="320" y="32" text-anchor="middle" font-size="19">Nine ordered pairs; six possible sums</text><text x="125" y="114" text-anchor="middle" font-size="21">0</text><text x="235" y="64" text-anchor="middle" font-size="21">0</text><rect x="195" y="80" width="80" height="50" rx="5" fill="#dbeafe" stroke="#173b70"/><text x="235" y="112" text-anchor="middle" font-size="24">0</text><rect x="295" y="80" width="80" height="50" rx="5" fill="#dbeafe" stroke="#173b70"/><text x="335" y="112" text-anchor="middle" font-size="24">1</text><rect x="395" y="80" width="80" height="50" rx="5" fill="#dbeafe" stroke="#173b70"/><text x="435" y="112" text-anchor="middle" font-size="24">3</text><text x="125" y="178" text-anchor="middle" font-size="21">1</text><text x="335" y="64" text-anchor="middle" font-size="21">1</text><rect x="195" y="144" width="80" height="50" rx="5" fill="#dbeafe" stroke="#173b70"/><text x="235" y="176" text-anchor="middle" font-size="24">1</text><rect x="295" y="144" width="80" height="50" rx="5" fill="#dbeafe" stroke="#173b70"/><text x="335" y="176" text-anchor="middle" font-size="24">2</text><rect x="395" y="144" width="80" height="50" rx="5" fill="#dbeafe" stroke="#173b70"/><text x="435" y="176" text-anchor="middle" font-size="24">4</text><text x="125" y="242" text-anchor="middle" font-size="21">3</text><text x="435" y="64" text-anchor="middle" font-size="21">3</text><rect x="195" y="208" width="80" height="50" rx="5" fill="#dbeafe" stroke="#173b70"/><text x="235" y="240" text-anchor="middle" font-size="24">3</text><rect x="295" y="208" width="80" height="50" rx="5" fill="#dbeafe" stroke="#173b70"/><text x="335" y="240" text-anchor="middle" font-size="24">4</text><rect x="395" y="208" width="80" height="50" rx="5" fill="#dbeafe" stroke="#173b70"/><text x="435" y="240" text-anchor="middle" font-size="24">6</text><text x="320" y="300" text-anchor="middle" font-size="18">Sum 3 has two pairs; sum 2 has one</text><text x="320" y="330" text-anchor="middle" font-size="17">Each cell has probability 1/9</text></g></svg>