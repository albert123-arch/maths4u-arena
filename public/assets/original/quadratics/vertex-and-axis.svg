<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" role="img" aria-labelledby="title description">
  <title id="title">Vertex and axis of a quadratic graph</title>
  <desc id="description">The parabola y = 3(x − 2)² − 7 has a minimum at (2, −7) and vertical axis of symmetry x = 2.</desc>
  <rect x="1" y="1" width="478" height="298" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <g stroke="#53647c" stroke-width="1.7" fill="none">
    <path d="M26 142H448m-7-4 7 4-7 4M89 269V13m-4 7 4-7 4 7"/>
  </g>
  <path d="M213 16V258 M89 219H213" stroke="#7486a1" stroke-width="1.7" stroke-dasharray="6 5" fill="none"/>
  <path d="M58 12.75 Q213 425.25 368 12.75" fill="none" stroke="#1d4ed8" stroke-width="3.6"/>
  <circle cx="213" cy="219" r="5.5" fill="#69429a"/>
  <g font-family="Inter, system-ui, sans-serif" font-size="19" fill="#334155">
    <text x="453" y="136">x</text><text x="96" y="27">y</text>
    <text x="263" y="267" fill="#1d4ed8" font-weight="600">y = 3(x − 2)² − 7</text>
    <text x="29" y="225">k = −7</text>
    <text x="228" y="240" fill="#69429a">(2, −7)</text>
    <text x="213" y="281" text-anchor="middle">x = 2</text>
  </g>
</svg>
