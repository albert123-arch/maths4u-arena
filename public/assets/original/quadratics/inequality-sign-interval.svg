<svg xmlns="http://www.w3.org/2000/svg" width="620" height="334" viewBox="0 0 620 334" role="img" aria-labelledby="title description">
  <title id="title">Quadratic sign and solution interval</title>
  <desc id="description">The parabola y = x² + 3x − 10 is negative between the roots −5 and 2. Open circles mark the excluded endpoints on the solution number line.</desc>
  <rect x="1" y="1" width="618" height="332" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <g font-family="Inter, system-ui, sans-serif">
    <text x="310.00" y="32.00" text-anchor="middle" font-size="24" fill="#172334" font-weight="650">f(x) = x² + 3x − 10</text>
    <path d="M 122.28 126.00 Q 315.48 341.60 508.68 126.00 Z" fill="#d1fae5"/>
    <path d="M 33 126.00 H 589 m -8 -4 l 8 4 -8 4 M 398.28 249 V 46 m -4 8 l 4 -8 4 8" fill="none" stroke="#475569" stroke-width="1.6"/>
    <text x="596.00" y="120.00" text-anchor="middle" font-size="16" fill="#475569" font-weight="500">x</text>
    <text x="386.28" y="54.00" text-anchor="middle" font-size="16" fill="#475569" font-weight="500">y</text>
    <path d="M 67.08 55.60 Q 315.48 412.00 563.88 55.60" fill="none" stroke="#1d4ed8" stroke-width="3.8" stroke-linecap="round"/>
    <path d="M 122.28 126.00 Q 315.48 341.60 508.68 126.00" fill="none" stroke="#047857" stroke-width="4" stroke-linecap="round"/>
    <circle cx="122.28" cy="126.00" r="6" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2.7"/>
    <circle cx="508.68" cy="126.00" r="6" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2.7"/>
    <path d="M 122.28 133.00 V 283" fill="none" stroke="#cbd5e1" stroke-width="1.8" stroke-dasharray="6 5"/>
    <path d="M 508.68 133.00 V 283" fill="none" stroke="#cbd5e1" stroke-width="1.8" stroke-dasharray="6 5"/>
    <text x="310.00" y="260.00" text-anchor="middle" font-size="21" fill="#172334" font-weight="620">Solution of f(x) &lt; 0</text>
    <path d="M 33 283 H 589 m -8 -4 l 8 4 -8 4" fill="none" stroke="#475569" stroke-width="1.6"/>
    <path d="M 122.28 283 H 508.68" stroke="#047857" stroke-width="5"/>
    <circle cx="122.28" cy="283.00" r="6" fill="#f8fafc" stroke="#047857" stroke-width="2.7"/>
    <circle cx="508.68" cy="283.00" r="6" fill="#f8fafc" stroke="#047857" stroke-width="2.7"/>
    <text x="122.28" y="314.00" text-anchor="middle" font-size="19" fill="#172334" font-weight="500">−5</text>
    <text x="508.68" y="314.00" text-anchor="middle" font-size="19" fill="#172334" font-weight="500">2</text>
  </g>
</svg>
