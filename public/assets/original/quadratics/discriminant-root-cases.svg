<svg xmlns="http://www.w3.org/2000/svg" width="640" height="258" viewBox="0 0 640 258" role="img" aria-labelledby="title description">
  <title id="title">Discriminant and real roots</title>
  <desc id="description">Three upward parabolas cross the x-axis twice, touch it once, and stay above it, respectively.</desc>
  <rect x="1" y="1" width="638" height="256" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <g font-family="Inter, system-ui, sans-serif">
    <path d="M 213 20 V 238" stroke="#cbd5e1"/>
    <path d="M 427 20 V 238" stroke="#cbd5e1"/>
    <text x="107.00" y="32.00" text-anchor="middle" font-size="24" fill="#172334" font-weight="650">D &gt; 0</text>
    <path d="M 21 151 H 193 m -7 -4 l 7 4 -7 4 M 107 193 V 47" fill="none" stroke="#475569" stroke-width="1.5"/>
    <text x="194.00" y="144.00" text-anchor="middle" font-size="16" fill="#475569" font-weight="500">x</text>
    <text x="118.00" y="57.00" text-anchor="middle" font-size="16" fill="#475569" font-weight="500">y</text>
    <path d="M 32.60 111.73 Q 107 246.27 181.40 111.73" fill="none" stroke="#1d4ed8" stroke-width="3.7" stroke-linecap="round"/>
    <circle cx="59" cy="151" r="5.5" fill="#1d4ed8" stroke="#f8fafc" stroke-width="1.6"/>
    <circle cx="155" cy="151" r="5.5" fill="#1d4ed8" stroke="#f8fafc" stroke-width="1.6"/>
    <text x="107.00" y="217.00" text-anchor="middle" font-size="21" fill="#172334" font-weight="500">y = x² − 1</text>
    <text x="107.00" y="243.00" text-anchor="middle" font-size="22" fill="#172334" font-weight="620">Two real roots</text>
    <text x="320.00" y="32.00" text-anchor="middle" font-size="24" fill="#172334" font-weight="650">D = 0</text>
    <path d="M 234 151 H 406 m -7 -4 l 7 4 -7 4 M 320 193 V 47" fill="none" stroke="#475569" stroke-width="1.5"/>
    <text x="407.00" y="144.00" text-anchor="middle" font-size="16" fill="#475569" font-weight="500">x</text>
    <text x="331.00" y="57.00" text-anchor="middle" font-size="16" fill="#475569" font-weight="500">y</text>
    <path d="M 245.60 83.73 Q 320 218.27 394.40 83.73" fill="none" stroke="#1d4ed8" stroke-width="3.7" stroke-linecap="round"/>
    <circle cx="320" cy="151" r="5.5" fill="#1d4ed8" stroke="#f8fafc" stroke-width="1.6"/>
    <text x="320.00" y="217.00" text-anchor="middle" font-size="21" fill="#172334" font-weight="500">y = x²</text>
    <text x="320.00" y="243.00" text-anchor="middle" font-size="22" fill="#172334" font-weight="620">Repeated root</text>
    <text x="533.00" y="32.00" text-anchor="middle" font-size="24" fill="#172334" font-weight="650">D &lt; 0</text>
    <path d="M 447 151 H 619 m -7 -4 l 7 4 -7 4 M 533 193 V 47" fill="none" stroke="#475569" stroke-width="1.5"/>
    <text x="620.00" y="144.00" text-anchor="middle" font-size="16" fill="#475569" font-weight="500">x</text>
    <text x="544.00" y="57.00" text-anchor="middle" font-size="16" fill="#475569" font-weight="500">y</text>
    <path d="M 458.60 55.73 Q 533 190.27 607.40 55.73" fill="none" stroke="#1d4ed8" stroke-width="3.7" stroke-linecap="round"/>
    <text x="533.00" y="217.00" text-anchor="middle" font-size="21" fill="#172334" font-weight="500">y = x² + 1</text>
    <text x="533.00" y="243.00" text-anchor="middle" font-size="22" fill="#172334" font-weight="620">No real roots</text>
  </g>
</svg>
