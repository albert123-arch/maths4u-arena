<svg xmlns="http://www.w3.org/2000/svg" width="620" height="264" viewBox="0 0 620 264" role="img" aria-labelledby="title description">
  <title id="title">Intersect the solution with its domain</title>
  <desc id="description">The overlap of x ≤ −1 or x &gt; 4 with −3 &lt; x ≤ 6 is (−3, −1] union (4, 6]. Filled endpoints are included.</desc>
  <rect x="1" y="1" width="618" height="262" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <g font-family="Inter, system-ui, sans-serif">
    <text x="310.00" y="34.00" text-anchor="middle" font-size="24" fill="#172334" font-weight="650">Intersect the solution with the domain</text>
    <path d="M 233.46 60 V 232" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/>
    <text x="233.46" y="250.00" text-anchor="middle" font-size="20" fill="#172334" font-weight="500">−3</text>
    <path d="M 301.06 60 V 232" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/>
    <text x="301.06" y="250.00" text-anchor="middle" font-size="20" fill="#172334" font-weight="500">−1</text>
    <path d="M 470.06 60 V 232" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/>
    <text x="470.06" y="250.00" text-anchor="middle" font-size="20" fill="#172334" font-weight="500">4</text>
    <path d="M 537.66 60 V 232" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/>
    <text x="537.66" y="250.00" text-anchor="middle" font-size="20" fill="#172334" font-weight="500">6</text>
    <text x="24.00" y="90.00" text-anchor="start" font-size="22" fill="#172334" font-weight="600">Inequality</text>
    <path d="M 160 83 H 594" fill="none" stroke="#475569" stroke-width="1.5"/>
    <text x="24.00" y="156.00" text-anchor="start" font-size="22" fill="#172334" font-weight="600">Domain</text>
    <path d="M 160 149 H 594" fill="none" stroke="#475569" stroke-width="1.5"/>
    <text x="24.00" y="222.00" text-anchor="start" font-size="22" fill="#172334" font-weight="600">Overlap</text>
    <path d="M 160 215 H 594" fill="none" stroke="#475569" stroke-width="1.5"/>
    <path d="M 170.00 83 H 301.06" fill="none" stroke="#1d4ed8" stroke-width="5"/>
    <circle cx="301.06" cy="83.00" r="6" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2.7"/>
    <path d="M 179.00 78 L 170.00 83 L 179.00 88" fill="none" stroke="#1d4ed8" stroke-width="3"/>
    <path d="M 470.06 83 H 587.00" fill="none" stroke="#1d4ed8" stroke-width="5"/>
    <circle cx="470.06" cy="83.00" r="6" fill="#f8fafc" stroke="#1d4ed8" stroke-width="2.7"/>
    <path d="M 578.00 78 L 587.00 83 L 578.00 88" fill="none" stroke="#1d4ed8" stroke-width="3"/>
    <path d="M 233.46 149 H 537.66" fill="none" stroke="#1d4ed8" stroke-width="5"/>
    <circle cx="233.46" cy="149.00" r="6" fill="#f8fafc" stroke="#1d4ed8" stroke-width="2.7"/>
    <circle cx="537.66" cy="149.00" r="6" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2.7"/>
    <path d="M 233.46 215 H 301.06" fill="none" stroke="#047857" stroke-width="5"/>
    <circle cx="233.46" cy="215.00" r="6" fill="#f8fafc" stroke="#047857" stroke-width="2.7"/>
    <circle cx="301.06" cy="215.00" r="6" fill="#047857" stroke="#047857" stroke-width="2.7"/>
    <path d="M 470.06 215 H 537.66" fill="none" stroke="#047857" stroke-width="5"/>
    <circle cx="470.06" cy="215.00" r="6" fill="#f8fafc" stroke="#047857" stroke-width="2.7"/>
    <circle cx="537.66" cy="215.00" r="6" fill="#047857" stroke="#047857" stroke-width="2.7"/>
  </g>
</svg>
