<svg xmlns="http://www.w3.org/2000/svg" width="480" height="300" viewBox="0 0 480 300" role="img" aria-labelledby="title description">
  <title id="title">A restricted parabola with an open endpoint</title>
  <desc id="description">The graph y = (x − 1)² has vertex (1, 0). The endpoint (0, 1) is excluded. The endpoint (2, 1) is included, so the range is [0, 1].</desc>
  <rect x="1" y="1" width="478" height="298" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <g font-family="Inter, system-ui, sans-serif" font-size="19" fill="#334155">
    <text x="240" y="32" text-anchor="middle" font-weight="650">q(x) = (x − 1)² on 0 &lt; x ≤ 2</text>
    <path d="M31 243H431m-8-5 8 5-8 5M138 272V51m-5 8 5-8 5 8" fill="none" stroke="#53647c" stroke-width="1.7"/>
    <text x="444" y="249">x</text><text x="119" y="55">y</text>
    <path d="M138 133H322" fill="none" stroke="#7486a1" stroke-width="1.7" stroke-dasharray="6 5"/>
    <text x="230" y="120" text-anchor="middle">y = 1</text>
    <path d="M115 71.125Q126.5 105.5 138 133M322 133Q333.5 105.5 345 71.125" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="6 5"/>
    <path d="M138 133Q230 353 322 133" fill="none" stroke="#1d4ed8" stroke-width="3.6"/>
    <circle cx="138" cy="133" r="5.5" fill="#f8fafc" stroke="#1d4ed8" stroke-width="2.5"/>
    <circle cx="322" cy="133" r="5.5" fill="#1d4ed8"/>
    <circle cx="230" cy="243" r="5.5" fill="#69429a"/>
    <text x="125" y="123" text-anchor="end">(0, 1)</text>
    <text x="125" y="149" text-anchor="end" fill="#53647c">excluded</text>
    <text x="335" y="123">(2, 1)</text>
    <text x="335" y="149" fill="#53647c">included</text>
    <text x="230" y="273" text-anchor="middle" fill="#69429a">(1, 0)</text>
  </g>
</svg>
