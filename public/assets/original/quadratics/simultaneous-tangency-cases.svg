<svg xmlns="http://www.w3.org/2000/svg" width="620" height="340" viewBox="0 0 620 340" role="img" aria-labelledby="title description">
  <title id="title">Changing the intercept changes the intersection count</title>
  <desc id="description">The line with k = 3 has intersections (1, 5) and (5, 13). The line with k = −1 touches at (3, 5). The line with k = −3 has no intersection.</desc>
  <rect x="1" y="1" width="618" height="338" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <g font-family="Inter, system-ui, sans-serif">
    <text x="310.00" y="33.00" text-anchor="middle" font-size="24" fill="#172334" font-weight="650">Changing the intercept</text>
    <path d="M 32 261.00 H 465 m -8 -4 l 8 4 -8 4 M 84.70 303 V 46 m -4 8 l 4 -8 4 8" fill="none" stroke="#475569" stroke-width="1.6"/>
    <text x="474.00" y="254.00" text-anchor="middle" font-size="16" fill="#475569" font-weight="500">x</text>
    <text x="71.70" y="53.00" text-anchor="middle" font-size="16" fill="#475569" font-weight="500">y</text>
    <path d="M 48.10 237.60 L 453.75 64.70" fill="none" stroke="#047857" stroke-width="2.8" stroke-dasharray="8 5"/>
    <path d="M 48.10 289.60 L 453.75 116.70" fill="none" stroke="#a64b12" stroke-width="2.8" stroke-dasharray="8 5"/>
    <path d="M 48.10 315.60 L 453.75 142.70" fill="none" stroke="#475569" stroke-width="2.8" stroke-dasharray="8 5"/>
    <path d="M 51.15 124.47 Q 234.15 323.37 417.15 54.27" fill="none" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round"/>
    <circle cx="145.70" cy="196.00" r="6" fill="#047857" stroke="#f8fafc" stroke-width="1.6"/>
    <circle cx="389.70" cy="92.00" r="6" fill="#047857" stroke="#f8fafc" stroke-width="1.6"/>
    <circle cx="267.70" cy="196.00" r="6" fill="#a64b12" stroke="#f8fafc" stroke-width="1.6"/>
    <text x="133.70" y="180.00" text-anchor="end" font-size="20" fill="#047857" font-weight="640">(1, 5)</text>
    <text x="377.70" y="83.00" text-anchor="end" font-size="20" fill="#047857" font-weight="640">(5, 13)</text>
    <text x="267.70" y="223.00" text-anchor="middle" font-size="20" fill="#a64b12" font-weight="640">(3, 5)</text>
    <text x="474.00" y="67.70" text-anchor="start" font-size="16" fill="#047857" font-weight="650">k = 3 · two points</text>
    <text x="474.00" y="119.70" text-anchor="start" font-size="16" fill="#a64b12" font-weight="650">k = −1 · tangent</text>
    <text x="474.00" y="145.70" text-anchor="start" font-size="16" fill="#475569" font-weight="650">k = −3 · no points</text>
    <text x="212.00" y="322.00" text-anchor="middle" font-size="20" fill="#1d4ed8" font-weight="620">Curve  y = x² − 4x + 8</text>
    <text x="468.00" y="322.00" text-anchor="middle" font-size="20" fill="#475569" font-weight="620">Lines  y = 2x + k</text>
  </g>
</svg>
