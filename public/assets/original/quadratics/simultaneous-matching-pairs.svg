<svg xmlns="http://www.w3.org/2000/svg" width="620" height="326" viewBox="0 0 620 326" role="img" aria-labelledby="title description">
  <title id="title">The matching pairs</title>
  <desc id="description">The line y = x + 2 crosses the parabola y = x² − 2x − 2 at exactly (−1, 1) and (4, 6).</desc>
  <rect x="1" y="1" width="618" height="324" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <g font-family="Inter, system-ui, sans-serif">
    <text x="310.00" y="32.00" text-anchor="middle" font-size="23" fill="#172334" font-weight="650">The two intersections give the two pairs</text>
    <path d="M 32 215.00 H 575 m -8 -4 l 8 4 -8 4 M 196.00 278 V 46 m -4 8 l 4 -8 4 8" fill="none" stroke="#475569" stroke-width="1.6"/>
    <text x="584.00" y="208.00" text-anchor="middle" font-size="16" fill="#475569" font-weight="500">x</text>
    <text x="183.00" y="53.00" text-anchor="middle" font-size="16" fill="#475569" font-weight="500">y</text>
    <path d="M 56.00 215.00 L 560.00 111.32" fill="none" stroke="#047857" stroke-width="2.8" stroke-dasharray="8 5"/>
    <path d="M 53.20 125.12 Q 294.70 427.18 536.20 43.65" fill="none" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round"/>
    <circle cx="126.00" cy="200.60" r="6" fill="#047857" stroke="#f8fafc" stroke-width="1.6"/>
    <circle cx="476.00" cy="128.60" r="6" fill="#047857" stroke="#f8fafc" stroke-width="1.6"/>
    <text x="115.00" y="187.60" text-anchor="end" font-size="20" fill="#047857" font-weight="650">(−1, 1)</text>
    <text x="488.00" y="117.60" text-anchor="start" font-size="20" fill="#047857" font-weight="650">(4, 6)</text>
    <text x="174.00" y="306.00" text-anchor="middle" font-size="21" fill="#1d4ed8" font-weight="620">Parabola  y = x² − 2x − 2</text>
    <text x="459.00" y="306.00" text-anchor="middle" font-size="21" fill="#047857" font-weight="620">Line  y = x + 2</text>
  </g>
</svg>
