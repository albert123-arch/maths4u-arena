<svg xmlns="http://www.w3.org/2000/svg" width="390" height="320" viewBox="0 0 390 320" role="img" aria-labelledby="title description">
  <title id="title">Completing a square of side x + 3</title>
  <desc id="description">A square of area x squared and two strips each of area 3x form an L. The hatched three-by-three corner adds 9 and completes the square.</desc>
  <defs>
    <pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse">
      <rect width="9" height="9" fill="#fef3c7"/>
      <path d="M-2 2 2-2 M0 9 9 0 M7 11 11 7" fill="none" stroke="#b88323" stroke-width="1.2"/>
    </pattern>
  </defs>
  <rect x="1" y="1" width="388" height="318" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <g stroke="#334155" stroke-width="2">
    <rect x="88" y="41" width="150" height="150" fill="#dbeafe"/>
    <rect x="238" y="41" width="66" height="150" fill="#cbe9e7"/>
    <rect x="88" y="191" width="150" height="66" fill="#cbe9e7"/>
    <rect x="238" y="191" width="66" height="66" fill="url(#hatch)" stroke-dasharray="5 3"/>
    <path d="M88 270v8m0-4h216m0-4v8" fill="none" stroke-width="1.7"/>
  </g>
  <g font-family="Inter, system-ui, sans-serif" text-anchor="middle" fill="#162e46">
    <g font-size="19"><text x="163" y="29">x</text><text x="271" y="29">3</text><text x="70" y="122">x</text><text x="70" y="230">3</text></g>
    <g font-size="25" font-weight="600"><text x="163" y="125">x²</text><text x="271" y="125">3x</text><text x="163" y="233">3x</text></g>
    <rect x="252" y="209" width="38" height="29" rx="4" fill="#fff7d8"/>
    <text x="271" y="233" font-size="25" font-weight="650">9</text>
    <text x="196" y="301" font-size="21" font-weight="600">x + 3</text>
  </g>
</svg>
