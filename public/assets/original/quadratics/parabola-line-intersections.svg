<svg xmlns="http://www.w3.org/2000/svg" width="620" height="316" viewBox="0 0 620 316" role="img" aria-labelledby="title description">
  <title id="title">Line and parabola intersections</title>
  <desc id="description">For y = (x − 2)² + 1, the line y = 3 crosses twice, y = 1 is tangent at (2, 1), and y = −1 has no intersection.</desc>
  <rect x="1" y="1" width="618" height="314" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <g font-family="Inter, system-ui, sans-serif">
    <text x="310.00" y="32.00" text-anchor="middle" font-size="24" fill="#172334" font-weight="650">A line and a parabola</text>
    <path d="M 29 223.32 H 449 m -7 -4 l 7 4 -7 4 M 108.00 268 V 46 m -4 7 l 4 -7 4 7" fill="none" stroke="#475569" stroke-width="1.5"/>
    <text x="452.00" y="229.32" text-anchor="start" font-size="17" fill="#475569" font-weight="500">x</text>
    <text x="96.00" y="55.00" text-anchor="middle" font-size="17" fill="#475569" font-weight="500">y</text>
    <path d="M 55.20 148.92 H 465" fill="none" stroke="#047857" stroke-width="2.5" stroke-dasharray="8 5"/>
    <text x="480.00" y="145.92" text-anchor="start" font-size="20" fill="#047857" font-weight="650">y = 3</text>
    <text x="480.00" y="167.92" text-anchor="start" font-size="15" fill="#047857" font-weight="500">Two intersections</text>
    <path d="M 55.20 198.52 H 465" fill="none" stroke="#b45309" stroke-width="2.5" stroke-dasharray="8 5"/>
    <text x="480.00" y="195.52" text-anchor="start" font-size="20" fill="#b45309" font-weight="650">y = 1</text>
    <text x="480.00" y="217.52" text-anchor="start" font-size="15" fill="#b45309" font-weight="500">Tangent</text>
    <path d="M 55.20 248.12 H 465" fill="none" stroke="#526277" stroke-width="2.5" stroke-dasharray="8 5"/>
    <text x="480.00" y="245.12" text-anchor="start" font-size="20" fill="#526277" font-weight="650">y = −1</text>
    <text x="480.00" y="267.12" text-anchor="start" font-size="15" fill="#526277" font-weight="500">No intersection</text>
    <path d="M 71.70 37.26 Q 240.00 359.78 408.30 37.26" fill="none" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round"/>
    <circle cx="146.66" cy="148.92" r="5.6" fill="#047857" stroke="#f8fafc" stroke-width="1.7"/>
    <circle cx="333.34" cy="148.92" r="5.6" fill="#047857" stroke="#f8fafc" stroke-width="1.7"/>
    <circle cx="240.00" cy="198.52" r="5.6" fill="#b45309" stroke="#f8fafc" stroke-width="1.7"/>
    <text x="226.00" y="295.00" text-anchor="middle" font-size="20" fill="#1d4ed8" font-weight="650">y = (x − 2)² + 1</text>
  </g>
</svg>
