<svg xmlns="http://www.w3.org/2000/svg" width="520" height="440" viewBox="0 0 520 440" role="img" aria-labelledby="title desc">
<title id="title">GP: test the common ratio</title><desc id="desc">The valid triple 1,2,4 has common ratio 2. The triple 0,0,5 passes the squared-middle test but cannot satisfy a finite-ratio recurrence.</desc>
<rect width="520" height="440" rx="14" fill="#f5f9ff"/><g font-family="Arial, sans-serif">
<text x="24" y="34" font-size="20" text-anchor="start" fill="#243b53">GP: test the common ratio</text><text x="260" y="82" font-size="18" text-anchor="middle" fill="#243b53">A valid GP</text><rect x="65" y="107" width="70" height="56" rx="8" fill="#dbeafe"/><text x="100" y="143" font-size="24" text-anchor="middle" fill="#243b53">1</text><rect x="225" y="107" width="70" height="56" rx="8" fill="#dbeafe"/><text x="260" y="143" font-size="24" text-anchor="middle" fill="#243b53">2</text><rect x="385" y="107" width="70" height="56" rx="8" fill="#dbeafe"/><text x="420" y="143" font-size="24" text-anchor="middle" fill="#243b53">4</text><text x="170" y="128" font-size="16" text-anchor="middle" fill="#243b53">×2</text><line x1="147.000" y1="144.000" x2="193.000" y2="144.000" stroke="#1961ac" stroke-width="1.5"/><line x1="186.000" y1="139.000" x2="193.000" y2="144.000" stroke="#1961ac" stroke-width="1.5"/><line x1="186.000" y1="149.000" x2="193.000" y2="144.000" stroke="#1961ac" stroke-width="1.5"/><text x="330" y="128" font-size="16" text-anchor="middle" fill="#243b53">×2</text><line x1="307.000" y1="144.000" x2="353.000" y2="144.000" stroke="#1961ac" stroke-width="1.5"/><line x1="346.000" y1="139.000" x2="353.000" y2="144.000" stroke="#1961ac" stroke-width="1.5"/><line x1="346.000" y1="149.000" x2="353.000" y2="144.000" stroke="#1961ac" stroke-width="1.5"/><text x="260" y="203" font-size="17" text-anchor="middle" fill="#243b53">2² = 1 × 4, and both ratios equal 2</text><text x="260" y="254" font-size="18" text-anchor="middle" fill="#a32424">A zero-term warning</text><text x="260" y="289" font-size="21" text-anchor="middle" fill="#243b53">(0, 0, 5):   0² = 0 × 5</text><text x="260" y="326" font-size="19" text-anchor="middle" fill="#a32424">But 5 = r × 0 is impossible.</text><text x="260" y="358" font-size="16" text-anchor="middle" fill="#243b53">Use the original recurrence when zeros occur.</text><text x="24" y="407" font-size="14" text-anchor="start" fill="#243b53">The product condition alone can miss a zero case.</text>
</g></svg>
