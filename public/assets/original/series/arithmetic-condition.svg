<svg xmlns="http://www.w3.org/2000/svg" width="520" height="440" viewBox="0 0 520 440" role="img" aria-labelledby="title desc">
<title id="title">AP: equal differences</title><desc id="desc">The values −2,1,4 lie equally spaced on a number line, with a difference of 3. Twice the middle is the sum of the outer terms.</desc>
<rect width="520" height="440" rx="14" fill="#f5f9ff"/><g font-family="Arial, sans-serif">
<text x="24" y="34" font-size="20" text-anchor="start" fill="#243b53">AP: equal differences</text><text x="260" y="86" font-size="18" text-anchor="middle" fill="#243b53">Consecutive terms:  −2, 1, 4</text><line x1="70.000" y1="207.000" x2="450.000" y2="207.000" stroke="#243b53" stroke-width="1.5"/><line x1="110.000" y1="200.000" x2="110.000" y2="215.000" stroke="#1961ac" stroke-width="1.5"/><circle cx="110" cy="207" r="5" fill="#1961ac"/><text x="110" y="244" font-size="22" text-anchor="middle" fill="#243b53">−2</text><line x1="260.000" y1="200.000" x2="260.000" y2="215.000" stroke="#1961ac" stroke-width="1.5"/><circle cx="260" cy="207" r="5" fill="#1961ac"/><text x="260" y="244" font-size="22" text-anchor="middle" fill="#243b53">1</text><line x1="410.000" y1="200.000" x2="410.000" y2="215.000" stroke="#1961ac" stroke-width="1.5"/><circle cx="410" cy="207" r="5" fill="#1961ac"/><text x="410" y="244" font-size="22" text-anchor="middle" fill="#243b53">4</text><line x1="110.000" y1="154.000" x2="260.000" y2="154.000" stroke="#1961ac" stroke-width="1.5"/><line x1="251.000" y1="149.000" x2="260.000" y2="154.000" stroke="#1961ac" stroke-width="1.5"/><line x1="251.000" y1="159.000" x2="260.000" y2="154.000" stroke="#1961ac" stroke-width="1.5"/><text x="185.0" y="139" font-size="17" text-anchor="middle" fill="#243b53">+3</text><line x1="260.000" y1="154.000" x2="410.000" y2="154.000" stroke="#1961ac" stroke-width="1.5"/><line x1="401.000" y1="149.000" x2="410.000" y2="154.000" stroke="#1961ac" stroke-width="1.5"/><line x1="401.000" y1="159.000" x2="410.000" y2="154.000" stroke="#1961ac" stroke-width="1.5"/><text x="335.0" y="139" font-size="17" text-anchor="middle" fill="#243b53">+3</text><text x="260" y="304" font-size="22" text-anchor="middle" fill="#243b53">v − u = w − v</text><text x="260" y="344" font-size="22" text-anchor="middle" fill="#243b53">2v = u + w</text><text x="24" y="407" font-size="14" text-anchor="start" fill="#243b53">The condition remains valid when a term is zero.</text>
</g></svg>
