<svg xmlns="http://www.w3.org/2000/svg" width="600" height="350" viewBox="0 0 600 350" role="img" aria-labelledby="title desc"><title id="title">Classes 0 to 5, 5 to 15, 15 to 20 have frequencies 5, 10, 10 and densities 1, 1, 2.</title><desc id="desc">Classes 0 to 5, 5 to 15, 15 to 20 have frequencies 5, 10, 10 and densities 1, 1, 2.</desc><rect width="600" height="350" fill="white"/><g font-family="Arial, sans-serif" font-size="16" fill="#172033"><line x1="60" y1="280" x2="550" y2="280" stroke="#172033" stroke-width="1.5"/><line x1="60" y1="280" x2="60" y2="40" stroke="#172033" stroke-width="1.5"/><text x="300" y="330" text-anchor="middle">Recorded value</text><text x="140" y="25" text-anchor="middle">Frequency density</text><rect x="60" y="180" width="120" height="100" fill="#dbeafe" stroke="#172033" stroke-width="2"/><rect x="180" y="180" width="240" height="100" fill="#dbeafe" stroke="#172033" stroke-width="2"/><rect x="420" y="80" width="120" height="200" fill="#dbeafe" stroke="#172033" stroke-width="2"/><text x="60" y="306" text-anchor="middle">0</text><text x="180" y="306" text-anchor="middle">5</text><text x="300" y="306" text-anchor="middle">10</text><text x="420" y="306" text-anchor="middle">15</text><text x="540" y="306" text-anchor="middle">20</text><text x="35" y="186" text-anchor="middle">1</text><text x="35" y="86" text-anchor="middle">2</text></g></svg>