<svg xmlns="http://www.w3.org/2000/svg" width="640" height="350" viewBox="0 0 640 350" role="img" aria-labelledby="title desc"><title id="title">A race to two successes or two failures ends on SS or FF at trial two, or SFS,SFF,FSS,FSF at trial three. No other histories are allowed.</title><desc id="desc">A race to two successes or two failures ends on SS or FF at trial two, or SFS,SFF,FSS,FSF at trial three. No other histories are allowed.</desc><rect width="640" height="350" fill="white"/><g font-family="Arial, sans-serif" fill="#172033"><text x="320" y="32" text-anchor="middle" font-size="20">Stop at two successes or two failures</text><rect x="150" y="70" width="120" height="52" rx="6" fill="#dbeafe" stroke="#173b70"/><text x="210" y="104" text-anchor="middle" font-size="24">SS</text><rect x="370" y="70" width="120" height="52" rx="6" fill="#dbeafe" stroke="#173b70"/><text x="430" y="104" text-anchor="middle" font-size="24">FF</text><text x="320" y="155" text-anchor="middle" font-size="18">These stop after two trials</text><rect x="40" y="190" width="110" height="52" rx="6" fill="#e1f0e8" stroke="#173b70"/><text x="95" y="224" text-anchor="middle" font-size="24">SFS</text><rect x="190" y="190" width="110" height="52" rx="6" fill="#e1f0e8" stroke="#173b70"/><text x="245" y="224" text-anchor="middle" font-size="24">SFF</text><rect x="340" y="190" width="110" height="52" rx="6" fill="#e1f0e8" stroke="#173b70"/><text x="395" y="224" text-anchor="middle" font-size="24">FSS</text><rect x="490" y="190" width="110" height="52" rx="6" fill="#e1f0e8" stroke="#173b70"/><text x="545" y="224" text-anchor="middle" font-size="24">FSF</text><text x="320" y="279" text-anchor="middle" font-size="18">Only SF and FS continue to trial three</text><text x="320" y="327" text-anchor="middle" font-size="17">Six disjoint terminal histories; no extra trials after stopping</text></g></svg>