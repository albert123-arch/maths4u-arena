<svg xmlns="http://www.w3.org/2000/svg" width="640" height="350" viewBox="0 0 640 350" role="img" aria-labelledby="title desc"><title id="title">First-success paths for success probability one third. The final FFFF row groups all waiting times beyond four, not a point at five.</title><desc id="desc">First-success paths for success probability one third. The final FFFF row groups all waiting times beyond four, not a point at five.</desc><rect width="640" height="350" fill="white"/><g font-family="Arial, sans-serif" fill="#172033"><text x="320" y="30" text-anchor="middle" font-size="20">First success with probability one third</text><text x="145" y="62" text-anchor="middle" font-size="17">History shown</text><text x="335" y="62" text-anchor="middle" font-size="17">Event</text><text x="510" y="62" text-anchor="middle" font-size="17">Probability</text><text x="145" y="88" text-anchor="middle" font-size="22">S</text><text x="335" y="88" text-anchor="middle" font-size="20">T = 1</text><g aria-label="1 over 3"><text x="510" y="80" text-anchor="middle" font-size="14">1</text><path d="M505 83H515" fill="none" stroke="#172033" stroke-width="1.25"/><text x="510" y="96" text-anchor="middle" font-size="14">3</text></g><text x="145" y="132" text-anchor="middle" font-size="22">FS</text><text x="335" y="132" text-anchor="middle" font-size="20">T = 2</text><g aria-label="2 over 9"><text x="510" y="124" text-anchor="middle" font-size="14">2</text><path d="M505 127H515" fill="none" stroke="#172033" stroke-width="1.25"/><text x="510" y="140" text-anchor="middle" font-size="14">9</text></g><text x="145" y="176" text-anchor="middle" font-size="22">FFS</text><text x="335" y="176" text-anchor="middle" font-size="20">T = 3</text><g aria-label="4 over 27"><text x="510" y="168" text-anchor="middle" font-size="14">4</text><path d="M502.2 171H517.8" fill="none" stroke="#172033" stroke-width="1.25"/><text x="510" y="184" text-anchor="middle" font-size="14">27</text></g><text x="145" y="220" text-anchor="middle" font-size="22">FFFS</text><text x="335" y="220" text-anchor="middle" font-size="20">T = 4</text><g aria-label="8 over 81"><text x="510" y="212" text-anchor="middle" font-size="14">8</text><path d="M502.2 215H517.8" fill="none" stroke="#172033" stroke-width="1.25"/><text x="510" y="228" text-anchor="middle" font-size="14">81</text></g><text x="145" y="264" text-anchor="middle" font-size="22">FFFF</text><text x="335" y="264" text-anchor="middle" font-size="20">T &gt; 4</text><g aria-label="16 over 81"><text x="510" y="256" text-anchor="middle" font-size="14">16</text><path d="M502.2 259H517.8" fill="none" stroke="#172033" stroke-width="1.25"/><text x="510" y="272" text-anchor="middle" font-size="14">81</text></g><text x="320" y="332" text-anchor="middle" font-size="17">FFFF is a remaining tail, not a success on trial 5</text></g></svg>