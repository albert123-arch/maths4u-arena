<svg xmlns="http://www.w3.org/2000/svg" width="640" height="350" viewBox="0 0 640 350" role="img" aria-labelledby="title desc"><title id="title">First-success paths for success probability one third. The final FFFF row groups all waiting times beyond four, not a point at five.</title><desc id="desc">First-success paths for success probability one third. The final FFFF row groups all waiting times beyond four, not a point at five.</desc><rect width="640" height="350" fill="white"/><g font-family="Arial, sans-serif" fill="#172033"><text x="320" y="30" text-anchor="middle" font-size="20">First success: p = 1/3</text><text x="145" y="62" text-anchor="middle" font-size="17">History shown</text><text x="335" y="62" text-anchor="middle" font-size="17">Event</text><text x="510" y="62" text-anchor="middle" font-size="17">Probability</text><text x="145" y="88" text-anchor="middle" font-size="22">S</text><text x="335" y="88" text-anchor="middle" font-size="20">T = 1</text><text x="510" y="88" text-anchor="middle" font-size="20">1/3</text><text x="145" y="132" text-anchor="middle" font-size="22">FS</text><text x="335" y="132" text-anchor="middle" font-size="20">T = 2</text><text x="510" y="132" text-anchor="middle" font-size="20">2/9</text><text x="145" y="176" text-anchor="middle" font-size="22">FFS</text><text x="335" y="176" text-anchor="middle" font-size="20">T = 3</text><text x="510" y="176" text-anchor="middle" font-size="20">4/27</text><text x="145" y="220" text-anchor="middle" font-size="22">FFFS</text><text x="335" y="220" text-anchor="middle" font-size="20">T = 4</text><text x="510" y="220" text-anchor="middle" font-size="20">8/81</text><text x="145" y="264" text-anchor="middle" font-size="22">FFFF</text><text x="335" y="264" text-anchor="middle" font-size="20">T &gt; 4</text><text x="510" y="264" text-anchor="middle" font-size="20">16/81</text><text x="320" y="332" text-anchor="middle" font-size="17">FFFF is a remaining tail, not a success on trial 5</text></g></svg>