<svg xmlns="http://www.w3.org/2000/svg" width="640" height="350" viewBox="0 0 640 350" role="img" aria-labelledby="title desc"><title id="title">Binomial with four trials and success probability one half has probabilities 1/16,1/4,3/8,1/4,1/16 at counts zero to four.</title><desc id="desc">Binomial with four trials and success probability one half has probabilities 1/16,1/4,3/8,1/4,1/16 at counts zero to four.</desc><rect width="640" height="350" fill="white"/><g font-family="Arial, sans-serif" fill="#172033"><text x="320" y="32" text-anchor="middle" font-size="20">Four trials, success probability 1/2</text><path d="M65 70V265H595" fill="none" stroke="#172033" stroke-width="2"/><rect x="88" y="240.0" width="44" height="25.0" fill="#2857a5"/><text x="110" y="292" text-anchor="middle" font-size="20">0</text><text x="110" y="225.0" text-anchor="middle" font-size="18">1/16</text><rect x="193" y="165.0" width="44" height="100.0" fill="#2857a5"/><text x="215" y="292" text-anchor="middle" font-size="20">1</text><text x="215" y="150.0" text-anchor="middle" font-size="18">1/4</text><rect x="298" y="115.0" width="44" height="150.0" fill="#2857a5"/><text x="320" y="292" text-anchor="middle" font-size="20">2</text><text x="320" y="100.0" text-anchor="middle" font-size="18">3/8</text><rect x="403" y="165.0" width="44" height="100.0" fill="#2857a5"/><text x="425" y="292" text-anchor="middle" font-size="20">3</text><text x="425" y="150.0" text-anchor="middle" font-size="18">1/4</text><rect x="508" y="240.0" width="44" height="25.0" fill="#2857a5"/><text x="530" y="292" text-anchor="middle" font-size="20">4</text><text x="530" y="225.0" text-anchor="middle" font-size="18">1/16</text><text x="320" y="330" text-anchor="middle" font-size="17">X counts successes; every count from 0 to 4 is possible</text></g></svg>