<svg xmlns="http://www.w3.org/2000/svg" width="640" height="380" viewBox="0 0 640 380" role="img" aria-labelledby="title desc"><title id="title">A-only is 7/20, intersection 1/4, B-only 1/4 and neither 3/20.</title><desc id="desc">A-only is 7/20, intersection 1/4, B-only 1/4 and neither 3/20.</desc><rect width="640" height="380" fill="white"/><g font-family="Arial, sans-serif" fill="#172033"><rect x="60" y="50" width="520" height="280" fill="white" stroke="#172033"/><circle cx="260" cy="185" r="100" fill="#dbeafe" fill-opacity=".65" stroke="#172033" stroke-width="2"/><circle cx="380" cy="185" r="100" fill="#ffedd5" fill-opacity=".55" stroke="#172033" stroke-width="2"/><text x="210" y="185" text-anchor="middle" font-size="22">7/20</text><text x="320" y="185" text-anchor="middle" font-size="22">1/4</text><text x="430" y="185" text-anchor="middle" font-size="22">1/4</text><text x="520" y="305" text-anchor="middle" font-size="22">3/20</text><text x="230" y="70" text-anchor="middle" font-size="22">A</text><text x="410" y="70" text-anchor="middle" font-size="22">B</text><text x="320" y="365" text-anchor="middle" font-size="18">The four disjoint regions sum to 1</text></g></svg>