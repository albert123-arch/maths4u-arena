<svg xmlns="http://www.w3.org/2000/svg" width="640" height="380" viewBox="0 0 640 380" role="img" aria-labelledby="title desc"><title id="title">Choose A with probability 1/3 or B with probability 2/3. Success chances are 3/4 and 2/5; the four joint probabilities are 1/4, 1/12, 4/15 and 2/5.</title><desc id="desc">Choose A with probability 1/3 or B with probability 2/3. Success chances are 3/4 and 2/5; the four joint probabilities are 1/4, 1/12, 4/15 and 2/5.</desc><rect width="640" height="380" fill="white"/><g font-family="Arial, sans-serif" fill="#172033"><text x="320" y="25" text-anchor="middle" font-size="18">Multiply along paths; add disjoint paths</text><line x1="70" y1="180" x2="245" y2="100" stroke="#172033" stroke-width="2"/><line x1="70" y1="180" x2="245" y2="270" stroke="#172033" stroke-width="2"/><line x1="245" y1="100" x2="450" y2="60" stroke="#172033" stroke-width="2"/><line x1="245" y1="100" x2="450" y2="150" stroke="#172033" stroke-width="2"/><line x1="245" y1="270" x2="450" y2="230" stroke="#172033" stroke-width="2"/><line x1="245" y1="270" x2="450" y2="320" stroke="#172033" stroke-width="2"/><text x="145" y="125" text-anchor="middle" font-size="18">1/3</text><text x="145" y="260" text-anchor="middle" font-size="18">2/3</text><text x="245" y="85" text-anchor="middle" font-size="18">A</text><text x="245" y="260" text-anchor="middle" font-size="18">B</text><text x="345" y="70" text-anchor="middle" font-size="18">3/4</text><text x="345" y="140" text-anchor="middle" font-size="18">1/4</text><text x="345" y="235" text-anchor="middle" font-size="18">2/5</text><text x="345" y="315" text-anchor="middle" font-size="18">3/5</text><text x="475" y="65" text-anchor="middle" font-size="18">S</text><text x="475" y="155" text-anchor="middle" font-size="18">not S</text><text x="475" y="235" text-anchor="middle" font-size="18">S</text><text x="475" y="325" text-anchor="middle" font-size="18">not S</text><text x="560" y="65" text-anchor="middle" font-size="18">1/4</text><text x="560" y="155" text-anchor="middle" font-size="18">1/12</text><text x="560" y="235" text-anchor="middle" font-size="18">4/15</text><text x="560" y="325" text-anchor="middle" font-size="18">2/5</text><text x="320" y="370" text-anchor="middle" font-size="18">S = success; right-hand values are joint probabilities</text></g></svg>