<svg xmlns="http://www.w3.org/2000/svg" width="520" height="440" viewBox="0 0 520 440" role="img" aria-labelledby="title desc">
<title id="title">One region, two geometric quantities</title><desc id="desc">The curve y=2x²−4x+5 lies below y=5 between 0 and 2 and remains positive. Area uses 5−y and equals 8/3. Rotation about the x-axis uses washers with radii 5 and y, hence integrand π(25−y²).</desc>
