<svg xmlns="http://www.w3.org/2000/svg" width="520" height="440" viewBox="0 0 520 440" role="img" aria-labelledby="title desc">
<title id="title">Coefficient → ratio → tail</title><desc id="desc">The x² coefficient of (1+rx)^4 is 6r². If it equals 3/2 and 0&lt;r&lt;1, r=1/2. A GP with first term 3 then has infinite sum 6 and omitted tail 6·2⁻ⁿ.</desc>
<rect width="520" height="440" rx="14" fill="#f5f9ff"/><g font-family="Arial, sans-serif">
<text x="24" y="35" font-size="20" text-anchor="start" fill="#243b53">Coefficient → ratio → tail</text><text x="260" y="67" font-size="17" text-anchor="middle" fill="#243b53">0 &lt; r &lt; 1; GP first term 3</text><rect x="64" y="86" width="392" height="60" rx="9" fill="#dbeafe"/><text x="260" y="123" font-size="19" text-anchor="middle" fill="#243b53">(1 + rx)⁴:  x² coefficient = 3/2</text><line x1="260.000000" y1="149.000000" x2="260.000000" y2="159.000000" stroke="#1961ac" stroke-width="1.5"/><line x1="255.000000" y1="154.000000" x2="260.000000" y2="159.000000" stroke="#1961ac" stroke-width="1.5"/><line x1="265.000000" y1="154.000000" x2="260.000000" y2="159.000000" stroke="#1961ac" stroke-width="1.5"/><rect x="64" y="161" width="392" height="60" rx="9" fill="#dbeafe"/><text x="260" y="198" font-size="19" text-anchor="middle" fill="#243b53">6r² = 3/2   ⇒   r = 1/2</text><line x1="260.000000" y1="224.000000" x2="260.000000" y2="234.000000" stroke="#1961ac" stroke-width="1.5"/><line x1="255.000000" y1="229.000000" x2="260.000000" y2="234.000000" stroke="#1961ac" stroke-width="1.5"/><line x1="265.000000" y1="229.000000" x2="260.000000" y2="234.000000" stroke="#1961ac" stroke-width="1.5"/><rect x="64" y="236" width="392" height="60" rx="9" fill="#dbeafe"/><text x="260" y="273" font-size="19" text-anchor="middle" fill="#243b53">S∞ = 3 / (1 − r) = 6</text><line x1="260.000000" y1="299.000000" x2="260.000000" y2="309.000000" stroke="#1961ac" stroke-width="1.5"/><line x1="255.000000" y1="304.000000" x2="260.000000" y2="309.000000" stroke="#1961ac" stroke-width="1.5"/><line x1="265.000000" y1="304.000000" x2="260.000000" y2="309.000000" stroke="#1961ac" stroke-width="1.5"/><rect x="64" y="311" width="392" height="60" rx="9" fill="#dbeafe"/><text x="260" y="348" font-size="19" text-anchor="middle" fill="#243b53">Rₙ = 6 × 2⁻ⁿ</text><text x="24" y="410" font-size="14" text-anchor="start" fill="#243b53">The positive-ratio condition selects one square root.</text></g></svg>
