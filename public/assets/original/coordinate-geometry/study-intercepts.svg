<svg xmlns="http://www.w3.org/2000/svg" width="480" height="309" viewBox="0 0 480 309" role="img" aria-labelledby="title description">
  <title id="title">Where a line meets the axes</title>
  <desc id="description">The line 2y = x + 5 meets the axes at (−5, 0) and (0, 5/2). The shaded intercept triangle also has the origin as a vertex.</desc>
  <rect x="1" y="1" width="478" height="307" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <g font-family="Inter, system-ui, sans-serif" font-size="19">
    <polygon points="70,207 220,207 220,132" fill="#e1edff"/>
    <path d="M31 207H431m-8-5 8 5-8 5M220 280V32m-5 8 5-8 5 8" fill="none" stroke="#53647c" stroke-width="1.7"/>
    <text x="443" y="213" text-anchor="start" fill="#243449" stroke="#f8fafc" stroke-width="3" paint-order="stroke fill" font-weight="520">x</text>
    <text x="208" y="36" text-anchor="end" fill="#243449" stroke="#f8fafc" stroke-width="3" paint-order="stroke fill" font-weight="520">y</text>
    <path d="M34 225L418 33" fill="none" stroke="#1d4ed8" stroke-width="3.5"/>
    <circle cx="130" cy="177" r="5" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="0"/>
    <circle cx="370" cy="57" r="5" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="0"/>
    <circle cx="70" cy="207" r="5" fill="#16726b" stroke="#16726b" stroke-width="0"/>
    <circle cx="220" cy="132" r="5" fill="#16726b" stroke="#16726b" stroke-width="0"/>
    <text x="68" y="232" text-anchor="middle" fill="#16726b" stroke="#f8fafc" stroke-width="3" paint-order="stroke fill" font-weight="520">(−5, 0)</text>
    <text x="231" y="142" text-anchor="start" fill="#16726b" stroke="#f8fafc" stroke-width="3" paint-order="stroke fill" font-weight="520">(0, 5/2)</text>
    <text x="230" y="229" text-anchor="start" fill="#243449" stroke="#f8fafc" stroke-width="3" paint-order="stroke fill" font-weight="520">O</text>
    <text x="120" y="167" text-anchor="end" fill="#1d4ed8" stroke="#f8fafc" stroke-width="3" paint-order="stroke fill" font-weight="520">A</text>
    <text x="383" y="58" text-anchor="start" fill="#1d4ed8" stroke="#f8fafc" stroke-width="3" paint-order="stroke fill" font-weight="520">B</text>
    <text x="294" y="119" text-anchor="start" fill="#1d4ed8" stroke="#f8fafc" stroke-width="3" paint-order="stroke fill" font-weight="520">2y = x + 5</text>
  </g>
</svg>
