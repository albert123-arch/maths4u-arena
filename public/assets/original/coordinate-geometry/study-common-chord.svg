<svg xmlns="http://www.w3.org/2000/svg" width="480" height="328" viewBox="0 0 480 328" role="img" aria-labelledby="title description">
  <title id="title">The two intersections of two circles</title>
  <desc id="description">The two radius-five circles meet at (3, 4) and (3, −4). The common chord lies on x = 3.</desc>
  <rect x="1" y="1" width="478" height="326" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <g font-family="Inter, system-ui, sans-serif" font-size="19">
    <path d="M30 163H438m-8-5 8 5-8 5M155 305V28m-5 8 5-8 5 8" fill="none" stroke="#53647c" stroke-width="1.7"/>
    <text x="450" y="169" text-anchor="start" fill="#243449" stroke="#f8fafc" stroke-width="3" paint-order="stroke fill" font-weight="520">x</text>
    <text x="143" y="32" text-anchor="end" fill="#243449" stroke="#f8fafc" stroke-width="3" paint-order="stroke fill" font-weight="520">y</text>
    <circle cx="155" cy="163" r="120" fill="none" stroke="#1d4ed8" stroke-width="3"/>
    <circle cx="299" cy="163" r="120" fill="none" stroke="#16726b" stroke-width="3"/>
    <path d="M227 298.6L227 31.96" fill="none" stroke="#69429a" stroke-width="2.7"/>
    <circle cx="227" cy="67" r="5" fill="#69429a" stroke="#69429a" stroke-width="0"/>
    <circle cx="227" cy="259" r="5" fill="#69429a" stroke="#69429a" stroke-width="0"/>
    <circle cx="155" cy="163" r="5" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="0"/>
    <circle cx="299" cy="163" r="5" fill="#16726b" stroke="#16726b" stroke-width="0"/>
    <text x="142" y="185" text-anchor="end" fill="#1d4ed8" stroke="#f8fafc" stroke-width="3" paint-order="stroke fill" font-weight="520">(0, 0)</text>
    <text x="309" y="186" text-anchor="start" fill="#16726b" stroke="#f8fafc" stroke-width="3" paint-order="stroke fill" font-weight="520">(6, 0)</text>
    <text x="239" y="65" text-anchor="start" fill="#69429a" stroke="#f8fafc" stroke-width="3" paint-order="stroke fill" font-weight="520">(3, 4)</text>
    <text x="238" y="266" text-anchor="start" fill="#69429a" stroke="#f8fafc" stroke-width="3" paint-order="stroke fill" font-weight="520">(3, −4)</text>
    <text x="241" y="36" text-anchor="start" fill="#69429a" stroke="#f8fafc" stroke-width="3" paint-order="stroke fill" font-weight="520">x = 3</text>
  </g>
