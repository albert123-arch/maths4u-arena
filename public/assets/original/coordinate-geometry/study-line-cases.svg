<svg xmlns="http://www.w3.org/2000/svg" width="480" height="365" viewBox="0 0 480 365" role="img" aria-labelledby="title description">
  <title id="title">A secant, a tangent and a line with no intersection</title>
  <desc id="description">For this circle the line y = x + 1 crosses twice. The line y = x + 7 touches at (−2, 5). The line y = x + 9 misses.</desc>
  <rect x="1" y="1" width="478" height="363" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <g font-family="Inter, system-ui, sans-serif" font-size="19">
    <path d="M33 250H428m-8-5 8 5-8 5M191 332V69m-5 8 5-8 5 8" fill="none" stroke="#53647c" stroke-width="1.7"/>
    <text x="440" y="256" text-anchor="start" fill="#243449" stroke="#f8fafc" stroke-width="3" paint-order="stroke fill" font-weight="520">x</text>
    <text x="179" y="73" text-anchor="end" fill="#243449" stroke="#f8fafc" stroke-width="3" paint-order="stroke fill" font-weight="520">y</text>
    <circle cx="217" cy="198" r="110.309" fill="none" stroke="#1d4ed8" stroke-width="3"/>
    <path d="M92.2 322.8L349.6 65.4" fill="none" stroke="#1d4ed8" stroke-width="3"/>
    <path d="M45.4 213.6L193.6 65.4" fill="none" stroke="#16726b" stroke-width="3"/>
    <path d="M45.4 161.6L141.6 65.4" fill="none" stroke="#7486a1" stroke-width="2.5" stroke-dasharray="6 4"/>
    <circle cx="139" cy="276" r="5" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="0"/>
    <circle cx="295" cy="120" r="5" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="0"/>
    <circle cx="139" cy="120" r="5" fill="#16726b" stroke="#16726b" stroke-width="0"/>
    <circle cx="217" cy="198" r="5" fill="#69429a" stroke="#69429a" stroke-width="0"/>
    <text x="143" y="319" text-anchor="middle" fill="#1d4ed8" stroke="#f8fafc" stroke-width="3" paint-order="stroke fill" font-weight="520">(−2, −1)</text>
    <text x="310" y="128" text-anchor="start" fill="#1d4ed8" stroke="#f8fafc" stroke-width="3" paint-order="stroke fill" font-weight="520">(4, 5)</text>
    <text x="130" y="114" text-anchor="end" fill="#16726b" stroke="#f8fafc" stroke-width="3" paint-order="stroke fill" font-weight="520">(−2, 5)</text>
    <text x="57" y="31" text-anchor="start" fill="#1d4ed8" stroke="#f8fafc" stroke-width="3" paint-order="stroke fill" font-weight="520">Secant</text>
    <text x="59" y="54" text-anchor="start" fill="#1d4ed8" stroke="#f8fafc" stroke-width="3" paint-order="stroke fill" font-weight="520">k = 1</text>
    <text x="201" y="31" text-anchor="start" fill="#16726b" stroke="#f8fafc" stroke-width="3" paint-order="stroke fill" font-weight="520">Tangent</text>
    <text x="206" y="54" text-anchor="start" fill="#16726b" stroke="#f8fafc" stroke-width="3" paint-order="stroke fill" font-weight="520">k = 7</text>
    <text x="353" y="31" text-anchor="start" fill="#53647c" stroke="#f8fafc" stroke-width="3" paint-order="stroke fill" font-weight="520">Misses</text>
    <text x="356" y="54" text-anchor="start" fill="#53647c" stroke="#f8fafc" stroke-width="3" paint-order="stroke fill" font-weight="520">k = 9</text>
  </g>
</svg>
