<svg xmlns="http://www.w3.org/2000/svg" width="480" height="319" viewBox="0 0 480 319" role="img" aria-labelledby="title description">
  <title id="title">The bisector of a vertical segment</title>
  <desc id="description">Both endpoints of the segment have x-coordinate −2. The perpendicular bisector is horizontal through the midpoint (−2, 3).</desc>
  <rect x="1" y="1" width="478" height="317" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <g font-family="Inter, system-ui, sans-serif" font-size="19">
    <path d="M31 248H428m-8-5 8 5-8 5M241 291V38m-5 8 5-8 5 8" fill="none" stroke="#53647c" stroke-width="1.7"/>
    <text x="440" y="254" text-anchor="start" fill="#243449" stroke="#f8fafc" stroke-width="3" paint-order="stroke fill" font-weight="520">x</text>
    <text x="229" y="42" text-anchor="end" fill="#243449" stroke="#f8fafc" stroke-width="3" paint-order="stroke fill" font-weight="520">y</text>
    <path d="M189 274L189 66" fill="none" stroke="#1d4ed8" stroke-width="4"/>
    <path d="M59 170L423 170" fill="none" stroke="#16726b" stroke-width="3"/>
    <path d="M189 158L201 158L201 170" fill="none" stroke="#7486a1" stroke-width="1.6"/>
    <circle cx="189" cy="274" r="5" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="0"/>
    <circle cx="189" cy="66" r="5" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="0"/>
    <circle cx="189" cy="170" r="5" fill="#69429a" stroke="#69429a" stroke-width="0"/>
    <text x="179" y="61" text-anchor="end" fill="#1d4ed8" stroke="#f8fafc" stroke-width="3" paint-order="stroke fill" font-weight="520">(−2, 7)</text>
    <text x="179" y="282" text-anchor="end" fill="#1d4ed8" stroke="#f8fafc" stroke-width="3" paint-order="stroke fill" font-weight="520">(−2, −1)</text>
    <text x="177" y="192" text-anchor="end" fill="#69429a" stroke="#f8fafc" stroke-width="3" paint-order="stroke fill" font-weight="520">(−2, 3)</text>
    <text x="345" y="155" text-anchor="start" fill="#16726b" stroke="#f8fafc" stroke-width="3" paint-order="stroke fill" font-weight="520">y = 3</text>
    <text x="105" y="111" text-anchor="start" fill="#1d4ed8" stroke="#f8fafc" stroke-width="3" paint-order="stroke fill" font-weight="520">x = −2</text>
  </g>
</svg>
