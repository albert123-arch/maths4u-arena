<svg xmlns="http://www.w3.org/2000/svg" width="480" height="348" viewBox="0 0 480 348" role="img" aria-labelledby="title description">
  <title id="title">Two intersections on y = x</title>
  <desc id="description">The line y = x meets the circle at (−1, −1) and (5, 5). Its centre is (1, 3).</desc>
  <rect x="1" y="1" width="478" height="346" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <g font-family="Inter, system-ui, sans-serif" font-size="19">
    <path d="M34 255H428m-8-5 8 5-8 5M204 320V35m-5 8 5-8 5 8" fill="none" stroke="#53647c" stroke-width="1.7"/>
    <text x="440" y="261" text-anchor="start" fill="#243449" stroke="#f8fafc" stroke-width="3" paint-order="stroke fill" font-weight="520">x</text>
    <text x="192" y="39" text-anchor="end" fill="#243449" stroke="#f8fafc" stroke-width="3" paint-order="stroke fill" font-weight="520">y</text>
    <circle cx="230" cy="177" r="116.276" fill="none" stroke="#1d4ed8" stroke-width="3"/>
    <path d="M136.4 322.6L412 47" fill="none" stroke="#16726b" stroke-width="3.45"/>
    <circle cx="230" cy="177" r="5" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="0"/>
    <circle cx="178" cy="281" r="5" fill="#16726b" stroke="#16726b" stroke-width="0"/>
    <circle cx="334" cy="125" r="5" fill="#16726b" stroke="#16726b" stroke-width="0"/>
    <text x="167" y="287" text-anchor="end" fill="#16726b" stroke="#f8fafc" stroke-width="3" paint-order="stroke fill" font-weight="520">(−1, −1)</text>
    <text x="345" y="131" text-anchor="start" fill="#16726b" stroke="#f8fafc" stroke-width="3" paint-order="stroke fill" font-weight="520">(5, 5)</text>
    <text x="222" y="159" text-anchor="start" fill="#1d4ed8" stroke="#f8fafc" stroke-width="3" paint-order="stroke fill" font-weight="520">C (1, 3)</text>
    <text x="417" y="44" text-anchor="start" fill="#16726b" stroke="#f8fafc" stroke-width="3" paint-order="stroke fill" font-weight="520">y = x</text>
  </g>
</svg>
