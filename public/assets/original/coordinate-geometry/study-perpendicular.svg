    <text x="226" y="41" text-anchor="end" fill="#243449" stroke="#f8fafc" stroke-width="3" paint-order="stroke fill" font-weight="520">y</text>
    <path d="M40.4 310.8L427.8 117.1" fill="none" stroke="#1d4ed8" stroke-width="3"/>
    <path d="M183.4 37.8L323.28 317.56" fill="none" stroke="#16726b" stroke-width="3"/>
    <path d="M264 199L368 199" fill="none" stroke="#7486a1" stroke-width="1.55" stroke-dasharray="5 4"/>
