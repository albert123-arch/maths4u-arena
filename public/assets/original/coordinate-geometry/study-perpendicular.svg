<svg xmlns="http://www.w3.org/2000/svg" width="480" height="346" viewBox="0 0 480 346" role="img" aria-labelledby="title description">
  <title id="title">A quarter turn changes the gradient</title>
  <desc id="description">AB has gradient one half. The line through its midpoint C (1, 3) at right angles to it has gradient −2.</desc>
