    <circle cx="264" cy="199" r="5" fill="#69429a" stroke="#69429a" stroke-width="0"/>
    <circle cx="160" cy="251" r="5" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="0"/>
    <circle cx="368" cy="147" r="5" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="0"/>
    <circle cx="212" cy="95" r="5" fill="#16726b" stroke="#16726b" stroke-width="0"/>
    <text x="151" y="250" text-anchor="end" fill="#1d4ed8" stroke="#f8fafc" stroke-width="3" paint-order="stroke fill" font-weight="520">A</text>
    <text x="379" y="145" text-anchor="start" fill="#1d4ed8" stroke="#f8fafc" stroke-width="3" paint-order="stroke fill" font-weight="520">B</text>
    <text x="277" y="170" text-anchor="start" fill="#69429a" stroke="#f8fafc" stroke-width="3" paint-order="stroke fill" font-weight="520">C (1, 3)</text>
    <text x="315" y="222" text-anchor="middle" fill="#1d4ed8" stroke="#f8fafc" stroke-width="3" paint-order="stroke fill" font-weight="520">right 4</text>
    <text x="378" y="177" text-anchor="start" fill="#1d4ed8" stroke="#f8fafc" stroke-width="3" paint-order="stroke fill" font-weight="520">up 2</text>
    <text x="202" y="213" text-anchor="end" fill="#16726b" stroke="#f8fafc" stroke-width="3" paint-order="stroke fill" font-weight="520">left 2</text>
    <text x="200" y="150" text-anchor="end" fill="#16726b" stroke="#f8fafc" stroke-width="3" paint-order="stroke fill" font-weight="520">up 4</text>
    <text x="82" y="71" text-anchor="start" fill="#16726b" stroke="#f8fafc" stroke-width="3" paint-order="stroke fill" font-weight="520">m = −2</text>
