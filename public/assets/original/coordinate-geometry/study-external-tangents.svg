<svg xmlns="http://www.w3.org/2000/svg" width="480" height="390" viewBox="0 0 480 390" role="img" aria-labelledby="title description">
  <title id="title">Two tangents from one external point</title>
  <desc id="description">The circle centred at C (1, 3) has squared radius 20. The tangents from P (1, 13) touch it at (−3, 5) and (5, 5). The vertical line x = 1 passes through the centre.</desc>
  <rect x="1" y="1" width="478" height="388" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <g font-family="Inter, system-ui, sans-serif" font-size="19" fill="#334155">
    <path d="M31 335H433m-8-5 8 5-8 5M211 369V35m-5 8 5-8 5 8" fill="none" stroke="#53647c" stroke-width="1.7"/>
    <text x="445" y="341">x</text><text x="190" y="42">y</text>
    <circle cx="231" cy="275" r="89.443" fill="none" stroke="#2457d6" stroke-width="3"/>
    <path d="M231 75V364" stroke="#7486a1" stroke-width="1.7" stroke-dasharray="5 5"/>
    <path d="M115 307L231 75" fill="none" stroke="#16726b" stroke-width="3.4"/>
    <path d="M231 75L347 307" fill="none" stroke="#1d4ed8" stroke-width="3.4"/>
    <path d="M151 235L231 275L311 235" fill="none" stroke="#7486a1" stroke-width="1.8"/>
    <path d="M161.733 240.367L167.100 229.634L156.367 224.267M300.267 240.367L294.900 229.634L305.633 224.267" fill="none" stroke="#53647c" stroke-width="1.5"/>
    <circle cx="231" cy="75" r="5.5" fill="#69429a"/>
    <circle cx="151" cy="235" r="5" fill="#16726b"/>
    <circle cx="311" cy="235" r="5" fill="#1d4ed8"/>
    <circle cx="231" cy="275" r="5" fill="#69429a"/>
    <text x="245" y="66" fill="#69429a">P (1, 13)</text>
    <text x="171" y="173" text-anchor="end" fill="#16726b">m = 2</text>
    <text x="288" y="167" fill="#1d4ed8">m = −2</text>
    <text x="138" y="231" text-anchor="end" fill="#16726b">(−3, 5)</text>
    <text x="325" y="231" fill="#1d4ed8">(5, 5)</text>
    <text x="243" y="294" fill="#69429a">C (1, 3)</text>
    <text x="244" y="379" fill="#53647c">x = 1</text>
  </g>
</svg>
