    <text x="169" y="45" text-anchor="end" fill="#243449" stroke="#f8fafc" stroke-width="3" paint-order="stroke fill" font-weight="520">y</text>
    <path d="M94 232L326 116" fill="none" stroke="#7486a1" stroke-width="1.7" stroke-dasharray="5 4"/>
    <path d="M94 232L181 116" fill="none" stroke="#16726b" stroke-width="3"/>
