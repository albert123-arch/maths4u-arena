<svg xmlns="http://www.w3.org/2000/svg" width="480" height="318" viewBox="0 0 480 318" role="img" aria-labelledby="title description">
  <title id="title">Length and midpoint of AB</title>
  <desc id="description">A is at (−3, 1), B at (5, 5) and the midpoint C at (1, 3). A right-angled guide shows the horizontal change 8 and vertical change 4.</desc>
  <rect x="1" y="1" width="478" height="316" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <g font-family="Inter, system-ui, sans-serif" font-size="19">
    <path d="M33 252H427m-8-5 8 5-8 5M180 288V43m-5 8 5-8 5 8" fill="none" stroke="#53647c" stroke-width="1.7"/>
    <text x="439" y="258" text-anchor="start" fill="#243449" stroke="#f8fafc" stroke-width="3" paint-order="stroke fill" font-weight="520">x</text>
    <text x="168" y="47" text-anchor="end" fill="#243449" stroke="#f8fafc" stroke-width="3" paint-order="stroke fill" font-weight="520">y</text>
    <path d="M96 224L320 224" fill="none" stroke="#7486a1" stroke-width="1.8" stroke-dasharray="5 4"/>
    <path d="M320 224L320 112" fill="none" stroke="#7486a1" stroke-width="1.8" stroke-dasharray="5 4"/>
    <path d="M308 224L308 212L320 212" fill="none" stroke="#7486a1" stroke-width="1.6"/>
    <path d="M96 224L320 112" fill="none" stroke="#1d4ed8" stroke-width="3.6"/>
    <circle cx="96" cy="224" r="5" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="0"/>
    <circle cx="320" cy="112" r="5" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="0"/>
    <circle cx="208" cy="168" r="5" fill="#16726b" stroke="#16726b" stroke-width="0"/>
    <text x="85" y="217" text-anchor="end" fill="#1d4ed8" stroke="#f8fafc" stroke-width="3" paint-order="stroke fill" font-weight="520">A (−3, 1)</text>
    <text x="331" y="106" text-anchor="start" fill="#1d4ed8" stroke="#f8fafc" stroke-width="3" paint-order="stroke fill" font-weight="520">B (5, 5)</text>
    <text x="220" y="186" text-anchor="start" fill="#16726b" stroke="#f8fafc" stroke-width="3" paint-order="stroke fill" font-weight="520">C (1, 3)</text>
    <text x="235" y="245" text-anchor="middle" fill="#243449" stroke="#f8fafc" stroke-width="3" paint-order="stroke fill" font-weight="520">Δx = 8</text>
    <text x="331" y="181" text-anchor="start" fill="#243449" stroke="#f8fafc" stroke-width="3" paint-order="stroke fill" font-weight="520">Δy = 4</text>
  </g>
</svg>
