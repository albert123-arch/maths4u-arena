    <text x="192" y="41" text-anchor="end" fill="#243449" stroke="#f8fafc" stroke-width="3" paint-order="stroke fill" font-weight="520">y</text>
    <circle cx="230" cy="177" r="116.276" fill="none" stroke="#1d4ed8" stroke-width="3"/>
