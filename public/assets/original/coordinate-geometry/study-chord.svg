    <circle cx="230" cy="125" r="5" fill="#69429a" stroke="#69429a" stroke-width="0"/>
    <text x="116" y="140" text-anchor="end" fill="#16726b" stroke="#f8fafc" stroke-width="3" paint-order="stroke fill" font-weight="520">(−3, 5)</text>
