name: Hostinger preview package

on:
  push:
    branches: [main, 'release/arena-d-*', codex/personal-learning, hostinger-preview, codex/learning-review-ux, codex/five-course-import, codex/smartboard-lessons, codex/assignment-source-privacy]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-node22:
    # Preview verification only. This workflow never deploys or uses production secrets.
    if: startsWith(github.ref, 'refs/heads/release/arena-d-') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/personal-learning' || github.ref == 'refs/heads/hostinger-preview' || github.ref == 'refs/heads/codex/learning-review-ux' || github.ref == 'refs/heads/codex/five-course-import' || github.ref == 'refs/heads/codex/smartboard-lessons' || github.ref == 'refs/heads/codex/assignment-source-privacy'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          # Disposable runner service, exposed only on loopback. The test creates
          # random application credentials with access to one new test database.
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_ROOT_HOST: "%"
        ports:
          - 127.0.0.1:3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Check student dashboard model
        run: npx tsx --test tests/student-dashboard-model.test.ts
      - name: Check teacher dashboard model
        run: npx tsx --test tests/teacher-dashboard-model.test.ts tests/teacher-review-model.test.ts
      - name: Check admin dashboard and task report models
        run: npx tsx --test tests/admin-overview-model.test.ts tests/task-reports-model.test.ts
      - name: Validate content package schema and complete-answer projections
        run: npx tsx --test tests/content-packages.test.ts tests/content-rational.test.ts tests/content-series.test.ts tests/content-matrices.test.ts tests/content-polar.test.ts tests/content-vectors.test.ts tests/content-induction.test.ts tests/content-stats-crv.test.ts tests/content-stats-inference.test.ts tests/content-stats-chi2.test.ts tests/content-stats-nonparam.test.ts tests/content-stats-pgf.test.ts tests/content-fp2-hyperbolic.test.ts tests/content-fp2-matrices2.test.ts tests/content-fp2-differentiation.test.ts tests/content-fp2-integration.test.ts tests/content-fp2-complex.test.ts tests/content-fp2-ode.test.ts tests/content-mechanics-projectiles.test.ts tests/content-mechanics-equilibrium.test.ts tests/content-mechanics-circular.test.ts tests/content-mechanics-hooke.test.ts tests/content-mechanics-variable.test.ts tests/content-mechanics-momentum.test.ts tests/exact-pi.test.ts tests/question-layout.test.ts tests/course-tree.test.ts tests/further-seo.test.ts
      - name: Check teacher self-service authoring boundaries
        run: npx tsx --test tests/teacher-account.test.ts tests/teacher-authoring-model.test.ts tests/math-editor-model.test.ts
      - name: Verify course mathematics
        run: |
          python3 -m pip install sympy==1.14.0 antlr4-python3-runtime==4.11.1
          python3 scripts/content/verify-fp1-roots.py --report /tmp/arena-c1-maths.json
          python3 scripts/content/verify-fp1-rational.py --report /tmp/arena-c2-rational-maths.json
          python3 scripts/content/verify-fp1-series.py --report /tmp/arena-c2-series-maths.json
          python3 scripts/content/verify-fp1-matrices.py --report /tmp/arena-c2-matrices-maths.json
          python3 scripts/content/verify-fp1-polar.py --report /tmp/arena-c2-polar-maths.json
          python3 scripts/content/verify-fp1-vectors.py --report /tmp/arena-c2-vectors-maths.json
          python3 scripts/content/verify-fp1-induction.py --report /tmp/arena-c3-induction-maths.json
          python3 scripts/content/verify-stats-crv.py --report /tmp/arena-c5-crv-maths.json
          python3 scripts/content/verify-stats-inference.py --report /tmp/arena-c5-inference-maths.json
          python3 scripts/content/verify-stats-chi2.py --report /tmp/arena-c5-chi2-maths.json
          python3 scripts/content/verify-stats-nonparam.py --report /tmp/arena-c5-nonparam-maths.json
          python3 scripts/content/verify-stats-pgf.py --report /tmp/arena-c5-pgf-maths.json
          python3 scripts/content/verify-fp2-hyperbolic.py --report /tmp/arena-c5-fp2-hyperbolic-maths.json
          python3 scripts/content/verify-fp2-matrices2.py --report /tmp/arena-c5-fp2-matrices2-maths.json
          python3 scripts/content/verify-fp2-differentiation.py --report /tmp/arena-c5-fp2-differentiation-maths.json
          python3 scripts/content/verify-fp2-integration.py --report /tmp/arena-c5-fp2-integration-maths.json
          python3 scripts/content/verify-fp2-complex.py --report /tmp/arena-c5-fp2-complex-maths.json
          python3 scripts/content/verify-fp2-ode.py --report /tmp/arena-c5-fp2-ode-maths.json
          python3 scripts/content/verify-mechanics-projectiles.py --report /tmp/arena-c5-mechanics-projectiles-maths.json
          python3 scripts/content/verify-mechanics-equilibrium.py --report /tmp/arena-c5-mechanics-equilibrium-maths.json
          python3 scripts/content/verify-mechanics-circular.py --report /tmp/arena-c5-mechanics-circular-maths.json
          python3 scripts/content/verify-mechanics-hooke.py --report /tmp/arena-c5-mechanics-hooke-maths.json
          python3 scripts/content/verify-mechanics-variable.py --report /tmp/arena-c5-mechanics-variable-maths.json
          python3 scripts/content/verify-mechanics-momentum.py --report /tmp/arena-c5-mechanics-momentum-maths.json
          python3 scripts/content/verify-momentum-teaching.py --report /tmp/arena-c5-mechanics-momentum-teaching.json
      - name: Check portable dependency aliases
        run: node --test tests/package-links.test.mjs
      - name: Check consent and public-only analytics
        run: node --test tests/platform-statistics.test.mjs
      - name: Check safe startup diagnostics
        run: npx tsx --test tests/hostinger-diagnostics.test.ts tests/hostinger-runtime.test.ts tests/image-previews.test.ts tests/bank-materials.test.ts tests/request-diagnostic.test.ts tests/transport-response.test.ts tests/bank-upload-queue.test.ts tests/presentation-url.test.ts
      - name: Check Release D bundle, mathematics and provenance guards
        run: npx tsx --test tests/release-d.test.ts tests/content-origin.test.ts tests/content-stage6b.test.ts tests/square-learning.test.ts tests/quadratics-learning.test.ts tests/view-lens.test.ts
      - name: Verify populated database migration and pilot publication
        run: npx tsx --test tests/pilot-migration.test.ts
        env:
          HOSTINGER_TEST_CREATE_DATABASE: '1'
      - name: Build without database configuration
        # No production secrets or database variables are available to this step.
        run: npm run build
      - name: Test standalone startup, migrations and repeat deployment
        run: node --test tests/hostinger-package.test.mjs
        env:
          HOSTINGER_TEST_CREATE_DATABASE: '1'
          HOSTINGER_TEST_MYSQL_HOST: 127.0.0.1
          HOSTINGER_TEST_MYSQL_PORT: '3306'
